# Geometry and convergence (T-37, QUESTIONS PHY-11, part of OUT-7). Format: crates/paramgen/src/lib.rs. Each id
# is defined once in the whole params/ folder. Units: "1" means dimensionless.
# Read by the `screen` slot (shaders/include/geometry.glsl, called from beam_eval in shaders/include/beam.glsl;
# oracle crates/crt-model/src/geometry.rs). Every default is the identity: flat faceplate, no residual
# distortion, no overscan, no misconvergence. The mask stays in tube coordinates (host pixels of the tube
# rectangle); only the beam position is moved.

[[param]]
id = "geometry_curvature"
stage = "geometry"
type = "enum"
unit = "1"
default = "flat"
values = ["flat", "spherical", "cylindrical"]
tag = "K"
source = "CRT.md Faceplate curvature: spherical 1R to 8R, cylindrical (Trinitron, Diamondtron: curved horizontally, flat vertically), flat outer face [T-87: was S; the zero default is the neutral identity (no distortion), not a sourced value; CRT.md gives residual ranges per tube class]"
description = "Shape of the phosphor surface. Flat: no curvature (identity). Spherical: radius geometry_radius_mm in both axes. Cylindrical: radius geometry_radius_mm horizontally, flat vertically."
group = "Geometry"

[[param]]
id = "geometry_radius_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 852.8
min = 300.0
max = 50000.0
hard_min = 100.0
hard_max = 1000000.0
hard_why = "a positive radius; below about the half diagonal the rays miss the surface (black corners); 1 km is flat"
tag = "D"
source = "CRT.md Faceplate curvature: 1R = 1.767 x viewable diagonal; 19 in viewable (482.6 mm): 852.8 mm, corner sagitta 34.85 mm. Trinitron horizontal radius about 1600 to 2100 mm (US 5,386,174)"
description = "Radius of curvature of the phosphor surface (horizontal radius for a cylindrical faceplate). Unused when flat."
group = "Geometry"

[[param]]
id = "geometry_eye_distance_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 0.0
min = 0.0
max = 5000.0
hard_min = 0.0
hard_max = 100000.0
hard_why = "0 puts the eye at infinity; a distance is not negative"
tag = "E"
source = "CRT.md Faceplate curvature: typical monitor viewing distance 500 to 650 mm (1.0 to 1.3 diagonals of a 19 in tube); 0 = eye at infinity (parallel projection)"
description = "Distance from the eye to the centre of the faceplate, on the tube axis. The eye looks through each host pixel at the curved surface (ray cast, no refraction). 0 puts the eye at infinity (parallel view)."
group = "Geometry"
advanced = true

[[param]]
id = "geometry_overscan_x"
stage = "geometry"
type = "f32"
unit = "1"
default = 0.0
min = -0.1
max = 0.15
hard_min = -0.5
hard_max = 1.0
hard_why = "the raster keeps a positive size (1 + overscan at least 0.5)"
tag = "K"
source = "CRT.md Visible area, overscan, corners: BVM-D 5 % normal scan, 3 % underscan; PVM-20S1WU 7 %; consumer TVs 5 to 10 % per axis; PC monitors underscanned [T-87: was S; the zero default is the neutral identity (no distortion), not a sourced value; CRT.md gives residual ranges per tube class]"
description = "Horizontal overscan: the raster is wider than the visible area by this fraction (0.05 puts the source edges 5 % of the width outside). Negative values underscan."
group = "Geometry"

[[param]]
id = "geometry_overscan_y"
stage = "geometry"
type = "f32"
unit = "1"
default = 0.0
min = -0.1
max = 0.15
hard_min = -0.5
hard_max = 1.0
hard_why = "the raster keeps a positive size (1 + overscan at least 0.5)"
tag = "K"
source = "CRT.md Visible area, overscan, corners: BVM-D 5 % normal scan, 3 % underscan; PVM-20S1WU 7 %; consumer TVs 5 to 10 % per axis [T-87: was S; the zero default is the neutral identity (no distortion), not a sourced value; CRT.md gives residual ranges per tube class]"
description = "Vertical overscan: the raster is taller than the visible area by this fraction. Negative values underscan."
group = "Geometry"

[[param]]
id = "geometry_pincushion"
stage = "geometry"
type = "f32"
unit = "1"
default = 0.0
min = -0.05
max = 0.05
hard_min = -0.3
hard_max = 0.3
hard_why = "beyond about 0.3 of the half diagonal the residual map stops being invertible (the raster folds)"
tag = "K"
source = "CRT.md Raster distortions and corrections: pincushion/barrel residual under 0.5 to 1 % on monitors, 1 to 3 % on TVs [T-87: was S; the zero default is the neutral identity (no distortion), not a sourced value; CRT.md gives residual ranges per tube class]"
description = "Residual pincushion (positive) or barrel (negative): radial displacement of the raster at the picture corner, as a fraction of the half diagonal, growing with the square of the distance from the centre."
group = "Geometry"

[[param]]
id = "geometry_trapezoid"
stage = "geometry"
type = "f32"
unit = "1"
default = 0.0
min = -0.05
max = 0.05
hard_min = -0.5
hard_max = 0.5
hard_why = "keeps both raster edges a positive width (the inverse divides by 1 + t y)"
tag = "K"
source = "CRT.md Raster distortions and corrections: trapezoid (keystone) residual under 1 % [T-87: was S; the zero default is the neutral identity (no distortion), not a sourced value; CRT.md gives residual ranges per tube class]"
description = "Residual trapezoid: relative change of the raster width at the bottom edge (positive: wider at the bottom, narrower at the top), linear in the height."
group = "Geometry"

[[param]]
id = "geometry_rotation_deg"
stage = "geometry"
type = "f32"
unit = "deg"
default = 0.0
min = -2.0
max = 2.0
hard_min = -180.0
hard_max = 180.0
hard_why = "one full turn"
tag = "K"
source = "CRT.md Raster distortions and corrections: rotation (tilt) from the Earth's field, up to 1 to 2 degrees uncorrected [T-87: was S; the zero default is the neutral identity (no distortion), not a sourced value; CRT.md gives residual ranges per tube class]"
description = "Raster rotation (tilt) about the tube centre, positive clockwise as seen on the screen."
group = "Geometry"

[[param]]
id = "geometry_opening_corner_radius_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 0.0
min = 0.0
max = 60.0
hard_min = 0.0
hard_max = 1000.0
hard_why = "a radius is not negative; geometry.glsl limits it to half the opening"
tag = "E"
source = "CRT.md Visible area, overscan, corners: the visible opening is a rounded rectangle (phosphor area and bezel), corner radius about 15 to 40 mm (3 to 8 % of the screen height) on older tubes, near zero on flat ones"
description = "Corner radius of the visible opening, the tube's visible area (tube_visible_height_mm x tube_aspect). The light is clipped to the opening: exactly 0 on host pixels whose centre is half a pixel or more outside, antialiased over one host pixel at the edge. 0 = square corners."
group = "Geometry"

# Chromatic aberration (QUESTIONS PHY-17, owner request 2026-11-20): colour fringes as on a real tube with imperfect
# convergence, red and blue mirrored about green (oracle crt_model::geometry::Chroma). Added to the convergence
# controls below; both amounts 0 (the defaults) is the identity, bit for bit. Each beam moves by half of an amount,
# so the hard limit of 20 mm keeps each beam within the 10 mm of the convergence controls.

[[param]]
id = "geometry_chroma_lateral_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 0.0
min = -10.0
max = 10.0
hard_min = -20.0
hard_max = 20.0
hard_why = "each beam moves by half of it: 20 mm is the 10 mm limit of one beam's misconvergence; the reach of the beam sums grows with it (frame cost)"
tag = "E"
source = "CRT.md Convergence, purity and landing: in-line red and blue errors roughly mirror images about green, growing with the distance from the centre; 0.3 to 0.8 mm at the corners on monitors, up to 2 mm on TVs, 2 to 3 mm on cheap sets. 0 = off (the neutral identity)"
description = "Colour fringes growing toward the edges: how far apart red and blue land at the picture corner, along the line from the centre. Red moves outward by half of it, blue inward by the other half, green stays. Negative: red inward. 0 = off. Recommended: 0.5 to 1 mm for a monitor, 1.5 to 2 mm for a TV. Above about 2 mm the fringes get strong and a colour moire can appear at the sides (3 mm, live review 2026-11-20)."
group = "Chromatic aberration"

[[param]]
id = "geometry_chroma_axis_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 0.0
min = 0.0
max = 5.0
hard_min = 0.0
hard_max = 20.0
hard_why = "a distance is not negative (the angle gives the direction); each beam moves by half of it, at most the 10 mm limit of one beam's misconvergence"
tag = "E"
source = "CRT.md Convergence, purity and landing: static (centre) misconvergence 0.2 to 0.6 mm on monitors, 0.5 to 1.5 mm on TVs. 0 = off (the neutral identity)"
description = "Colour fringes of the same size everywhere: how far apart red and blue land, in the direction set by the angle. Red moves by half of it, blue by the other half the opposite way. 0 = off. Recommended: 0.2 to 0.5 mm."
group = "Chromatic aberration"

[[param]]
id = "geometry_chroma_angle_deg"
stage = "geometry"
type = "f32"
unit = "deg"
default = 0.0
min = -180.0
max = 180.0
hard_min = -180.0
hard_max = 180.0
hard_why = "one full turn"
tag = "E"
source = "CRT.md Convergence, purity and landing: in-line errors mostly horizontal (0 deg). Direction convention as geometry_rotation_deg (clockwise on the screen)"
description = "Direction in which red moves for the axis amount: 0 = red to the right, 90 = red down, 180 = red to the left, -90 = red up (blue always the opposite way). No effect while the axis amount is 0."
group = "Chromatic aberration"

[[param]]
id = "geometry_chroma_edge_exponent"
stage = "geometry"
type = "f32"
unit = "1"
default = 2.0
min = 1.0
max = 3.0
hard_min = 1.0
hard_max = 4.0
hard_why = "below 1 the fringe has a kink at the centre (not smooth) and the tile path's bound at the tile corners no longer holds; above 4 almost all of it sits in the last tenth of the radius"
tag = "E"
source = "CRT.md Convergence, purity and landing: model static centre offset plus a quadratic polynomial per channel, so 2 (the growth of the radial convergence controls) is the default; 1 = linear growth, 3 = strongly toward the corners"
description = "How the lateral fringes grow from the centre to the corner: 1 = evenly (linear), 2 = slowly at first then faster (the usual tube), 3 = almost only near the corners. No effect while the lateral amount is 0."
group = "Chromatic aberration"

[[param]]
id = "geometry_conv_red_dx_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 0.0
min = -2.0
max = 2.0
hard_min = -10.0
hard_max = 10.0
hard_why = "a misconvergence beyond 10 mm is not a working tube; the reach of the beam sums grows with it (frame cost)"
tag = "K"
source = "CRT.md Convergence, purity and landing: BVM-D20 under 0.4 mm centre, PC monitors 0.2 to 0.3 mm, consumer TVs 0.5 to 1.5 mm; model: static centre offset plus a quadratic polynomial per channel [E] [T-87: was S; the zero default is the neutral identity (perfect convergence), not a sourced value; CRT.md gives errors per tube class]"
description = "Static horizontal misconvergence of the red beam (positive: red lands to the right)."
group = "Convergence"

[[param]]
id = "geometry_conv_red_dy_mm"
stage = "geometry"
type = "f32"
unit = "mm"
default = 0.0
