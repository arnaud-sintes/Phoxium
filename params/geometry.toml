hard_min = -10.0
hard_max = 10.0
hard_why = "a misconvergence beyond 10 mm is not a working tube; the reach of the beam sums grows with it (frame cost)"
tag = "K"
source = "CRT.md Convergence, purity and landing (static centre offset per channel) [T-87: was S; the zero default is the neutral identity (perfect convergence), not a sourced value; CRT.md gives errors per tube class]"
description = "Static vertical misconvergence of the red beam (positive: red lands lower)."
group = "Convergence"

