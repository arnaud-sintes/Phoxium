# Automatic beam limiting (ABL) and raster breathing (T-35, QUESTIONS PHY-13). Format:
# crates/paramgen/src/lib.rs. Each id is defined once in the whole params/ folder. Units: "1" means dimensionless.
# Read by the `abl` slot (shaders/abl.comp, shaders/reduce.comp; oracle crates/crt-model/src/abl.rs).
# APL = mean over the raster of (I_r + I_g + I_b) / 3 of the unlimited beam current (1 = full-field white).
# Off by default (professional monitors have very mild ABL; the reference presets keep it off).

[[param]]
id = "abl_enable"
stage = "abl"
type = "bool"
unit = "1"
default = false
tag = "E"
source = "CRT.md ABL, blooming and EHT regulation: consumer TVs limit, PVM/BVM and good monitors have very mild ABL"
description = "Automatic beam limiting: the frame's average beam current, low-passed in time, lowers the beam current of the next frame above a threshold (one frame of latency). Off: the slot is an exact identity."
group = "ABL"

[[param]]
id = "abl_full_white_ma"
stage = "abl"
type = "f32"
unit = "mA"
default = 2.8
min = 0.3
max = 6.0
tag = "E"
source = "Estimate; with abl_tau_s 0.1667 s, 2.8 mA = 2 x abl_threshold_ma puts the limiter onset of a black-to-white step at tau ln 2 = 0.116 s, the 0.1 s onset of CRT.md (US 4,330,792) [D]"
description = "Average anode current of full-field white at full drive, without limiting. The frame APL times this value is compared with the threshold."
group = "ABL"

[[param]]
id = "abl_threshold_ma"
stage = "abl"
type = "f32"
unit = "mA"
default = 1.4
min = 0.3
max = 2.0
tag = "S"
source = "CRT.md ABL (T-63): RCA/Thomson average limiter at 1.4 mA, about 1 or 0.7 mA in a peak-responsive mode (US 5,313,294); 0.5 to 2 mA on TVs, 0.3 to 1 mA on monitors [E]"
description = "Average anode current above which the limiter lowers the gain. Lower it (1.0 or 0.7 mA) for the peak-responsive mode of the RCA patent."
group = "ABL"

[[param]]
id = "abl_full_white_ratio"
stage = "abl"
type = "f32"
unit = "1"
default = 0.5
min = 0.3
max = 1.0
tag = "E"
source = "CRT.md ABL: full-field white typically 30 to 60 % of a small white window on consumer sets (no source found)"
description = "Steady luminance of full-field white over that of a small window below the threshold. Sets the gain slope k = (1/ratio - 1) / (full white current - threshold), in g = 1 / (1 + k max(0, I - threshold))."
group = "ABL"

[[param]]
id = "abl_tau_s"
stage = "abl"
type = "f32"
unit = "s"
default = 0.1667
min = 0.0
max = 1.0
tag = "D"
source = "CRT.md ABL (T-63): steady state about 0.5 s after the threshold is crossed (US 4,330,792); a first-order low-pass is within 5 % at 3 tau, so tau = 0.5 / 3 s. Prior-art filter about 5 fields (US 4,689,668)"
description = "Time constant of the low-pass of the average beam current, on real frame times (63.2 % of a step after tau). 0 follows each frame at once."
group = "ABL"

[[param]]
id = "abl_breathing"
stage = "abl"
type = "f32"
unit = "1"
default = 0.0
min = 0.0
max = 0.05
tag = "E"
source = "CRT.md Raster blooming: EHT sag enlarges the raster (size ~ 1/sqrt(V)); consumer TVs 1 to 5 % between black and white, broadcast under 1 % [S][E]"
description = "Raster breathing: relative change of the raster size between APL 0 and 1, raster_scale = 1 + b (filtered APL - abl_breathing_ref); positive enlarges with brightness. 0 keeps raster_scale exactly 1. Works with the limiter off. Applied to the beam position by the geometry stage (T-37)."
group = "ABL"

[[param]]
id = "abl_breathing_ref"
stage = "abl"
type = "f32"
unit = "1"
default = 0.5
min = 0.0
max = 1.0
tag = "E"
source = "Estimate: the raster size is set up at a mid picture level"
description = "Filtered APL at which the raster has its nominal size."
group = "ABL"

[[param]]
id = "abl_probe"
stage = "abl"
type = "bool"
unit = "1"
default = false
tag = "E"
source = "Diagnostic, not physical (tests and the UI readout)"
description = "Diagnostic: writes the ABL state (gain, filtered APL, raster_scale, last frame APL) into texel (0, 0) of the abl output instead of the picture."
group = "ABL"
