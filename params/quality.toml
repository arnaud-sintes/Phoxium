# Quality and performance settings (PLAN T-48, QUESTIONS PRF-2 and OUT-6; src/quality.rs). Format:
# crates/paramgen/src/lib.rs. Each id is defined once in the whole params/ folder. These are not tube parameters:
# they choose how exactly the model is evaluated, never the physics, and a preset change keeps them
# (controls::keep_session_params). The tier table (cost and measured error per tier) is in ARCHITECTURE 3.7
# "Quality tiers".

[[param]]
id = "quality_tier"
stage = "quality"
type = "enum"
unit = "1"
default = "standard"
values = ["exact", "standard", "fast", "low"]
tag = "D"
source = "PLAN T-48 (tiers change only approximation, never physics), QUESTIONS PRF-2; measured cost and error per tier: ARCHITECTURE 3.7 Quality tiers"
description = "How exactly the CRT model is evaluated. exact: every stage as written, no approximation added (the slowest). standard (default): the beam of a flat tube is computed once per raster line and column (the curved tubes' method), within 0.5 % of white mean and 4 % max of exact. fast: also fewer amplifier sub-samples (as many as the host pixels resolve) and the line profiles of every tube at the coarsest safe grid, within 1 % of white mean. low: also a shorter beam reach (3 instead of 4 sigma) and a coarser line grid; the largest error, documented in the tier table. The look parameters are never changed."
group = "Performance"

[[param]]
id = "quality_auto"
stage = "quality"
type = "bool"
unit = "1"
default = false
tag = "D"
source = "QUESTIONS OUT-6 (on overrun, drop to a lower quality tier and report it), PRF-2; off by default so the picture never changes unasked"
description = "Automatic quality drop on sustained overrun. On: when the GPU frame time stays above the refresh period for 3 s, the next lower tier is used (shown in the title and the overlay); it comes back one tier at a time after 10 s with at least 35 % headroom, waiting longer after each drop. Off (default): the selected tier is always used."
group = "Performance"
