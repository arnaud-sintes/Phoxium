# Shared tube colorimetry, read by the gun stage (T-34) and the output stage (T-46). Format:
# crates/paramgen/src/lib.rs. Each id is defined once in the whole params/ folder.
# Defaults: SMPTE-C primaries with a D65 white (CRT.md, "Chromaticity (CIE 1931 xy)" and "White point").
# Presets override them with measured tube sets (CRT.md lists several).

[[param]]
id = "tube_red_xy"
stage = "colour"
type = "vec2"
unit = "CIE 1931 xy"
default = [0.630, 0.340]
min = 0.0
max = 0.9
hard_min = 0.0
hard_max = 1.0
hard_why = "CIE 1931 xy coordinates lie in [0, 1]; a degenerate gamut falls back to the identity colour matrix"
tag = "K"
source = "CRT.md Chromaticity: SMPTE-C (RP 145 / 170M) red [T-87: was S; SMPTE-C is a standard used as the neutral default; it is not sourced for any particular tube]"
description = "Chromaticity of the red phosphor."
group = "Colour"

