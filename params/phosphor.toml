# Phosphor stage parameters (ARCHITECTURE section 5, step 5; shaders/phosphor.comp, src/gpu/stages/phosphor.rs).
# Format: crates/paramgen/src/lib.rs. Each id is defined once in the whole params/ folder. Units: "1" means
# dimensionless. T-41: persistence as a frame feedback (CRT.md rule 8, "Decay and persistence"; QUESTIONS
# PHY-12), decaying in real time by default (review R-11: the measured frame period, clamped to 250 ms, review
# R-10). The decay constants are the Kuhn (2002) P22 fits of crt-model (phosphor.rs, KUHN_RED, KUHN_GREEN,
# KUHN_BLUE); the presets choose them later (T-64).

[[param]]
id = "phosphor_persistence"
stage = "phosphor"
type = "bool"
unit = "1"
default = false
tag = "D"
source = "CRT.md Decay and persistence (Kuhn 2002 P22 impulse responses, per-frame energy ratios E_k / E_0) and Display rate (60 Hz: persistence only as a frame-to-frame trail); QUESTIONS PHY-12 (frame-integrated first, afterglow feedback optional)"
description = "Phosphor persistence on or off. On: each frame also shows the decaying afterglow of the previous frames (green and blue trail about 5, 3, 2 % of a frame at 60 Hz, red none); a static picture keeps its brightness. Off: the picture passes unchanged."
group = "Phosphor"

# Owner feedback 2026-11-21 (QUESTIONS PHY-18): "the persistence is too much". One global balance of the whole
# trail, applied to the output of the recurrence: out = mix(x, y, blend), x the frame without any trail, y the frame
# with the full trail (the measured decay, the decay scale and the extra afterglow). The history keeps running
# unchanged, so a change is instant (no restart, no flash) and a static picture keeps its brightness at any value.
# Oracle crates/crt-model/src/phosphor.rs (`blend_trail`, `blended_trail_ratio`).

[[param]]
id = "phosphor_persistence_blend"
stage = "phosphor"
type = "f32"
unit = "1"
default = 0.5
min = 0.0
max = 1.0
hard_min = 0.0
hard_max = 1.0
hard_why = "a mix between the picture without any trail (0) and the picture with the full trail (1); outside 0 to 1 it would invert or exaggerate the trail"
tag = "E"
source = "Owner feedback 2026-11-21 (QUESTIONS PHY-18): artistic balance, not a measurement; out = mix(no trail, full trail, blend), linear light. 1 is the full modelled trail (the measured P22 at the other defaults); the default 0.5 halves it (owner decision: the full trail looked too strong)"
description = "How much of the afterglow trail is shown, from 0 (no trail at all) to 1 (the full trail: the measured phosphor plus Decay scale and Extra afterglow). The default 0.5 shows half of it, because the full trail looked too strong. Only the trail changes: a still picture keeps its brightness at any value, and a change takes effect at once."
group = "Phosphor"

[[param]]
id = "phosphor_frame_rate_hz"
stage = "phosphor"
type = "f32"
unit = "Hz"
default = 0.0
min = 0.0
max = 480.0
tag = "D"
source = "CRT.md Display rate: every output frame is one tube frame, so the trail is sampled at the output frame period; the decay itself is a function of time (Decay and persistence: impulse response I(t)), so the default follows the real time between frames (review R-11, owner decision: real time); 50 and 120 Hz rows of the Decay and persistence table"
description = "Time base of the trail. 0 (default): real time, the trail decays by the time that really passed between two output frames (measured; a pause longer than 250 ms counts as 250 ms), so it lasts as long at 144 Hz as at 60 Hz; the decay weights are fitted for the measured display rate (10 to 240 Hz, whole hertz). A positive value: manual, every output frame decays the trail by exactly 1 / rate, whatever time passed (a deterministic frame count, for tests and comparisons)."
group = "Phosphor"
advanced = true

[[param]]
id = "phosphor_tail_strength_rgb"
stage = "phosphor"
type = "vec3"
unit = "1"
default = [1.0, 1.0, 1.0]
min = 0.07
max = 10.0
hard_min = 0.0
hard_max = 10.0
hard_why = "a non-negative multiplier of the measured tail (0 removes it); 0.07 to 1 is the physical range (Ni-killed to plain P22 sulfides), above 1 is an artistic extension beyond the measured P22, and above 10 the trail no longer changes (the tail already carries almost all of a frame's energy)"
widget = "log"
tag = "E"
source = "CRT.md Research pass T-63, preset values item 1: 0.07 to 1 times the power-law term follows the Sony patent Ni-killer residual ratios (0.072 / 0.966, US 5,825,124); applying the ratio to the power-law term alone is an assumption. Above 1: artistic, not measured (owner feedback 2026-11-20, QUESTIONS PHY-17)"
description = "Strength of the long power-law afterglow tail per channel (red, green, blue), relative to the measured P22 tail (1). 0.07 to 1 is physical: low values model Ni-killed sulfide phosphors with a shorter trail. Above 1 is beyond the measured P22 (non-physical) and changes little: at 60 Hz the tail already carries 98 % of a frame's own light, so 10 raises the green trail from 5.36 % to only 5.44 % of a frame. For a longer, clearly visible trail use Decay scale or Extra afterglow. Red has no power-law tail, so its value has no effect."
group = "Phosphor"

# Owner feedback 2026-11-20 (QUESTIONS PHY-17): the measured P22 trail (green and blue about 5, 3, 2 % of a frame
# at 60 Hz, red none) is physically right but hard to see. Two artistic controls, both identities at their
# defaults (the output does not change by one bit): a time-constant multiplier of the measured decay and an extra
# exponential afterglow per channel. Oracle crates/crt-model/src/phosphor.rs (`DecayControls`,
# `DecayFit::controlled_feedback`). CRT.md has decay constants for P22 only (Kuhn 2002), none for the
# long-persistence phosphors (P1, P7, P31, P39), so there is no phosphor-type selector.

[[param]]
id = "phosphor_decay_scale"
stage = "phosphor"
type = "f32"
unit = "1"
default = 1.0
min = 1.0
max = 30.0
hard_min = 0.1
hard_max = 100.0
hard_why = "a time-constant multiplier must be positive; beyond 100 the decay outlasts the 1 s window the trail is fitted over by far, and the fit no longer follows it"
widget = "log"
tag = "E"
source = "Owner feedback 2026-11-20 (QUESTIONS PHY-17): artistic control, not a measurement. Every time constant of the Kuhn (2002) P22 fit (CRT.md Decay and persistence: the exponential taus and the power-law t0) is multiplied by it, I(t) -> I(t / s); 1 is the measured phosphor"
description = "Slows the phosphor decay: every time constant of the measured P22 decay multiplied by this factor. 1 (default) is the measured phosphor; above 1 is non-physical (artistic). The green and blue tail is a power law, nearly scale free, so this mostly lengthens the fast parts: at 60 Hz, 30 raises the green trail from 5.4 % to 11 % of a frame in the next one, and gives red a short trail (24 % of a frame, then 29 % of that per frame). For a long, clearly visible trail use Extra afterglow."
group = "Phosphor"

[[param]]
id = "phosphor_extra_afterglow_rgb"
stage = "phosphor"
type = "vec3"
unit = "1"
default = [0.0, 0.0, 0.0]
min = 0.0
max = 2.0
hard_min = 0.0
hard_max = 10.0
hard_why = "a share of light cannot be negative; at 10 nearly all the light of a moving object goes into its trail"
tag = "E"
source = "Owner feedback 2026-11-20 (QUESTIONS PHY-17): artistic control, not a measurement (CRT.md has no decay constants for long-persistence phosphors such as P7 or P39). The impulse response becomes the mixture (phosphor + g exp(-t / tau)) / (1 + g), the exponential holding g times the phosphor's light within 1 s; the static picture keeps its brightness (crt_model::phosphor::DecayControls)"
description = "Extra afterglow per channel (red, green, blue), beyond the measured P22 (non-physical, artistic): an added glow that fades exponentially with Extra afterglow time and holds this many times the light of the phosphor itself. 0 (default): none, the measured phosphor. 1 at 100 ms: a moving green object shows 0.46 of a still picture's level instead of 0.76, and the next 60 Hz frame still shows 18 % of that where it was (5 % without). A static picture keeps its brightness. Works for red too (which has no measured trail)."
group = "Phosphor"

[[param]]
id = "phosphor_extra_afterglow_time_ms"
stage = "phosphor"
type = "f32"
unit = "ms"
default = 100.0
min = 5.0
max = 1000.0
tag = "E"
source = "Owner feedback 2026-11-20 (QUESTIONS PHY-17): artistic control, not a measurement; the time constant tau of the extra afterglow exp(-t / tau), in real time (the same at any display rate)"
description = "Time constant of the extra afterglow: it falls to 37 % after this time, 5 % after three times it. Real time, so the trail lasts as long at 144 Hz as at 60 Hz. Used only when Extra afterglow is above 0."
group = "Phosphor"

# T-40: phosphor saturation (efficiency droop at high current density; CRT.md "Saturation and ageing"; QUESTIONS
# PHY-14, saturation item). Applied to the light of each tube pixel BEFORE the persistence history (the trail is
# the decay of light already emitted, it does not saturate again): L = I / (1 + s I) per channel, small-signal
# gain 1, maximum light 1 / s. Oracle crates/crt-model/src/phosphor.rs (`saturate`).

[[param]]
id = "phosphor_saturation"
stage = "phosphor"
type = "bool"
unit = "1"
default = false
tag = "E"
source = "CRT.md Saturation and ageing: sulfide phosphors (blue ZnS:Ag, green ZnS:Cu,Al) saturate at high current density, oxysulfide red is more linear, extreme highlights shift toward yellow-red (a few percent or a few hundred K in direct-view tubes) [S][E]; the curve form is an estimate [E]"
description = "Phosphor saturation on or off. On: the light of every pixel is compressed per channel (blue and green more than red), so bright highlights lose output and shift toward yellow-red; dark and mid tones are almost unchanged. Off: the picture passes unchanged."
group = "Phosphor"

[[param]]
id = "phosphor_saturation_rgb"
stage = "phosphor"
type = "vec3"
unit = "1"
default = [0.01, 0.03, 0.06]
min = 0.0
max = 1.0
tag = "E"
source = "CRT.md Saturation and ageing (qualitative: blue and green sulfides saturate more than red; no measured curve in the research, T-63 found none); defaults sized so that a white highlight (light 1) gives 0.990, 0.971, 0.943 (blue relative to red -4.7 %, 'a few percent' of warm shift) [E]; per unit of the white light of the channel, applied to the area-averaged light of the tube pixel [E]"
description = "Saturation strength s per channel (red, green, blue): the light I of a pixel (1 = white) comes out as I / (1 + s I). 0 is linear; the output never exceeds 1 / s. At light 1 the loss is s / (1 + s) (1, 3, 6 % by default); small values change nothing (the relative loss at light I is about s I). Used only while Phosphor saturation is on."
group = "Phosphor"
