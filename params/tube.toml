# Tube size and placement in the host output (T-30: PHY-3, OUT-7). Format: crates/paramgen/src/lib.rs.
# Each id is defined once in the whole params/ folder. Lengths are tube millimetres (PHY-3); the CPU converts
# them to host pixels (src/placement.rs) and passes px per mm and the scanline pitch in `FrameConstants`.
# The black surround is everything of the output outside the tube rectangle: it is always exactly black.

[[param]]
id = "tube_visible_height_mm"
stage = "tube"
type = "f32"
unit = "mm"
default = 290.0
min = 50.0
max = 1000.0
tag = "S"
source = "CRT.md Reference scales: 20 in PVM-20M4U, visible 386 x 290 mm (viewable diagonal = nominal - 1 in, 4:3: 0.6 x 482.6 = 289.6, tabulated rounded to 290)"
description = "Height of the visible area of the tube face. The width follows from tube_aspect."
group = "Tube"

[[param]]
id = "tube_aspect"
stage = "tube"
type = "f32"
unit = "1"
default = 1.3333334
min = 1.0
max = 2.0
tag = "S"
source = "CRT.md Reference scales and QUESTIONS SRC-4: 4:3 default, 16:9 (1.7778) and 16:10 (1.6) tubes as presets"
description = "Aspect (width over height) of the visible area of the tube."
group = "Tube"

[[param]]
id = "tube_height_fraction"
stage = "tube"
type = "f32"
unit = "1"
default = 1.0
min = 0.1
max = 1.0
tag = "E"
source = "QUESTIONS OUT-7: tube raster fitted at a user-set fraction of the output height, black surround"
description = "Fraction of the output height that the raster may occupy (1 = full height). The picture is also limited by the output width; the rest of the output is black surround."
group = "Tube"
