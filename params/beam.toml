# Beam stage parameters (ARCHITECTURE section 5, step 3; shaders/include/beam.glsl). Format:
# crates/paramgen/src/lib.rs. Each id is defined once in the whole params/ folder. Units: "1" means dimensionless.
# T-36a: vertical scanline profile (Gaussian core plus an optional wide Gaussian tail, area-integrated over each
# host pixel). T-36b: horizontal spot over the amp samples (the same round spot) and spot growth with the beam
# current (FWHM at mid drive and at peak, exponent n). Convergence offsets come with T-37 (params/geometry.toml).

[[param]]
id = "beam_fwhm_mid_mm"
stage = "beam"
type = "f32"
unit = "mm"
default = 0.45
min = 0.1
max = 3.0
tag = "E"
source = "CRT.md Measured and estimated spot sizes (working defaults: PC 0.3 to 0.5, PVM/BVM 0.4 to 0.7, TV 0.7 to 1.5 mm FWHM at mid drive) and Starting presets (PVM-20M4U 0.45 mm mid)"
description = "Full width at half maximum of the beam spot core at mid drive (drive voltage 0.5, normalised beam current 0.5^2.4 = 0.1895 with the reference gun gamma 2.4), at the screen centre. Spot sigma = FWHM / 2.3548, the same horizontally and vertically. Equal to beam_fwhm_peak_mm: no spot growth."
group = "Beam"

[[param]]
id = "beam_tail_weight"
stage = "beam"
type = "f32"
unit = "1"
default = 0.0
min = 0.0
max = 0.15
tag = "E"
source = "CRT.md Spot profile: Gaussian core plus a wider Gaussian or exponential tail at about 2 to 10 % weight; Starting presets, Other defaults (tail 2 to 10 % weight)"
description = "Fraction of the beam energy in the wide Gaussian tail of the spot (0 = pure Gaussian). The total energy does not change with it."
group = "Beam"

[[param]]
id = "beam_tail_sigma_ratio"
stage = "beam"
type = "f32"
unit = "1"
default = 3.0
min = 1.5
max = 10.0
tag = "E"
source = "CRT.md Spot profile: a 'wider' Gaussian tail; its width is not sourced (estimate)"
description = "Sigma of the wide tail as a multiple of the core sigma."
group = "Beam"

[[param]]
id = "beam_fwhm_peak_mm"
stage = "beam"
type = "f32"
unit = "mm"
default = 0.8
min = 0.1
max = 3.0
tag = "E"
source = "CRT.md Measured and estimated spot sizes (FWHM at peak white: PC 0.4 to 0.6, PVM/BVM 0.7 to 1.1, TV 1.5 to 2 mm) and Starting presets (PVM-20M4U 0.45 -> 0.8 mm)"
description = "Full width at half maximum of the beam spot core at peak drive (normalised beam current 1). With beam_fwhm_mid_mm and beam_growth_exponent it sets the spot growth law FWHM^2 = d0^2 + k I^(2n). Equal to beam_fwhm_mid_mm: no growth."
group = "Beam"

[[param]]
id = "beam_growth_exponent"
stage = "beam"
type = "f32"
unit = "1"
default = 0.5
min = 0.2
max = 0.5
tag = "E"
source = "CRT.md Spot growth with beam current (d^2 = d0^2 + k I^(2n), n 0.2 to 0.5; projection-gun rule d ~ sqrt(I); black to full white x1.5 to 2.5). 0.5 is the only value of the range that gives the 0.45 -> 0.8 mm defaults a real floor with a black-to-white ratio near 2.5 (0.8 / 0.317 = 2.53); below n = 0.346 they would need a negative floor"
description = "Exponent n of the spot growth law FWHM^2 = d0^2 + k I^(2n) (I the normalised beam current). The floor d0 and k follow from the FWHM at mid drive and at peak. When the two widths would need a negative floor (peak / mid > 0.1895^-n), n is raised to the smallest value that gives a zero floor (pure power law)."
group = "Beam"

[[param]]
id = "beam_quality"
stage = "beam"
type = "enum"
unit = "1"
default = "standard"
values = ["standard", "reference"]
tag = "D"
source = "PLAN T-36c (beam cost) and T-48 (quality tiers change only approximation, never physics; MAE <= 1 % of white between tiers); tests/stage_beam_fast.rs (tolerance contract and measured cost)"
description = "How the beam spot is summed. standard: separable per workgroup tile (exact horizontal profile of each line per column, then the vertical spread with one Gaussian per line and column whose variance is the energy-weighted mean of the samples' variances); plus the second-order term in the spread of those variances; exact without spot growth and on flat stretches, within 0.5 % of white mean and 2.5 % max of the exact form on the test patterns (measured MAE <= 0.01 %). With a curved faceplate, pincushion, trapezoid or rotation the same per-line profiles are computed once per raster line and resampled per host pixel through the geometry (T-91), within 0.5 % of white mean and 4 % max. reference: the exact 2D sum of every sample's own round spot per host pixel (slow)."
group = "Beam"
