# Video amplifier parameters (T-33, slot `amp`, ARCHITECTURE 3.7; CRT.md "Signal path", rule 1). Format:
# crates/paramgen/src/lib.rs. Each id is defined once in the whole params/ folder.
#
# Model (shaders/amp.comp): the native row is a zero-order hold at the pixel clock (CRT.md "Signal path":
# "the source is effectively zero-order-hold ... then low-passed"), filtered in the voltage domain, before
# the gun law, by a Gaussian amplifier: every pixel edge becomes a Gaussian step response of time sigma
# sqrt(ln 2) / (2 pi B) ~ 0.1325 / B (10-90 % rise 0.3396 / B). Rising edges use the bandwidth B, falling
# edges a rise time scaled by `amp_fall_rise_ratio`; both start together after the input edge (10 %
# points aligned), the slower one ends later. Each of the K sub-samples per native pixel holds the exact
# box mean of the amplifier output over its interval, clamped to the local input range (slew limiter).
# Outside the active line the signal is black (blanking): at low bandwidth the first and last columns
# lose some light and the slow-fall tail past the right end is cut; right for a full active line,
# slightly spurious for a crop. Defaults: PC-monitor bandwidth (amplifier not the limit; edge sigma at
# most 0.01 source px is treated as an ideal amplifier, exact hold) so that the default chain stays the
# identity until a tube preset (T-50) sets its own bandwidth.

[[param]]
id = "amp_bandwidth_mhz"
stage = "amp"
type = "f32"
unit = "MHz"
default = 100.0
min = 2.0
max = 400.0
tag = "E"
source = "CRT.md Signal path, RGB path table: consumer TV RGB 4 to 8 MHz, PVM-xxM2U 8 to 15 MHz, PVM/BVM high-res 20 to 30 MHz, PC monitor 100 to 400 MHz (estimates, CRT.md Open data)"
description = "-3 dB bandwidth B of the RGB video amplifier, Gaussian model: 10-90 % rise time 0.3396 / B microseconds. Sets rising edges; falling edges are scaled by amp_fall_rise_ratio. Low values dim isolated vertical lines (filtering before the gun law). The default (PC-monitor class) leaves 240p sources visually unfiltered."
group = "Video amplifier"

[[param]]
id = "amp_pixel_clock_mhz"
stage = "amp"
type = "f32"
unit = "MHz"
default = 5.37
min = 4.0
max = 230.0
tag = "K"
source = "CRT.md Raster timing table: 240p consoles 5.37 to 8 MHz, VGA 640x480 25.175 MHz, UXGA 1600x1200 at 85 Hz 229.5 MHz"
description = "Pixel clock of the source video mode: one native pixel lasts 1 / f microseconds on the scan line. With the bandwidth it sets the amplifier blur in source pixels (sigma = 0.1325 f / B). Not provided by the capture: it comes from the source's video mode."
group = "Video amplifier"

[[param]]
id = "amp_fall_rise_ratio"
stage = "amp"
type = "f32"
unit = "1"
default = 1.0
min = 0.5
max = 3.0
tag = "E"
source = "CRT.md Signal path, adjacent-pixel nonlinearity (Mulligan and Stone 1989; Klein, Hu and Carney 1996; Pelli 1997): the drive amplifier slews differently up and down, the smear trails to the right; the ratio itself is an estimate"
description = "Fall time over rise time of the amplifier (10-90 %). 1 is symmetric. Both transitions start together after an input edge and the slower one ends later, so the smear trails to the right. Above 1 (slow fall) bright detail trails right and isolated bright pixels gain light (area +22.8 % at B = 4 MHz, r = 2; the B = 5 MHz vertical-line dimming goes 19.8 % at r = 1, 11.4 % at r = 2, 3.0 % at r = 3). Below 1 (slow rise) bright detail starts late and isolated bright pixels lose light (24.0 % dimming at r = 0.5, B = 5 MHz), which is what CRT.md's 'an isolated bright pixel is dimmer than one in a run' needs. Presets must pick the direction deliberately. The output stays within the local input range (slew limiter)."
group = "Video amplifier"

# Peaking (consumer "sharpness"), off by default. Linear and DC-preserving: the response gains
# g (1 - G_p(f)), a Gaussian high-pass of -3 dB corner f_p, so every edge response becomes
# (1 + g) Phi(u / sigma) - g Phi(u / sqrt(sigma^2 + sigma_p^2)) with sigma_p = 0.1325 / f_p.

[[param]]
id = "amp_peaking_gain"
stage = "amp"
type = "f32"
unit = "1"
default = 0.0
min = 0.0
max = 1.5
tag = "E"
source = "CRT.md Controls table, Sharpness (consumer): peaking filter in the video path, about +3 to 8 dB around 3 to 4 MHz, 5 to 20 % overshoot; CRT.md Signal path: peaking causes 5 to 20 % overshoot after sharp edges [E]"
description = "High-frequency boost g of the peaking filter. 1 + g is the asymptotic shelf gain far above the corner (0.41 is +3 dB, 1.5 is +8 dB); at the corner itself the boost is only +1.0 dB (g = 0.41) to +3.2 dB (g = 1.5). 0 turns peaking off. Gives an overshoot (outline) after and before horizontal edges only (at B = 8 MHz and a 3.5 MHz corner, about 5.8 % to 26 % over the range); flat fields are unchanged."
group = "Video amplifier"

[[param]]
id = "amp_peaking_mhz"
stage = "amp"
type = "f32"
unit = "MHz"
default = 3.5
min = 1.0
max = 50.0
tag = "E"
source = "CRT.md Controls table, Sharpness (consumer): peaking around 3 to 4 MHz"
description = "Corner frequency of the peaking filter: the boost starts above it (Gaussian high-pass, -3 dB corner). Only used when amp_peaking_gain is above 0."
group = "Video amplifier"

[[param]]
id = "amp_samples"
stage = "amp"
type = "i32"
unit = "1"
default = 4
min = 1
max = 32
tag = "D"
source = "T-33 follow-up (K = 4 over-dims isolated vertical lines by 2.3 / 2.6 / 2.0 / 1.1 points at 5 / 8 / 15 / 30 MHz with a 5.37 MHz clock, K = 16 by under 0.4; an edge sigma of at most 0.01 source px is an exact hold) and presets::recommended_amp_k"
description = "Amplifier sub-samples K per source pixel (the width of the amp image is K times the source width). 4 is the pipeline default and exact when the amplifier is ideal (edge sigma 0.1325 x pixel clock / bandwidth at most 0.01 source px); a slower amplifier needs more (16 above about 0.02 px) or isolated vertical lines come out too dim, and the amp stage costs K times as much. Tube presets set it from their bandwidth. Above about 8 the image width (K x source width) can exceed the GPU limit for wide sources."
group = "Video amplifier"