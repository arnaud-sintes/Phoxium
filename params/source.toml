# Source interpretation (T-30: SRC-3, SRC-4, SRC-5). Format: crates/paramgen/src/lib.rs.
# Each id is defined once in the whole params/ folder. Units: "1" means dimensionless.
# Read by `decode` (source_eotf) and by the CPU placement code (src/placement.rs: the other three).

[[param]]
id = "source_eotf"
stage = "source"
type = "enum"
unit = "1"
default = "drive_voltage"
values = ["drive_voltage", "srgb"]
tag = "E"
source = "QUESTIONS SRC-5 and PLAN D-3: captured values are drive voltages by default; CRT.md rule 9 (sRGB-authored PC content is a per-profile choice)"
description = "Meaning of a captured 8-bit value. drive_voltage: V = code / 255 goes to the gun law (consoles authored for CRT gamma). srgb: the code is decoded with the sRGB EOTF to linear light L, and the drive voltage is V = L^(1/tube gamma), so the tube shows exactly the sRGB luminance (lifted shadows compared with a real tube, CRT.md level-20 example)."
group = "Source"

[[param]]
id = "raster_aspect"
stage = "source"
type = "enum"
unit = "1"
default = "par"
values = ["par", "fill_tube"]
tag = "E"
source = "QUESTIONS SRC-4 and CRT.md Pixel aspect ratio: the tube stretches the raster to the cabinet aspect (fill_tube); par keeps the picture aspect of the source with a pixel aspect ratio"
description = "Shape of the picture on the tube. par: the picture aspect is source width x PAR / source height, centred in the visible area (shrunk to fit when wider than the tube). fill_tube: the raster fills the whole visible area, as on a real tube whatever the pixel count."
group = "Source"

[[param]]
id = "source_par"
stage = "source"
type = "f32"
unit = "1"
default = 1.0
min = 0.5
max = 2.0
hard_min = 0.1
hard_max = 10.0
hard_why = "a positive pixel aspect ratio; the bounds keep the raster at least a pixel wide on any output"
tag = "D"
source = "CRT.md Pixel aspect ratio: NES/SNES 256-wide 8:7 = 1.1429, Genesis H40 32:35 = 0.9143, VGA 320x200 5:6 = 0.8333 (width / height of one source pixel)"
description = "Pixel aspect ratio of a source pixel (width over height), used when raster_aspect is par. 1 is a square-pixel capture."
group = "Source"

[[param]]
id = "line_multiplier"
stage = "source"
type = "i32"
unit = "1"
default = 1
min = 1
max = 2
hard_why = "1 (single scan) or 2 (double scan)"
tag = "D"
source = "QUESTIONS SRC-3 and CRT.md Scanline structure: lines = source rows x multiplier (1 for 240p, 2 for double-scanned 200-line VGA modes), no row resampling"
description = "Scanlines drawn per source row: 1 for ordinary rasters, 2 for double-scanned modes. The scanline pitch is the raster height over source rows x line_multiplier, so 2 halves it."
group = "Source"

# T-96 (PLAN D-13, D-18): how the captured source is mapped to the host output. Read by the CPU placement code
# (src/placement.rs) and the application (src/app.rs: crop and divisor); stored per source profile (settings).

[[param]]
id = "source_scale_mode"
stage = "source"
type = "enum"
unit = "1"
default = "tube"
values = ["tube", "native", "integer", "fit", "fit_free", "manual"]
tag = "E"
source = "PLAN D-13 and D-18 (owner decisions 2026-11-19): scale modes of the source on any host monitor, QUESTIONS OUT-7; manual: TODO Low, manual pixel size (source_pixel_size)"
description = "How large the picture is in the output. tube: sized by the tube (visible height, aspect and height fraction), the physical default. native: one source row = one host pixel, centred (true 1:1). integer: source_scale host pixels per source row (0 = the largest whole factor that fits). fit: the largest whole factor that fits, below 1 a free fit. fit_free: the largest non-integer scale that fits, aspect kept (breaks the scanline and mask alignment with the host pixels). manual: source_pixel_size host pixels per source row, fractional allowed (the same breaking of the alignment unless it is whole). In every mode but tube the host px per mm follows from the picture height over the raster height in mm, so the mask pitch in px per triad scales with the picture."
group = "Source"

[[param]]
id = "source_scale"
stage = "source"
type = "i32"
unit = "1"
default = 0
min = 0
max = 10
hard_why = "0 (automatic) or a manual factor of 1 to 10"
tag = "E"
source = "PLAN D-13 (owner decision 2026-11-19): integer scale x1 to x10, 0 = automatic"
description = "Host pixels per source row in the integer scale mode: 0 = the largest whole factor that fits the output, 1 to 10 manual (reduced to the largest that fits when the output is too small, reported in the readout)."
group = "Source"

[[param]]
id = "source_center"
stage = "source"
type = "bool"
unit = "1"
default = true
tag = "E"
source = "PLAN D-13 (owner decision 2026-11-19): centring with black rectangles around the game zone"
description = "Centre the picture in the output (letterbox or pillarbox). Off: aligned to the top-left corner (debugging)."
group = "Source"

[[param]]
id = "source_rotation"
stage = "source"
type = "enum"
unit = "1"
default = "off"
values = ["off", "counter_clockwise", "clockwise"]
tag = "E"
source = "TODO.md TATE (rotated tube); CRT.md: vertical arcade games run on a tube turned on its side, so the scanlines are the columns of the upright picture"
description = "TATE: the tube is turned a quarter turn, as in a vertical arcade cabinet. The captured picture is upright (a portrait game); the scanlines, the beam, the mask, the geometry and the phosphor run along the tube's own axes, so on screen the scanlines are columns and the mask is turned with the tube. off: an ordinary tube. counter_clockwise: the tube is turned a quarter turn counter-clockwise (its top is on the left of the screen; the first scanline is the rightmost column of the picture). clockwise: turned clockwise (its top is on the right; the first scanline is the leftmost column). The tube (aspect, size) is the landscape tube before it is turned. The host LCD subpixel layout of the mask is not applied while the tube is turned."
group = "Source"

[[param]]
id = "source_flip"
stage = "source"
type = "enum"
unit = "1"
default = "off"
values = ["off", "horizontal", "vertical", "both"]
tag = "E"
source = "TODO Low (owner request): flip. The picture is mirrored before the tube draws it; the tube itself (scanlines, mask, geometry, phosphor) is not mirrored. Applied to the upright picture, so with a quarter turn (source_rotation) it mirrors the picture the player sees"
description = "Mirror the picture: horizontal (left and right swapped), vertical (top and bottom swapped) or both (a half turn). The tube is not mirrored: the scanlines still run in their own direction and the mask keeps its layout. With a quarter turn (TATE) the flip is of the upright picture."
group = "Source"

[[param]]
id = "source_prefilter"
stage = "source"
type = "enum"
unit = "1"
default = "point"
values = ["point", "box", "triangle", "lanczos2", "lanczos3", "sinc"]
tag = "E"
source = "TODO Low (owner request): source pre-filters (sinc, lanczos). How a native pixel is read from a capture that is a whole number of times bigger than the native raster (a divisor above 1, source_divisor_mode); the kernels and their weights are crt_model::prefilter (box, triangle, Lanczos a = 2 and 3, sinc cut at 4 pixels). With a divisor of 1 every kernel is the identity"
description = "How a native pixel is read when the captured window is scaled up by a whole divisor (see Divisor mode). point: the one captured pixel at the middle of the block (the default, exact). box: the mean of the block. triangle: a tent over two native pixels (smooth). lanczos2 and lanczos3: a windowed sinc (sharper, with a little ringing). sinc: a plain sinc cut at four pixels (the sharpest, the most ringing). With a 1:1 capture (divisor 1) every choice is the identity. The filter works on the captured code values, repeats the edge of the picture area (the crop) at its borders, looks at most 16 captured pixels each way from the middle of the block (a large divisor with a wide kernel is truncated: lanczos3 from a divisor of 6, sinc from 5) and costs more with a larger divisor."
group = "Source"

[[param]]
id = "source_pixel_size"
stage = "source"
type = "f32"
unit = "px"
default = 3.0
min = 0.25
max = 16.0
hard_min = 0.05
hard_max = 64.0
hard_why = "host pixels per source row, positive"
tag = "E"
source = "TODO Low (owner request): manual pixel size. Used only by the manual scale mode (source_scale_mode = manual): a fractional number of host pixels per source row, not limited to whole factors; reduced to the largest that fits when the output is too small"
description = "Manual scale mode only: the size of a source pixel (a source row) in host pixels, fractional values allowed (2.5, 3.33...). A non-whole size breaks the alignment of the scanlines and the mask with the host pixels, as fit_free does. Reduced to the largest that fits when the output is too small."
group = "Source"

[[param]]
id = "source_surround_color"
stage = "source"
type = "vec3"
unit = "1"
default = [0.0, 0.0, 0.0]
min = 0.0
max = 1.0
hard_why = "output code values in [0, 1]"
tag = "E"
source = "PLAN D-13 (owner decision 2026-11-19): black rectangles around the game zone by default"
description = "Colour of the output outside the tube rectangle, as output code values (0 to 1 per channel, red green blue). Black by default."
group = "Source"
widget = "color"

[[param]]
id = "source_display_aspect"
stage = "source"
type = "f32"
unit = "1"
default = 0.0
min = 0.0
max = 4.0
hard_min = 0.0
hard_max = 10.0
hard_why = "0 is off, else a positive aspect; a value between 0 and 0.25 becomes 0.25 (Params::constrain: a tinier aspect gives an empty tube)"
tag = "E"
source = "CRT.md Pixel aspect ratio and QUESTIONS SRC-4: a source shown at a forced display aspect (4:3 = 1.3333) whatever its pixel count"
description = "Forced display aspect of the picture (width over height, 4:3 = 1.3333). 0 = off: the aspect comes from source_par (raster_aspect par) or the tube (fill_tube, which wins)."
group = "Source"
advanced = true

[[param]]
id = "source_crop_mode"
stage = "source"
type = "enum"
unit = "1"
default = "auto"
values = ["auto", "manual", "none"]
tag = "E"
source = "QUESTIONS SRC-1 and PLAN D-13: the client area of the window by default, a manual rectangle (--crop or the source profile), or the whole window"
description = "Which part of the captured window is the source. auto: the client area, cropped to the picture found inside its black bars (the Source section's picture area Auto; Whole client area keeps all of it). manual: the crop rectangle of the command line or of the source profile, inside the client area. none: the whole window, frame included."
group = "Source"
advanced = true

[[param]]
id = "source_divisor_mode"
stage = "source"
type = "enum"
unit = "1"
default = "auto"
values = ["auto", "manual", "none"]
tag = "E"
source = "QUESTIONS SRC-2 and PLAN D-13: integer upscale of the source detected (src/scaling.rs), given (--divisor or the source profile), or none"
description = "How the native raster is recovered from an upscaled source. auto: the integer factor is detected from the first informative frames. manual: the divisor of the command line or of the source profile. none: the captured pixels are the native raster (divisor 1)."
group = "Source"
advanced = true

[[param]]
id = "source_colour_target"
stage = "source"
type = "enum"
unit = "1"
default = "none"
values = ["none", "game_boy_color", "game_boy_advance", "super_nintendo_black_boost"]
tag = "E"
source = "TODO, A GBC target, and QUESTIONS.md, Study: source colour targets. Each target is a data file of presets/targets/ with the source of every value (src/targets.rs); the Game Boy Color matrix is a formula of unknown origin quoted by near.sh (colour emulation), so the whole target is an estimate"
description = "The device the source came from: the colours of the picture are transformed into what that device's screen would have shown, before the CRT chain. none leaves the source colours alone (bit for bit). game_boy_color: Game Boy Color (the LCD mixed the three channels and clipped white at 240 of 255). game_boy_advance: Game Boy Advance (steep LCD response, channels mixed). super_nintendo_black_boost: the bsnes 'deep black boost' table (an emulator look, not the console output, never stack it on a gun law) that darkens the shadows for a CRT. It works on the drive voltage, so keep Source meaning on drive_voltage, and it acts on the colours as they come, whether the source was 5-bit quantised or not. For a monochrome phosphor type it acts on the grey the phosphor shows."
group = "Source"
