# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Audit of the colour targets", "Third research pass"
# and "Built, the Atari 2600"). Format: crates/phoxium/src/targets.rs.
# Every key of [signal] has a [provenance] entry "<tag>: <source>" with the CRT.md confidence tag (S sourced, D derived,
# K standard knowledge, E estimate).
schema = 1
id = "atari_2600_tia"
name = "Atari 2600 VCS (TIA, NTSC, computed from the signal, unverified)"
label = "the 128 colours of the Atari 2600 as an NTSC television decodes the TIA's signal (Colour variant: the hue delay of the pot, or the chroma level); derived from a mailing-list analysis and emulator notes, not measured"
kind = "signal"
notes = """
UNVERIFIED: no instrument measurement of a 2600's video signal was found. The numbers below come from a schematic analysis posted to the Stella mailing list in December 2003 by Eric Ball (who called it 'still off'), from the notes of two emulator authors (Gopher2600, jigo2600) and from MAME's notes; the Atari documents (the TIA technical manual, the Field Service Manual) give the structure, not the voltages, and the Ball figures were read second hand from an earlier research pass of this project (the message itself could not be fetched again when this target was built).
The TIA does not make RGB: a colour register (COLUP0, COLUP1, COLUPF, COLUBK) holds a hue (bits 7 to 4, 0 to 15) and a luma (bits 3 to 1, 0 to 7, bit 0 unused), and the chip emits a composite signal made of a luma level and a chroma wave of one fixed amplitude whose phase is the hue. Hue 0 has no chroma (the 8 greys); hue 1 is in phase with the colour burst (the TIA manual); every higher hue is one more step of a delay line, whose spacing is set by a pot on the board (R211, R213 on the 2600A: the Field Service Manual has it trimmed so that hue 1 and hue 15 match 'within one shade'), so that hue 15 sits 14 steps after hue 1. An emulator shows a PC palette computed from that signal with its own settings. This target goes back to the signal: it recognises each pixel as the nearest of the 128 colours by comparison with a fixed reference palette, and shows the colour a television decoder drives the tube with, so the tube's own gamma, primaries and white take over. The colour index of the table is hue x 8 + luma, that is, the colour register divided by 2. It is the same scheme as the Atari 7800 target (atari_7800_maria) and the Atari 8-bit target (atari_8bit_gtia): the 7800's MARIA has 4 luma bits and the 2600's TIA has 3, the numbers differ (a luma of Ball's 0.09 a step, a chroma that is higher over the luma span, no machine measurement), and each target is its own.
The luma: Ball's derivation of the CX2600 and CX2600A video networks (CX2600: SYNC 10k and LM2 12k ohm with BLK connected, a 7.5 IRE setup; CX2600A: SYNC and LM2 27k ohm, BLK open) gives a luma of 0.045 x (COLU and 15) of a span of 92.5 IRE, that is 0.09 a luma step and 0.63 at the top (luma 7), linear; the Gopher2600 notes assume a linear luma as well. The luma of a step is therefore step / 7 of the range from luma 0 to luma 7, which become the tube's black and white (the pedestal of NTSC is not modelled, and the television's contrast and brightness decide the rest). The resistors of the LM0 and LM1 bits and the output stage are not in any source read here, so the ladder of the real board could not be computed (the 7800 target has such a variant; this one has none), and the two board networks (2600 and 2600A) could not be told apart in the numbers, so there is no variant for them.
The chroma: Ball's chroma is 20 IRE over the same 92.5 IRE, 0.2162, equal to the burst, in the units where the top luma is 0.63; over the luma range normalised to 1 that is 0.2162 / 0.63 = 0.3432, the amplitude of the table, the same for every hue but 0 (the other readings in this project's research, 0.21 to 0.343, are over the normalised range or not, a mix that could not be sorted out). Two variants set the other published values: Gopher2600's 0.3 ('assumed', no measurement) and 0.2303, the magnitude of MAME's hue 1 chroma (0.192, -0.127 in I and Q, an observed palette, not a computation). The phase of hue h is 180 - step x (h - 1) degrees on the U axis (Ball: hue 180 - (hue - 1) x 24; the TIA manual: hue 1 on the burst, 180 degrees); the step is the pot. The step of a real machine is whatever the pot was set to and drifts with warm-up: Ball and jigo2600 (BSD-2 as reported, 14 stages of 24 degrees) use 24; the Gopher2600 notes give 25.7 to 26.7 degrees (its default 26.7); 25.7 = 360 / 14 degrees is the value for which hue 15 lands on hue 1, as the Field Service Manual has it calibrated (and as the 7800 target takes); MAME's notes say the power-on phase is about 23 degrees and a long run about 28, and its active table is labelled 26.2. The default is 25.7; the variants are 24, 26.7, and 25.7 with the two other chroma levels. Colours go through the decoder of the composite model (BT.601 luma, U and V scaled 0.492111 and 0.877283), so they return unchanged through that model, and a channel that goes negative is clamped to zero as a tube does.
The burst phase is a recorded conflict, not an open choice here: this target puts hue 1 on the burst, 180 degrees on the U axis (the TIA manual: code 1 in phase with the burst; the NTSC burst is -U), and takes the television's decode as ideal, with its tint control at the centre. The Gopher2600 notes turn the burst by 57 degrees (elsewhere 32.72) in the I and Q plane, and MAME puts hue 1 at -33 degrees in I and Q ('gold', on a CRT; 'green' on a flat panel), which is about 23 degrees off the burst axis: whether a CRT showed hue 1 as gold or as green depends on the television's tint and decoder, and is not settled by any source read. The tube's TV controls (tint) can turn it.
The recognition reference is NOT the model: it is the 128 colours of the NTSC palette of MAME's TIA video device (src/mame/atari/tia.cpp, license:BSD-3-Clause, copyright-holders Wilbert Pol and Stefan Jokisch; the numbers only, with attribution, no code). MAME computes it in code from a table of 16 chroma pairs (I, Q) labelled 'Phase Shift 26.2' (hue 1 at 0.192, -0.127), a luma of step / 7, the usual YIQ-to-RGB matrix and an exponent of 0.9; the 128 values here are that computation done once with those numbers (rounded as MAME rounds them), and a unit test recomputes them from the table, typed independently of the file. MAME's own notes put hue 1 as gold and prefer a phase between 25.7 and 27.7 degrees; its other phase tables (24.7 to 27.7, in the source but not active) are not used. The model's colours are far from MAME's (the unit test prints the mean distance); the reference therefore recognises MAME's own palette exactly and an emulator with another palette (Stella's, which is GPL and was not read, a flat-panel or hand-tuned one) is passed through unchanged when it is farther than the threshold from MAME's colours, or may be taken for a neighbouring colour when it is nearer: that is not checked here, no other palette with a licence was found.
The colours the target shows are the signal model's, not MAME's: a recognised pixel is replaced by the model colour of its index under the chosen variant, so the hue 1 shown is the burst-phase one unless the tube's tint turns it. The model has a linear luma where MAME's greys follow its exponent of 0.9.
Estimated: the chroma-to-burst ratio and the amplitude over the luma (see above), the decode matrix, the television's tint, and the delay of any real machine. A pixel with no reference colour within the threshold (a scaled or smoothed picture, an edited palette) passes through unchanged: use the integer upscale and the nearest-pixel prefilter (the defaults).
Not modelled: PAL machines (only a fitted 30-degree model with an emulator's palette exists, no schematic or measurement of the PAL mechanism: PAL is not built), SECAM machines (an exact 8-colour table, black, blue, red, magenta, green, cyan, yellow, white: SECAM is not built), the 2600A and 2600 networks as separate variants, the ladder luma, the television's controls, the composite crosstalk (use the Composite video section), and the artifact colours of the 2600's very wide pixel clock (they appear in the picture the emulator draws).
"""

[signal]
threshold = 0.05
black_index = 0
white_index = 7

[signal.grid]
hues = 16
lumas = 8
angle = 180.0

[signal.reference]
gain = 1.0
gamma = 1.0
