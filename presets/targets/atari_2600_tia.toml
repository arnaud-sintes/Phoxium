[provenance]
grid = "K: the colour register of the Atari 2600 holds a hue in its high nibble and a luma in bits 3 to 1 (bit 0 is unused), so the index of a colour is hue x 8 + luma = register / 2 (hue 0 has no chroma, 15 hue phases follow); S: hue 1 is in phase with the colour burst (TIA technical manual, 'Television Interface Adaptor Model 1A', Atari copyright, OCR on archive.org: 15 phases, code 1 in phase with the burst), the phase of hue h is tint - (h - 1) x step degrees with the tint 180 (the burst on the -U axis: NTSC) and all hues of one amplitude (Eric Ball, Stella mailing list, December 2003: hue = 180 - (hue - 1) x 24; read second hand); no code is used and no table is copied"
revisions = "S: the step (phase) 24 degrees (Eric Ball's derivation; jigo2600, 14 stages of 24 degrees, licence BSD-2 as reported, not checked), 25.7 to 26.7 degrees with 26.7 as the default of Gopher2600 (its 2025 blog post, all rights reserved: a number is quoted with attribution), about 23 degrees at power-on to about 28 after a long run and the active table of MAME labelled 26.2 (MAME's notes in src/mame/atari/tia.cpp, BSD-3-Clause), the pot trimmed so that hue 1 and hue 15 match within one shade (Atari VCS Field Service Manual, as MAME's notes and Gopher2600 quote it; R211, R213 on the 2600A); D: 25.7 = 360 / 14 degrees, the step for which hue 15 lands on hue 1; S: the luma 0.045 x (COLU and 15) of a 92.5 IRE span, so 0.09 a luma step and 0.63 at luma 7, linear (Eric Ball, schematic-computed, self-described as 'still off', second hand), so luma_mv is the step itself; the networks CX2600 (SYNC 10k, LM2 12k, BLK connected) and CX2600A (SYNC and LM2 27k, BLK open) are not told apart by the numbers; S and D: the amplitude is Ball's chroma 20 / 92.5 = 0.2162 over the luma of luma 7 on his scale, 7 x 0.09 = 0.63, so 0.3432; S: 0.30 is Gopher2600's assumed saturation (no measurement) and 0.2303 is the magnitude of MAME's hue 1 chroma, sqrt(0.192^2 + 0.127^2); E: the chroma equal to the burst, the amplitude over the luma span, the unit of Ball's 0.63 against his 20 / 92.5 (the research pass that recorded them reads 0.343 as this ratio), and the step of any real machine (the default 25.7 is the calibration condition, not a measured setting); the burst phase conflict (180 degrees on the U axis here; 57 or 32.72 degrees in the Gopher2600 notes; MAME's gold hue 1 at -33 degrees in I and Q) is recorded in the notes and not resolved"
reference = "S: the classification reference palette, not an output: the 128 RGB colours computed from the numbers of the NTSC palette of MAME's TIA video device, src/mame/atari/tia.cpp (license BSD-3-Clause, copyright-holders Wilbert Pol, Stefan Jokisch; numbers with attribution, no code): I and Q of the 'Phase Shift 26.2' table, luma step / 7, R = Y + 0.956 I + 0.621 Q, G = Y - 0.272 I - 0.647 Q, B = Y - 1.106 I + 1.703 Q, negatives set to 0, exponent 0.9, rounded; the palette is MAME's own choice, not a measurement; not checked against any other emulator palette (Stella's is GPL and was not read)"
threshold = "E: the largest distance in drive voltage between a pixel and a reference colour at which the pixel is taken for it; MAME's palette is recognised exactly (distance 0); a palette of another emulator that differs more is meant to pass through unchanged rather than be taken for a neighbouring colour (not checked on any other palette)"
black_index = "K: colour 0 (hue 0, luma 0) is the luma 0 of the machine, taken as the black of the tube (the pedestal of NTSC is not modelled: Ball's CX2600 network has a 7.5 IRE setup, the CX2600A none)"
white_index = "K: colour 7 (hue 0, luma 7) is the luma 7 of the machine, taken as the white of the tube (a television's gain control and contrast decide the rest)"
