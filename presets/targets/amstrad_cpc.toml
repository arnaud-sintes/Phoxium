# pass"). Format: crates/phoxium/src/targets.rs. Every key of [dac] has a [provenance] entry "<tag>: <source>" with the CRT.md
# confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "amstrad_cpc"
name = "Amstrad CPC"
label = "the Amstrad CPC 464 / 6128 Gate Array's three levels (27 colours) per channel with the middle level at 0.40 of full scale (not 0.5), behind an emulator picture whose middle level is 128, 127 or MAME's 96, or with a per-channel middle level computed from the 6128's output resistors (variant 4: red 0.38, green 0.42, blue 0.36)"
kind = "dac"
notes = """
The CPC's Gate Array makes each of the three colour channels from one of three levels, off, half and full: 27 colours. An emulator shows the three levels as 0, a middle value and 255; this target moves the middle level to where the hardware puts it, 0.40 of full scale (102 of 255), and leaves black and full alone. The map is a dac of three points per channel with the straight line between them (a scaled picture): the same on red, green and blue.
**Where 0.40 comes from.** The CPCWiki Gate Array page says the half level was measured closer to 40 percent than to 50, credits the measurement to Grim (the Grimware oscilloscope pages, whose domain is gone), and says nocash confirmed it; the CPC Plus ASIC, which has 4 bits a channel, maps its levels to 0, 6 and 15, and 6 / 15 is exactly 0.40, 'to better match the real CPC palette'. None of this was read at its source here: the CPCWiki main site refuses automated reads (HTTP 403, tried again for this target) and the Grimware pages are gone, so the figure is second-hand (the third research pass of QUESTIONS.md, which read it through a search tool and a forum). It is an instrument claim with no voltage on it. 0.40 of 255 is 102.
**What conflicts.** The wiki's own palette table lists the half level as the literal half, 0.5, which is what an emulator shows and what an unloaded Gate Array would give if its three levels were equally spaced. nocash's scope readings on a CPC6128 (100 mV a division, loaded by a Philips television, not an Amstrad monitor) are about 4.0 V for both full and half with nothing connected, about 1.0 V and 0.5 V loaded: a ratio of 0.5 loaded, so one reading supports the literal half. The loaded level depends on the resistor network in the monitor and its cable (the research notes quote 1k, 3.3k and 10k for the luminance mix of the green monitor, and 220 or 270 ohm at the output, from a forum snippet that could not be re-read), and the television is the load that matters, as with the Master System. The target ships the measured 0.40, as the TODO and the Plus ASIC do, and does not claim to know the level a given monitor shows.
**The emulator's input level (the variants).** The CPCWiki palette page (as a search snippet) gives the half level of a modern display as 127 or 128; MAME's palette uses 0x60 (96, 0.376), a figure that came with the notes of the third research pass (MAME's licence is mixed BSD-3 and GPL: the number only, no code or table was copied, and no MAME source was read here, so the figure is not checked and the version that uses it is not known: MAME's CTM644 colours were corrected after a bug report, number 8506, fixed in 0.252, from photographs and no stated numbers). Variant 1 is an emulator that shows 128 (the middle level 128 goes to 102), variant 2 one that shows 127, variant 3 MAME's 96. An emulator whose half level is something else is between the points of the nearest variant and lands on the straight line: 127 on variant 1 comes out at 101.2, one code off 102. The literal 0.5 is not a variant: an emulator already shows it (127 or 128), so mapping it to itself would be an identity.
**The output network and the per-channel variant (variant 4, read 2026-11-26).** The official CPC6128 service manual (the "CPC6128 CPU circuit diagram", sheet M208-01, an Amstrad scan hosted in the repository github.com/pelrun/cpc-schematics under docs/, read on PDF page 17 of that copy at 4.5 times, digits H) shows how the half level is made. Each of the Gate Array's three colour pins (40010: R pin 12, G pin 10, B pin 8) has 680 ohm (R125, R127, R129) to +5 V and goes through 270 ohm (R126, R128, R130) to the monitor connector, with 220 pF (C139 to C141) to ground; the luminance node (the base of Q102, a 2SC1815Y emitter follower into LUM through 180 ohm, R134, with 150 ohm, R136, to ground) is fed from the red pin by 3.3k (R131), from the green pin by 1k (R132), from the blue pin by 10k (R133) and from the sync pin (pin 5, active low, so high in the picture) by 680 ohm (R135); the sync output goes through 220 ohm (R137). So the pin has three states, not three drive levels: **low (0 V), high-impedance (the 680 ohm pull-up against the load: the half level) and high (+5 V)**; that is the 'high impedance trick' of the Shinra Team's article on the Gate Array (pulkomandy.github.io/shinra.github.io/gatearray.html, which draws on Grimware), and why 'R, G, B are pulled up and down by each other' (nocash): the three luminance resistors tie the pins together. The CTM644's RGB inputs (service manual PDF page 26, circuit diagram, read at 3.5 times) are 100 ohm to ground each (R901 to R903, 'CM14: 100 ohm' of the notes agrees), behind a 6.2 V zener (D901 to D903) that is not modelled. The network is a linear resistor network once the pin states are fixed. Computed here (a scratch Rust solve, recomputed from the resistors by the unit test) with **ideal pin drivers (0 V and 5 V, no output resistance), the sync pin high, the 100 ohm CTM644 input, Q102's base current neglected (under 0.1 point of a level with it)**, the level of a channel as a fraction of the same channel at its full state (white), the other two channels in the half state (the grey, colour 13): red 0.3766, green 0.4217, blue 0.3608, that is 96, 108 and 92 of 255, mean 0.387 (so the sourced 0.40 is the average). With the other two channels at 0 or full the half level of a channel moves by up to 3 points: red 0.366 to 0.393, green 0.411 to 0.441, blue 0.356 to 0.368. **Green is 4 to 7 points above red and blue** because the 1k of green is the strongest tie to the luminance node, which the high sync pin pulls up (about 3.5 V), while blue's 10k barely couples: the Grimware remark that green's half is significantly higher than red's and blue's, reproduced here from the resistors. The size of that gap does not depend on the unknowns (green minus blue 5.5 to 7.0 points and green minus red 4.3 to 5.2 in the grey over output resistances of the Gate Array from 1 to 80 ohm high and 1 to 30 ohm low, a 75, 100 or 150 ohm load, and the sync pin; green would be the lowest with the sync pin low, which is only the sync pulse), but the absolute half level does: 0.36 to 0.55 over the same range, since a finite output resistance lowers the full level and so raises the ratio. The numbers relayed from Grimware by the Shinra Team (dark green, colour 9, 47.1154 percent of full intensity; grey, colour 13, 49.0385 percent; blue in yellow, colour 24, 5.2885 percent; each is a whole number over 208: 98, 102 and 11) are matched to a few points by a Gate Array with about 80 ohm high and 30 ohm low output resistances (green alone 48.9, grey 50.0 for green and 5.0 percent for blue in yellow; the two resistances were fitted to those three numbers, so this is a consistency check and not a confirmation), and their reference level is not known (102 is also 0.40 x 255). The Gate Array's output impedance and the real levels are not in any source read; unloaded, the pins sit near 5 V in the model against nocash's 4.0 V for both 'max' and 'half', which an ideal driver does not explain. Variant 4 therefore carries the ideal-driver grey levels (red 96, green 108, blue 92) as a per-channel dac behind an emulator whose half level is 128; the default and variants 1 to 3 keep the one level 0.40 on all channels, because the absolute level is uncertain and the sources that give 0.40 are the only ones that measured it. A one-dimensional map cannot carry the cross-coupling (a channel's half level depends on the other two by up to 3 points): variant 4 is the grey. The monitor's own transfer curve and gamma (CTM644 on the CPC 464 and 6128, CM14 on the Plus: 100 ohm gun load, 0 to 10 mA a gun, linear, per the notes) are not modelled either; the gun law, white point and primaries of the chain's tube take over. The composite and RF output through the modulator is not modelled. The green screen (GT64, GT65) is the separate target amstrad_cpc_green_screen. Analog RGB, so the composite module is not involved.
White scale: full white is 255, 255, 255 in the four variants, untinted (derived: the target moves only the half levels and leaves black and full alone, so the full level of each channel is the unit of the scale and nothing is rescaled; in variant 4 the three channels' full levels are equal in the network, so white stays neutral).
"""

[dac]
output = [0, 102, 255]
output_max = 255.0

[[dac.inputs]]
id = "emulator_128"
name = "Emulator that shows the half level as 128 (CPCWiki: 127 or 128)"
levels = [0, 128, 255]

[[dac.inputs]]
id = "emulator_127"
name = "Emulator that shows the half level as 127"
levels = [0, 127, 255]

[[dac.inputs]]
id = "mame_96"
name = "MAME: half level 0x60 (96), as relayed, unchecked"
levels = [0, 96, 255]

[[dac.inputs]]
id = "network_6128_128"
name = "Per-channel half levels from the 6128's output resistors (CTM644 100 ohm load, ideal drivers), emulator half level 128"
levels = [0, 128, 255]
output = [0, 96, 255]
output_green = [0, 108, 255]
output_blue = [0, 92, 255]

[provenance]
output = "S: the half level is 0.40 of full scale, the CPCWiki Gate Array page (credited to Grim, confirmed by nocash) and the CPC Plus ASIC's 4-bit mapping 0, 6, 15 (6 / 15 = 0.40), as relayed by the third research pass of QUESTIONS.md; the CPCWiki site returned HTTP 403 again for this target and the Grimware scope pages are gone, so the figure is second-hand and carries no voltage (S, relayed); 102 = 0.40 x 255 (D); off 0 and full 255 are the two ends of the three-level channel (K); the literal 0.5 of the wiki's table and nocash's loaded 1.0 V against 0.5 V are the conflict, stated in the notes; no per-channel half level was found, the three channels share this one"
output_max = "K: 8-bit output code; full 255 is the Gate Array's top level, the reference of the measured 0.40"
variant_outputs = "D: variant 4 only (the three others use the file's output): the half level of each channel is the voltage of the channel's pin in the high-impedance state, through the 270 ohm into the monitor's 100 ohm, over the same pin driven to +5 V, solved as a linear resistor network from the CPC6128 service manual's CPU circuit diagram (S, read at 4.5 times, H: 680 ohm pull-up to +5 V on each colour pin, 270 ohm series, luminance resistors 3.3k red, 1k green, 10k blue and 680 ohm from the sync pin to the base of Q102) and the CTM644 circuit diagram (S, read at 3.5 times: 100 ohm input resistors R901 to R903); the assumptions are K or E: pin states low 0 V, high-impedance (the pull-up alone), high +5 V with no output resistance (E), sync pin high in the picture (K: /SYNC is active low), Q102's base current neglected; with the other two channels in the half state (the grey) the levels are 0.3766, 0.4217 and 0.3608, that is 96.0, 107.5 and 92.0 of 255 (D), the codes 96, 108 and 92; the gap of green over red and blue (4 to 7 points) is robust to the unknown output resistances and the load, the absolute level (0.36 to 0.55 over them) is not; Grimware's 47.1154, 49.0385 and 5.2885 percent as relayed by the Shinra Team (U, second-hand) are a rough consistency check only; the KiCad project github.com/pelrun/cpc-schematics (no licence) was read for the topology, its values quoted, nothing copied"
inputs = "E: the half level an emulator shows, 128 (variant 1) or 127 (variant 2), the CPCWiki palette page's 'about 127 or 128' as a search snippet of the third research pass (the page was not readable); 96 = 0x60 for MAME (variant 3) is the number noted in the third research pass as a GPL cross-check, not read in MAME's source here and with no version named; black 0 and full 255 are K; none of the emulators' code was read"
