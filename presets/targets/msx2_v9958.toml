schema = 1
id = "msx2_v9958"
name = "MSX2+ / turbo R (Yamaha V9958, palette colours)"
label = "the V9958's 3-bit palette levels as its 5-bit DAC shows them (codes 0, 4, 9, 13, 18, 22, 27, 31), behind an emulator picture that expands the 3 bits straight to 8 (Emulator variant)"
kind = "dac"
notes = """
The MSX2's V9938 and the MSX2+ and turbo R's V9958 take a palette of 3 bits a channel (512 colours, 16 of them in a palette). An emulator shows the eight levels of a channel as 0, 36, 73, 109, 146, 182, 219, 255 (steps of 255/7, the 3 bits expanded to 8). This target moves them to where the V9958's 5-bit DAC puts them: the 3-bit level n reaches the DAC as the 5-bit code floor(4.5 n) = 0, 4, 9, 13, 18, 22, 27, 31, and a 5-bit DAC taken as linear shows code x 255 / 31 = 0, 33, 74, 107, 148, 181, 222, 255 (rounded to the 8-bit output). The map is a dac of eight points per channel with the straight line between them (a scaled picture): the same on red, green and blue.
**Where the mapping comes from, and how much it is worth.** One claim, and one corroboration of the same table. Grauw's article 'The YJK screen modes' (map.grauw.nl; no licence stated, so numbers with attribution only, nothing copied) says the palette is still 3 bits a component while the V9958's DAC is 15-bit, 'so there must be some kind of mapping in place', gives the table above and the formula floor(4.5 x), and says it applies to all screen modes. It gives no derivation and no source for the table. The mapping is numerically the same as rounding 31 n / 7: the table is the 3-bit palette quantised to 5 bits, which a linear 3-to-5-bit expansion would give as well, so the claim says almost nothing about the analogue side. openMSX's rasteriser (read through a text summary of its source on GitHub; GPL, so the numbers only, no code or table copied) builds its V9938 palette colours, on a V9958 machine, from its 5-bit YJK table through the expansion (n << 2) | (n >> 1) of each 3-bit level, with the comment (as relayed) that it is 'based on comparing red and green gradients, using palette and YJK, in SCREEN11 on a real turbo R': an emulator developer's own comparison against a real V9958, reported without numbers, so it supports the table without being an independent measurement of it. The effect is small: against the 255 / 7 steps the levels move by at most 3 of 255 on the integer values shown above (3.5 of 255, 1.4 percent, against the unrounded 255 n / 7), which is the size of one or two 8-bit codes. Do not read it as a visible change on a real picture.
**What is not known.** The analogue side. The 5-bit DAC is taken as linear because nothing says otherwise: the V9938 and V9958 data books' 'R.G.B. Output Level' pages are scans that nobody could read here (the V9938 data book transcription on unpkg has the text but not the voltages), no measurement of a V9958's RGB output was found, and the per-machine output stage, the cable and the monitor are not modelled; the gun law and white point of the chain's tube take over. So the target changes the digital levels of the DAC and claims no voltage.
**The V9938 (the MSX2 proper) is not a target.** Nothing documents a non-linear mapping for the V9938's palette: the sources only say its output is 'linear RGB' with a 3-bit palette, which is what an emulator already shows (n x 255 / 7). A V9938 variant would be an identity and is not built; an MSX2 with a V9938 needs no target. The mapping is for a V9958 machine (an MSX2+ or a turbo R).
**The emulator's input (the variants).** Variant 1 is the plain linear expansion with bit repetition, 0, 36, 73, 109, 146, 182, 219, 255, which is the figure of Grauw's VDP programming FAQ ('steps of 255/7') and, as MAME's palette code is named and not read in its helper here, MAME's standard 3-bit helper (pal3bit, bit repetition: a standard MAME function, K; MAME's v9938.cpp uses it for the palette, as relayed by a text summary of the file). Variant 2 is blueMSX (libretro port's VDP source, read through a text summary): each 3-bit component scaled to 8 bits as v x 255 / 7 in integer arithmetic, which truncates, 0, 36, 72, 109, 145, 182, 218, 255; that the division truncates is inferred from C, the code was not seen in full. An emulator that shows other levels is between the points of the nearest variant and lands on the straight line. **openMSX on a V9958 machine already shows exactly the 5-bit-derived levels** (0, 33, 74, 107, 148, 181, 222, 255): for it the target would be an identity, so it is not a variant and this target must not be used with it (on an openMSX V9938 machine, the picture is the linear 255 / 7 one and the real V9938 is linear: no target either). fMSX's expansion was not established and is not covered.
**Not built, and why.** The YJK and YAE decode of screens 10, 11 and 12 (R = Y + J, G = Y + K, B = 5/4 Y - J/2 - K/4 clamped to 0..31, from the V9958 data book as transcribed; the rounding of B is Grauw's inference): an emulator has already decoded those pixels to RGB, so no pixel-level target can act on them, and there is nothing to decode from the picture. The converse limit applies too: this target moves a pixel by its level only and cannot tell a palette pixel from a YJK or YAE one, so on screens 10 to 12 it moves the decoded colours a few codes as well (MAME shows the YJK pixels from 5-bit codes expanded to 8, which are already the 5-bit levels) and should be left off for them. The Graphic 7 fixed palette (screen 8, 3-3-2 bits) and the 256-entry direct colours go through the same eight levels, so they are covered like any palette picture. The composite and S-Video outputs of the machines (the burst registers, the external encoder) and the MSX1's TMS9918 (the separate target texas_instruments_tms9928) are not modelled. Analog RGB, so the composite module is not involved.
"""

[dac]
output = [0, 33, 74, 107, 148, 181, 222, 255]
output_max = 255.0

[[dac.inputs]]
id = "linear_rounded"
name = "Emulator with the plain 3-bit expansion, steps of 255/7 (MAME pal3bit, Grauw's FAQ)"
levels = [0, 36, 73, 109, 146, 182, 219, 255]

[[dac.inputs]]
id = "bluemsx_truncated"
name = "blueMSX: v x 255 / 7 in integer arithmetic (truncated), as relayed"
levels = [0, 36, 72, 109, 145, 182, 218, 255]

[provenance]
output = "S: the 3-bit palette level n reaches the V9958's DAC as the 5-bit code floor(4.5 n) = 0, 4, 9, 13, 18, 22, 27, 31, Grauw's article 'The YJK screen modes' (map.grauw.nl, read 2026-11-26 through a text summary and an unpkg transcription; no licence stated, no derivation given, said to apply to all screen modes), with openMSX's own palette on a V9958 machine built through the same expansion (n << 2) | (n >> 1) after a comparison with a real turbo R, as relayed from a text summary of its source (GPL, numbers only); the table equals round(31 n / 7), so it is a linear quantisation to 5 bits and carries no analogue information (S, a single claim and its corroboration, both second-hand); the 5-bit DAC taken as linear, so the displayed level is code x 255 / 31 = 0, 32.9, 74.0, 106.9, 148.1, 181.0, 222.1, 255 rounded to 0, 33, 74, 107, 148, 181, 222, 255 (D, with the linearity an E: the data books' 'R.G.B. Output Level' pages are unreadable scans, no voltage is known); the V9938 has no documented mapping and is not a variant"
output_max = "K: 8-bit output code; the top level 255 is the DAC's full code 31"
inputs = "E: the levels an emulator shows for the eight palette steps: variant 1, the bit-repetition expansion 0, 36, 73, 109, 146, 182, 219, 255 (K, MAME's standard pal3bit helper, whose definition was not read here, used by its v9938.cpp for the palette per a text summary; the same list is the 'steps of 255/7' of Grauw's VDP programming FAQ, S); variant 2, blueMSX's v x 255 / 7 with integer truncation 0, 36, 72, 109, 145, 182, 218, 255 (E: libretro blueMSX VDP.c read through a text summary, the truncation inferred, not seen); openMSX's V9958 picture is already 0, 33, 74, 107, 148, 181, 222, 255 and is not a variant; fMSX not established; no emulator's code was copied"
