# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Audit of the colour targets", "Design note:
# signal-driven colour targets", "Third research pass" and "Built, the Atari 7800"). Format: crates/phoxium/src/targets.rs.
# Every key of [signal] has a [provenance] entry "<tag>: <source>" with the CRT.md confidence tag (S sourced, D derived,
# K standard knowledge, E estimate).
schema = 1
id = "atari_7800_maria"
name = "Atari 7800 ProSystem (MARIA, NTSC, computed from the signal, unverified)"
label = "the 256 colours of the Atari 7800 as an NTSC television decodes the MARIA's signal (Colour variant: the hue delay of the pot, or a resistor-ladder luma); schematic-computed, not measured"
kind = "signal"
notes = """
UNVERIFIED: no instrument measurement of a 7800's video signal was found. The numbers below come from an anonymous wiki page computed from a schematic and from the notes of an emulator author, who set them by eye on several machines and displays; the original Atari documents were not read and the resistor values were not checked against a schematic.
The Atari 7800's MARIA chip does not make RGB: a colour register (COLU) holds a hue (0 to 15, the high nibble) and a luma (0 to 15, the low one), and the chip emits a composite signal made of a luma level and a chroma wave of one fixed amplitude whose phase is the hue. Hue 0 has no chroma (the 16 greys); hue 1 is the phase of the colour burst (180 degrees, minus U); every higher hue is one more step of a delay line, whose spacing is set by a pot on the board, which the notes call 'extremely sensitive'. An emulator shows a PC palette computed from that signal with its own settings. This target goes back to the signal: it recognises each pixel as the nearest of the 256 colours by comparison with a fixed reference palette, and shows the colour a television decoder drives the tube with, so the tube's own gamma, primaries and white take over. The colour index of the table is the value of the colour register, hue x 16 + luma. It is the same scheme as the Atari 8-bit GTIA target (atari_8bit_gtia): the numbers differ (a linear luma, a higher chroma, a delay of 25.7 degrees, no machine measurement), and the 2600's TIA, which shares the scheme, is not part of this target.
The luma: the Atari 7800 Programming wiki (page 'RGB', anonymous, derived from a Stella mailing list discussion) lists the luma resistors of the MARIA's D/A as SYNC 8.2k, LUM3 10k, LUM2 20k, LUM1 39k, LUM0 82k ohm, and its NTSC formula is Y = (COLU and 15) x contrast, with a contrast of 0.0526 (brightness 0, black at 7.5 IRE, sync at -40 IRE; a first attempt with the blank level as reference gave 0.0444 and a brightness of -0.081, 'very dark'). A forum post of the same family derives the 0.0526 as (40 + 7.5) x 8.2 x ((1/10 + 1/20 + 1/40 + 1/80) / 15) / (100 - 7.5): the ladder with the 39k and 82k rounded to 40k and 80k, that is, a binary ladder, exactly linear. Computed with the 39k and 82k of the wiki's list the ladder is almost linear but not exactly (luma 8 at 0.5324 of the range, not 0.5333; at most 0.0032 of the range off): the default variants take the wiki's linear luma, and the last variant the ladder of the listed values (the difference is under one 8-bit level and is the only thing that variant changes besides the saturation it implies). The luma of the range from COLU luma 0 to 15 is normalised between the machine's luma 0 and luma 15, which therefore become the tube's black and white (the pedestal of NTSC is not modelled, and the television's contrast and brightness decide the rest; MAME's palette does the same, 'normalized contrast and brightness', with grey steps of 0x11).
The chroma: the wiki's saturation is the burst, 40 IRE, over 185 IRE ('100 percent U or V', which the page takes from 'some calculations' of its own, not from a standard), 0.2162 in units where the luma of COLU 15 is 15 x 0.0526 = 0.789. Over the luma range (normalised to 1) that is 0.2162 / 0.789 = 0.2740 (0.2734 for the ladder luma); this is the amplitude of the table, the same for every hue but 0. The phase of hue h is 180 - delay x (h - 1) degrees on the U axis (the wiki: hue = tint - (h - 1) x phase, tint 180 = the burst; the same as the GTIA's formula). The wiki's delay is 360 / 14 = 25.714 degrees (hue 15 on hue 1: 'most units are calibrated so that colour 15 matches colour 1, which loses eight colours', it says, a count not checked here); MAME's changelog sets it to 25.7 ('Phase = 25.714 -> 25.7', and 180 degrees of burst 'takes place at about 25.7 degrees (a near exact match of hue 1x and 15x)'). The default is 25.7. The delay of a real machine is whatever its pot was set to and drifts with warm-up: the 7800 development wiki (Color Documentation) gives two historic calibrations of about 25.7 and 26.7 degrees and a drift of about 24.7 degrees cold to 27.7 degrees warm over the first 20 minutes, worst on hues $E and $F; MAME's author gives about 23 degrees at power-on (several seconds) to about 28 after a long run, tables from 24.7 to 27.7 degrees in half-degree steps, an active table that its changelog says is 26.2 and its source labels 25.7. The variants take 25.7 (default), 26.7, 24.7 (cold) and 27.7 (warm); at 27.7 degrees hue 14 and 15 land on hues 1 and 2, as MAME's notes say (a test checks it). Colours go through the decoder of the composite model (BT.601 luma, U and V scaled 0.492111 and 0.877283, the standard decoding matrix; the wiki gives 'the standard NTSC RGB to YUV formulas and their inverses', without listing which), so they return unchanged through that model, and a channel that goes negative is clamped to zero as a tube does.
Hue 1 and hue 15 are one colour at the default delay (25.7 against 25.714), as the real machine is calibrated, so the colours of the two hues differ by about a level and a recognition by a computed reference could not tell them apart.
The recognition reference is NOT the model: it is the 256 colours of the palette labelled 'PALETTE - 25.7 PHASE SHIFT' in MAME's a7800.cpp (BSD-3-Clause, copyright-holders Dan Boris, Fabio Priuli, Mike Saarna and Robert Tuccitto; the numbers only, with attribution, no code; its author set them 'based on observation of several systems across multiple displays', so they are an observed palette, not a computation). The design of the Atari 8-bit target (a reference computed by the same model at its default calibration) was tried first and rejected on the data: the model's colours are 0.12 (mean, drive voltage) from MAME's palette, up to 0.21 (colour $3F), because MAME's hue 1 is 'gold' (about -33 degrees in the I and Q plane, its notes say, 157 degrees on the U axis) where the signal model puts it on the burst, 180 degrees on the U axis, -57 degrees in I and Q, the 'green' end of what its notes call 'green on a flat panel'; a model with its tint, amplitude and delay fitted to MAME's palette (tint 166, amplitude 0.21, delay 25.9) is still 0.044 from it on average, so MAME's palette is not the wiki's formula with another tint; 178 of the 256 colours of MAME's palette were taken for another colour and 21 for none by the model reference (at the threshold of the GTIA target). The recognition therefore uses MAME's own table, which recognises MAME's 25.7-degree palette exactly (a test checks that every colour is its own nearest, and that colours a little off are taken), and an emulator with another palette (Stella's, the ProSystem family's, a hand-tuned or a flat-panel one) is passed through unchanged when it is farther than the threshold from MAME's colours, or may be taken for a neighbouring colour when it is nearer: that is not checked here (the ProSystem emulator's palette is GPL and was not read; no other palette with a licence was found). MAME's other tables (24.7 to 27.2 degrees, in its source but not active) are not used.
The colours the target shows are the signal model's, not MAME's: a recognised pixel is replaced by the model colour of its index under the chosen variant, so the hue 1 shown is the burst-phase one (the green-gold of the signal, about 23 degrees from MAME's gold) unless the tube's TV controls turn it (tint), and the chroma is the wiki's (amplitude 0.274; the fit to MAME's palette gives about 0.21). Whether that is the colour a CRT showed is the open point of this target (MAME's notes say a CRT shows gold); the GTIA target has the same estimate (the television's tint).
Estimated: the chroma-to-burst ratio (the wiki takes the chroma equal to the burst, 40 IRE after the television's gain control, an assumption about the television), the 185 IRE base of the saturation, the decode matrix, the television's tint (the decode puts hue 1 on the burst), and the delay of any real machine. A pixel with no reference colour within the threshold (a scaled or smoothed picture, an edited palette) passes through unchanged: use the integer upscale and the nearest-pixel prefilter (the defaults).
Not modelled: PAL machines (the wiki gives a different contrast of 0.044, a sync of -43 IRE, a burst of 42.86 IRE over 200 IRE = 0.2143 and a PAL colour order, but no PAL hue delay; MAME's PAL table has a different hue order; no numbers to build a target on), the TIA's own colours (the 2600 mode), the artifact colours of the high-resolution modes (they appear in the picture the emulator draws), the television's controls, the composite crosstalk (use the Composite video section).
White scale: white (hue 0, luma 15) is 255, 255, 255 in the five variants, untinted (derived: the luma is normalised between luma 0 and luma 15, which become the tube's black and white; the NTSC pedestal and the television's contrast are not modelled).
"""

[signal]
threshold = 0.05
black_index = 0
white_index = 15

[signal.grid]
hues = 16
lumas = 16
angle = 180.0

[signal.reference]
gain = 1.0
gamma = 1.0
