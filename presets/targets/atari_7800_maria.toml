[provenance]
grid = "K: the colour register of the Atari 7800 holds a hue in its high nibble and a luma in its low nibble, so the index of a colour is hue x 16 + luma (hue 0 has no chroma, hue 1 is the colour burst phase); S: the phase of hue h is tint - (h - 1) x phase degrees with the tint 180 (the colour burst) and all hues of one amplitude (Atari 7800 Programming wiki, page 'RGB', anonymous, formulas 'Hue = Tint - (COLU/16 - 1) x Phase', 'Saturation is 0 when COLU = $0x', 'Tint 180'; MAME a7800.cpp, BSD-3-Clause, 'Colorburst/Hue = 180 degrees'; no code of either is used and no table is copied)"
revisions = "S: the delay (phase) 25.714 = 360 / 14 degrees (the wiki), 25.7 (MAME's changelog and its palette table labelled 25.7), about 25.7 and 26.7 degrees for the two historic calibrations and about 24.7 cold to 27.7 warm over the first 20 minutes (7800 development wiki, page 'Atari 7800 Color Documentation', observations, no licence stated; MAME's notes: tables from 24.7 to 27.7 in half-degree steps); S: the luma Y = (COLU and 15) x 0.0526, brightness 0 (the wiki, schematic-computed, unverified; the 0.0526 follows from (40 + 7.5) x 8.2 x ((1/10 + 1/20 + 1/40 + 1/80) / 15) / ( 100 - 7.5), a forum derivation, with the 39k and 82k rounded to 40k and 80k, so it is exactly linear: luma_mv is the luma value itself); D: the luma of the last variant is the sum of the conductances of the set luma bits (1/10k, 1/20k, 1/39k, 1/82k ohm, in millisiemens x 1000: 100, 50, 25.641026, 12.195122, the wiki's resistor list; the 16 values of the list are the sums of the set bits) added in the same formula, proportional to the conductance as the forum's contrast formula is; S and D: the amplitude is the wiki's saturation 40 IRE / 185 IRE = 0.2162 divided by the luma of COLU 15 on the wiki's scale, 15 x 0.0526 = 0.789, so 0.2740, and for the ladder luma 4.2108 x 0.187836 = 0.7909, so 0.2734 (4.2108 = (40 + 7.5) x 8.2 / (100 - 7.5)); E: the 185 IRE base of the saturation (the wiki cites 'some calculations'), the chroma equal to the burst, and the delay of any real machine (the default 25.7 is MAME's and the wiki's, not a measured setting)"
reference = "S: the classification reference palette, not an output: the 256 RGB colours of the palette 'PALETTE - 25.7 PHASE SHIFT' of MAME's a7800.cpp (license BSD-3-Clause, copyright-holders Dan Boris, Fabio Priuli, Mike Saarna, Robert Tuccitto; numbers with attribution, no code; its grey ramp has steps of 0x11, which supports the linear luma); the model of this file at its default calibration was tried as the reference and rejected (0.12 mean from this palette, QUESTIONS.md and the notes); the palette is an observation by its author, not a computation; not checked against any other emulator palette"
threshold = "E: the largest distance in drive voltage between a pixel and a reference colour at which the pixel is taken for it; MAME's palette is recognised exactly (distance 0), a pixel a little off by 0.012 per channel is taken (229 of the 256 as the same colour, the others as a neighbour one level away); a palette of another emulator that differs more is meant to pass through unchanged rather than be taken for a neighbouring colour (not checked on any other palette); the closest two reference colours are 0.004 apart (hues 1 and 15, one level of difference; the unit test prints it), so the threshold limits what is left alone and does not pick the colour"
black_index = "K: colour 0 (hue 0, luma 0) is the luma 0 of the machine, taken as the black of the tube (the pedestal of NTSC is not modelled: the wiki puts it at 7.5 IRE and the sync at -40 IRE)"
white_index = "K: colour 15 (hue 0, luma 15) is the luma 15 of the machine, taken as the white of the tube (the wiki's Y of 0.789 against a 100 IRE white, a television's gain control and contrast decide the rest)"
