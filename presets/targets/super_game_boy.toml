# Source colour target, data only (TODO, "A GBC target"; QUESTIONS.md, "Audit of the colour targets"). Format:
# crates/phoxium/src/targets.rs. Every key of [palette] has a [provenance] entry "<tag>: <source>" with the CRT.md
# confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "super_game_boy"
name = "Super Game Boy (the 32 built-in palettes)"
label = "a Game Boy picture in one of the Super Game Boy's 32 built-in palettes (Colour variant), from a grey source"
kind = "palette"
notes = """
The Super Game Boy, the SNES cartridge that plays Game Boy games on a television, shows the four shades of the Game Boy in four colours chosen from 32 palettes built into its firmware (menu 1-A to 4-H; 1-A is the power-on palette). This target turns a Game Boy picture into those colours: the luma of the source picks a position between the palette's four colours, lightest first, so a grey emulator picture (white, light grey, dark grey, black: the emulator's 'grayscale' palette) lands on the four colours exactly and anything between blends. Choose the palette with Colour variant (1 = 1-A ... 8 = 1-H, 9 = 2-A ... 32 = 4-H); the colour source must be grey, because a green emulator palette would not span the luma range.
The table is hardware data: 32 palettes of four RGB555 words, lifted from the Super Game Boy firmware ROM according to the rustyboi emulator (MIT; its claim, at file offset 0x10000 of the SGB1 program ROM, could not be checked against a ROM dump). An independent audit (QUESTIONS.md, Audit of the colour targets) compared all 32 palettes and all 128 colours with two other sources, Bulbapedia (CC BY-NC-SA) and the Gambatte emulator (GPL, compared only), and found no disagreement; the three may share an upstream, so their independence is moderate. Not every palette is monotonic in lightness (1-G, 2-G and 3-F are not): colour 0 is the colour of the lightest Game Boy shade, not always the lightest colour.
The SNES shows each 5-bit channel code through a DAC that is close to linear (an oscilloscope measurement of one console, nesdev forum), so a colour is drawn as its 5-bit code over 31, with no black boost; the SNES output chain's own effect on these colours is otherwise not modelled, and the real picture also depends on the television. The Game Boy's own screen is not modelled: this is the Super Game Boy's colour, not a handheld's.
"""

