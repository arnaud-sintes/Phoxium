[provenance]
colours = "S: nesdev, NTSC video (nesdev.org/wiki/NTSC_video), measurements by lidnariq, a terminated 75 ohm television, about 10 mV of noise and 4 mV of quantisation: the levels per luma row (low 228, 312, 552, 880 mV, high 616, 840, 1100, 1100 mV), hue 0 a constant high, hue 13 a constant low, hues 14 and 15 the level of $1D (312 mV); the phase of hue h is 30 x (h - 2) degrees on the U axis, derived from the page's decoder (hue 8 decodes to pure -U, the colour burst's phase); the hue and row of each entry follow the bits of the palette index"
revisions = "S: nesdev, NTSC video: the differential phase distortion, -2.5 degrees (2C02E) or -5 degrees (2C02G) of extra rotation for each luma row (a forum measurement and a 2C02G hardware capture); E: the black level, the blank level (312 mV) for NTSC-J or 7.5 IRE above it (53.6 mV, 14 of 140 IRE per volt) for NTSC-U, and the white at the top level (1100 mV): the page's defaults and its alternatives, the television's own setting"
chroma_factor = "D: the fundamental of a square wave of the swing, summed over the 12-sample window of the nesdev decoder (U and V of the window times 2): 0.6440; 2 / pi = 0.6366 in the continuous limit"
reference = "E: the classification reference palette, not an output: the model at a chroma of 0.8 (saturation), black at 335 mV (between the blank level, 312 mV, of the Japanese palettes and the 7.5 IRE setup, 365.6 mV, of the American ones, which are darker), -5 degrees a row, white at 1100 mV, no gamma, chosen so that the Mesen2 default and the two pally 2C02G palettes are recognised (a search over the black level, the phase, the chroma and the contrast: 3 of the 192 colours of the three palettes are confused with a neighbour, dark greens and blues of row 0; the FCEUX default palette is the only popular one that no setting recognises)"
threshold = "E: the largest distance between a pixel and a reference colour at which the pixel is taken for it, beyond the farthest of the recognised palettes (0.153 of the pally and Mesen2 palettes from their references; the tests print the distances)"
black_index = "K: colour $0F (index 15) is black: the blank level and $1D"
white_index = "K: colour $20 (index 32) is the white of the page's decoder, 1100 mV"