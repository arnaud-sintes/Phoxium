# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Audit of the colour targets" and "Design
# note: signal-driven colour targets"). Format: crates/phoxium/src/targets.rs. Every key of [signal] has a [provenance]
# entry "<tag>: <source>" with the CRT.md confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "nintendo_entertainment_system"
name = "Nintendo Entertainment System / Famicom (computed from the signal)"
label = "the NES's colours as a television decodes the 2C02's composite signal (Colour variant: the chip and the setup)"
kind = "signal"
notes = """
The NES's video chip does not make RGB colours: it makes a composite signal. Each of the 64 palette entries is a luma row (0 to 3, from the two high bits) and a hue (0 to 15, the four low bits); a hue from 1 to 12 is a square wave that swings between the row's low and high voltage with 12 phases a colour cycle, hue 0 is a constant high, hue 13 a constant low, hues 14 and 15 the black level. The colour a screen shows is what the television's decoder made of that signal, and nesdev says it plainly: no single palette can match every game, Nintendo gave no reference monitor, and the result varies with the console, the television, its settings and its decoder. Emulators show one such palette as plain RGB. This target goes back to the signal: it recognises each pixel as the nearest of the 64 hardware colours and shows the colour a decoder drives the tube with, so the tube's own gamma, primaries and white take over.
The voltages are measured: lidnariq's readings into a terminated 75 ohm television (nesdev, NTSC video; about 10 mV of noise, 4 mV of quantisation, so about 2 IRE): the four low levels 228, 312, 552 and 880 mV and the four high levels 616, 840, 1100 and 1100 mV; the blank level and $1D are 312 mV. The chroma of a hue is the fundamental of its square wave, 0.6440 of the swing (the 12-sample window of the nesdev decoder; 2 / pi = 0.6366 in the continuous limit); the phase of hue h is 30 x (h - 2) degrees on the U axis (hue 8, the colour burst's, is pure -U), turned by -5 degrees (2C02G) or -2.5 degrees (2C02E) for each luma row, the differential phase distortion the nesdev page reports from a hardware capture and a forum measurement. The decoder is SMPTE 170M: black at the blank level (Japan) or 7.5 IRE (53.6 mV) above it (the United States), white at the top level, 1100 mV; the decode matrix is the one of the composite model. These choices are the page's own defaults, not facts of the hardware.
Recognition compares each pixel with a reference palette that does not depend on the chip: the same model at a chroma of 0.8 and a black of 335 mV, which sits among the palettes of the emulators that decode the signal (the 2C02G palettes of pally, the Mesen2 default, which equals Nestopia's canonical palette). The FCEUX default palette is a hand-tuned one that no decode of the signal reproduces: it is not recognised; use another palette in FCEUX. A pixel with no reference colour within the threshold (a scaled or smoothed picture, an edited palette) passes through unchanged. The emphasis bits are not modelled: an emphasised pixel is recognised as its base colour, and the dimmer, tinted colour the hardware gives is lost.
Cross-check: pally's published 2C02G palettes (MIT-0) for Japan and the United States, made with its phase distortion filter, differ from this model by a mean of about 0.07 in drive voltage (its filter also lowers the chroma): the tests keep that. Not modelled: the emphasis bits, the NTSC square-wave harmonics (the colours are the fundamental; a 12-sample square-wave encoder is not planned), the television's contrast and brightness, the PAL 2C07, the RGB PPUs (2C03, 2C04, 2C05).
"""

