# The decode of the table to drive voltages: the chroma gain of V, the turn of the chroma plane, and the share of the colour kept.
[[lut.variants]]
id = "kitrinx"
name = "Kitrinx's fit to a Duo-R (V gain 0.96)"
v_gain = 0.96
hue_deg = -10.4
saturation = 0.7529411764705882

[[lut.variants]]
id = "v_gain_14_15"
name = "the same with V gain 14/15 (the converter's comment)"
v_gain = 0.9333333333333333
hue_deg = -10.4
saturation = 0.7529411764705882

[provenance]
codes = "S: the HuC6260's silicon table, 512 entries of [U, V, Y] (5 bits each) in palette-word order GGGRRRBBB, read on a real console by furrtek and published as pbpry_int_lut with index_lut in Kitrinx's TG16_Palette repository (bfbii.h, no licence header, GitHub reports none; hardware facts with attribution, see the header). The column order is the one the repository's converter tg16color.c (MIT, Jamie Blanks aka Kitrinx, 2020) passes as Cb, Cr, Y; furrtek's gist gives the word as 0UUUUUVVVVVYYYYY. Parsed from the raw file and checked: 512 entries, U and V 1 to 30, Y 0 to 31, black {16, 15, 0}, white {16, 15, 31}, blue steps {18, 15, 0} ... {30, 15, 3}, red 1 {14, 18, 1}."
y_max = "D: the luma is a 5-bit code, 0 to 31 (furrtek's gist, the table's range 0 to 31); the luma voltage is Y over 31, the converter's own scale"
chroma_max = "D: the chroma codes are 5 bits in the 1's complement form, 15 steps each way (Kitrinx's converter, table c_table: codes 0 to 15 are -15 to -0, 16 to 31 are 0 to 15, over 15); an inference of the converter's author from the table, not from a datasheet"
u_max = "K: the BT.601 maximum of U, 0.436 (the converter's pop_rec_const), the scale of a full-range U code"
v_max = "K: the BT.601 maximum of V, 0.615 (the converter's pop_rec_const), the scale of a full-range V code before the variant's gain"
variants = "E: Kitrinx's fitted decode (tg16color.c, MIT), fitted by eye to the analogue vectorscope plots that Artemio made of the 240p Test Suite colour bars on a PC Engine Duo-R (instrument not named): V gain 0.96 (the code; the comment of the same file says 14/15 = 0.9333, variant 2), chroma plane turned by -10.4 degrees ('appears to vary a bit per system'), desaturation toward the luma keeping 192/255 = 0.752941 of the colour, Rec.601 matrix, no gamma. A fit by one person to one console, not a measurement; reproduces the converter's palette.pal for all 512 entries."
