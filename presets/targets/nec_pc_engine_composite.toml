# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Third research pass", "Audit of the colour
# targets" and "Built, the NEC PC Engine composite colours"). Format: crates/phoxium/src/targets.rs. Every key of [lut] has a
# [provenance] entry "<tag>: <source>" with the CRT.md confidence tag (S sourced, D derived, K standard knowledge, E estimate).
#
# ATTRIBUTION of the table `codes`: it is the content of the silicon ROM of NEC's HuC6260 video colour encoder, read on a real
# console by furrtek (test pins of the chip, the YUVDUMP gist) and published by Kitrinx in the repository
# github.com/Kitrinx/TG16_Palette (bfbii.h, `pbpry_int_lut` with its `index_lut`). That file carries no licence header and GitHub
# reports none (the converter tg16color.c in the same repository is MIT, Jamie Blanks aka Kitrinx, 2020): the 512 triples are
# shipped here as hardware facts with this attribution. No code of the repository is copied, and nothing is taken from the
# MiSTer core's palette file (GPL).
schema = 1
id = "nec_pc_engine_composite"
name = "NEC PC Engine / TurboGrafx-16 / SuperGrafx, composite output of the HuC6260"
label = "a PC Engine picture in the colours of the console's composite output: 512 RGB codes through the HuC6260's Y, U, V table (Colour variant: the fitted decode)"
kind = "lut"
notes = """
The PC Engine, the TurboGrafx-16 and the SuperGrafx make their colours in the video colour encoder (VCE, HuC6260): 512 colours, a 9-bit code of three bits for each of green, red and blue (the palette word GGGRRRBBB). Its composite output is not an encoded copy of the RGB: the chip holds a table of 512 entries, indexed by the colour code, that gives a 5-bit luma Y and two 5-bit colour-difference codes U and V. People assumed for years that the composite colours were a plain encode of the RGB ones; screenshots whose colours were plainly not what the artists meant led furrtek to read the table (below), which does not follow the RGB values linearly. Measured here against a plain BT.601 encode of the 3-bit levels (levels over 7, Y over 31, U and V over 15), the entries are 0.25 codes of Y, 1.0 of U and 0.8 of V away on average, at most 0.55, 2.9 and 2.4: the grey diagonal is linear (Y 0, 4, 9, 13, 18, 22, 27, 31) and the differences are in the chroma, which is why the colours of the composite picture drift from the RGB ones in hue and saturation.

The table (`codes`, entries in the order of the palette word, three codes each: U, V, Y). Source: the silicon table dumped from a real console by furrtek, published as `pbpry_int_lut` (colour differences and luma) and `index_lut` (the colour code of each entry, a plain count of GGGRRRBBB, checked) in Kitrinx's TG16_Palette repository (no licence, see the header: hardware facts with attribution). The column order U, V, Y is read from the repository's own converter (tg16color.c calls its decode with the columns as Cb, Cr, Y). Checked here: 512 entries, U and V from 1 to 30, Y from 0 to 31, black {16, 15, 0}, white {16, 15, 31}, the seven steps of blue {18, 15, 0} to {30, 15, 3}, and the first red {14, 18, 1}. The file bfbii.h holds a third table (`bfbii_lut`, 8-bit colours of an unnamed palette) that the converter does not use and this target does not read.

The decode (the two variants). The table is a digital code, so a decode to RGB is needed, and none of the chip's analogue levels (the DAC voltages, the burst, the IRE of each step) is published (Bernard Bygott's scope captures are mentioned by RetroRGB with no numbers). Kitrinx fitted a decode to the analogue vectorscope plots of the 240p Test Suite colour bars that Artemio made on a PC Engine Duo-R, and the numbers are his: Y over 31; U and V as a 1's complement code (codes 0 to 15 are -15 to -0, 16 to 31 are 0 to +15) over 15 times the BT.601 maxima 0.436 (U) and 0.615 times a gain of 0.96 (V, 'seems slightly too low for tg16', the converter's comment says 14/15 where its code has 0.96, hence variant 2); the chroma plane turned by -10.4 degrees ('based on a DUO-R belonging to Artemio, this appears to vary a bit per system'); the exact BT.601 matrix; and a desaturation toward the luma that keeps 192/255 of the colour ('very close on the vectorscope'); no gamma, the result clamped to 0 to 1. This target reproduces the converter's published palette (palette.pal) byte for byte on all 512 entries (checked when it was built, with the decode written independently). The numbers are a fit by one person to one console's plots, not a measurement of the chip: the phase of the chroma varies from console to console and with the monitor's tint.

The recognition. An emulator's picture of this console is a function of the 9-bit code: each channel is one of 8 levels, shown as 8 bits by repeating the bits (255 n / 7 rounded: 0, 36, 73, 109, 146, 182, 219, 255) or as 36 n (0, 36, 72 ... 252). The target recovers the code exactly from the three levels (no nearest-colour search; both expansions are accepted, they differ by at most 3 codes; a value that is neither is not a level) and replaces the pixel by the colour of that code. Any other pixel passes through unchanged: a picture that was filtered, scaled or smoothed before it reached the target is not recognised, and a pixel of another expansion (a 32 n) is not either. Use it with an emulator that shows the plain RGB colours of the console. Leave it off for an emulator whose palette already is the composite one (the MiSTer core's, Kitrinx's own, or any palette made from this table): the colours would be taken for levels only by chance.

SuperGrafx and the other models: the SuperGrafx and the PC Engine use the same HuC6260 (standard knowledge), and nothing says which console furrtek read or whether a later revision (HuC6260A, the CoreGrafx II and the Duo family) has a different table; no difference is recorded either way.

Not modelled and not known: the RGB output (the chip's raw RGB has a large DC offset and needs an amplifier; no measured voltage per level and no gamma exist, so there is no RGB target: the plain n x 255 / 7 an emulator shows is the only reading); the analogue levels, the burst amplitude and the setup of the composite signal; the phase and gain differences between consoles (the two variants only move the gain); the blur and dot crawl of the composite path (use the Composite video section, whose colour clock is that of the console's NTSC output).
"""

[lut]
y_max = 31
chroma_max = 15
u_max = 0.436
v_max = 0.615
