# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Audit of the colour targets", "Design note:
# signal-driven colour targets", "Second research pass" and "Built, the IBM CGA composite colours"). Format:
# crates/phoxium/src/targets.rs. Every key of [signal] has a [provenance] entry "<tag>: <source>" with the CRT.md confidence
# tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "ibm_cga_composite"
name = "IBM CGA, the 16 colours on a composite NTSC monitor or television"
label = "the 16 CGA colours as an NTSC television decodes the card's composite signal (Colour variant: old or new card, and the television's chroma gain)"
kind = "signal"
notes = """
The CGA card has a composite output (the RCA jack, or the P1 header of the 5155) next to its RGBI output. It makes the composite signal by itself, with no RGB-to-YIQ converter: an eight-way multiplexer driven by the colour bits B, G and R picks one of six square waves of the NTSC colour frequency (3.579545 MHz) at fixed phases, or a constant low (black) or high (white), and the intensity bit and the colour bits add to the luma through resistors. An emulator shows the 16 colours as the canonical RGBI palette (each channel 0, 0x55, 0xAA or 0xFF, the brown AA5500); on a composite monitor or a television, in the 320 x 200 graphics modes and the 40-column text mode (the modes with the colour burst on), the colours are the decode of this signal instead. This target recognises each pixel as the nearest of the canonical colours (the same reference as the ibm_cga_rgbi target, plus the dark yellow AAAA00 that PCem shows for colour 6) and shows the colour an NTSC decoder drives the tube with, so the tube's own gamma, primaries and white take over.
Chroma. The six waves are, over one colour cycle of eight half-pixel steps (reenigne, 'CRTC emulation for MESS', 2006; the post does not say which end of the string is first in time): black 00000000, blue 00001111, green 01111000, cyan 00111100, red 11000011, magenta 10000111, yellow 11110000 (the colour of the burst), white 11111111. The six are the same wave turned by whole steps of 45 degrees (blue 4 steps from yellow, red 2, magenta 3, cyan 6, green 7), so each colour of the 50 percent duty has the same fundamental amplitude and a phase 45 degrees apart from its neighbours; black and white have none, and the intensity bit adds none (the colours 8 to 15 have the hue of 0 to 7). The burst is the yellow wave, so yellow is at the burst phase, 180 degrees on the U axis (minus U, as in the Atari 8-bit target), and the others turn by 45 degrees a step from it: blue 0, magenta 45, red 90, cyan 270, green 225 degrees. The direction of the turn is not in the sources (the string's time order is not stated): it is chosen so that the hues are the ones the colours have, which a reversed turn would not give (red would land at 270 degrees, in the cyan), and this agrees with The PC Emulation Book's hue wheel (blue at the right, red at the top, yellow at the left). Against the NTSC hues of the pure colours (blue 347, magenta 61, red 103, yellow 167, green 241, cyan 283 degrees on the same axes) the CGA phases are 13 to 16 degrees away, with the sign alternating, which is the 'lack of purity' the Wikipedia article describes (cyan and yellow greenish). The colour 6 is therefore a dark yellow on a composite monitor, not a brown: decoded with the burst at 180 degrees it has a negative U and no V, a yellowish green, and the brown circuit that makes the RGBI monitor's brown is in the monitor only.
Luma. Old card (PCB 1804472 and 1501486): the sum of the chroma wave's mean and the intensity bit through two resistors; reenigne's circuit simulation of the card with a 75 ohm load gives four levels, Y=0 C=0 0.416 V, Y=1 C=0 0.709 V, Y=0 C=1 1.160 V, Y=1 C=1 1.460 V (the post says which colour set it simulated nowhere; its numbers were corrected in 2010, a factor of two), so a colour with the mean chroma 0, 0.5 or 1 has the mean of the two levels of its intensity: black 416 mV, a chromatic colour 788 mV (0 to 6 without 7) or 1084.5 mV (9 to 14), the greys 1160 mV (7) and 709 mV (8), white 1460 mV; as shares of the 1044 mV from black to white, the chroma bit is 0.713 to 0.719 and the intensity bit 0.281 to 0.287 (reenigne's rounded formula 0.72 chroma + 0.28 intensity agrees within 0.008). The six chromatic colours 1 to 6 have one luma, as do 9 to 14. New card (the revised cards, PCB 1504910 and 1501981): IBM added resistors that feed the R, G, B and I bits into the luma, so that grey monitors tell the colours apart; the weights, as shares of the span, are 0.29 chroma + 0.10 R + 0.22 G + 0.07 B + 0.32 I (the research pass lists resistors 2k, 1k, 3k and 680 ohm, which as conductances share the four weights within 0.007 when 680 is the intensity, 1k the green, 2k the red and 3k the blue: an assignment made here by order, the source's is not at hand), which gives the 16 levels of the file (blue 0.215, green 0.365, cyan 0.435, red 0.245, magenta 0.315, brown 0.465, light grey 0.680, dark grey 0.320, white 1). The weights are the research pass's (QUESTIONS.md, second pass, from reenigne's writings); the page of the first source was not re-read here and the Vogons posts could not be fetched.
Chroma amplitude (the saturation) and the burst. The burst is the yellow wave alone (no luma bit), the same square wave as every chromatic colour, so a colour's fundamental and the burst's are equal. What the picture shows then depends on the television: (variants 1 and 2) a decoder with a fixed chroma gain, as the card's own signal says it: a square wave of swing p has a fundamental of peak 2p / pi, and the swing as a share of the span is 0.716 (old: 0.744 V and 0.751 V of 1.044 V, mean 0.7475 V) or 0.29 (new), so the chroma vector is 0.4558 (old) or 0.1846 (new) of the black-to-white span, in the units of the luma, the new card being about 2.5 times less saturated, which is the 'only the brightnesses and saturations differ' that reenigne gives (the old card is so saturated that most of its chromatic colours clip a channel at the rails); (variants 3 and 4) a decoder whose chroma gain follows the burst (an automatic chroma control, the usual case for a television) and a luma gain that follows the sync: the burst is brought to the standard 40 IRE peak to peak (20 IRE peak, the fundamental of the burst is the colours' fundamental) and the span to 100 IRE (the old card has 0.416 V from sync to black if its sync tip is at 0 V, which is 40 IRE, so that the 1.044 V to white is 100.4 IRE: the sync level is not in the sources, this is a derivation under that assumption, and the new card is taken the same), which gives a chroma vector of 0.2 of the span for both cards, whatever the card's own chroma swing. Neither is a measurement of any monitor; the television's saturation control scales the vector (the composite model's colour control).
Black is the blank level (no 7.5 IRE setup, as on the Japanese NES variants); white is colour 15; the decode is the composite model's (BT.601 luma, U and V scaled 0.492111 and 0.877283, the NTSC matrix), a channel that goes negative or above one is clamped to the rails as a tube does (the unclamped red keeps the luma, so the saturated blues and reds of the old card shift in hue).
Not modelled: the 640 x 200 mode's artifact colours (the picture an emulator draws already shows them), the 80-column text mode (the burst is cut short there on the card and many monitors show no colour), the brightness and contrast of the television, the composite crosstalk and dot crawl (use the Composite video section: the colour clock is 3.579545 MHz and a 320 pixel line is 160 cycles, 227.5 per full line), the card's own overshoot and the harmonics of the square waves (the decode keeps the fundamental of the square wave, as a television's chroma filter does), the 160 x 200 composite mode (16 colours made from the 640 mode), PCjr and Tandy 1000 (a different phase between the pixel clock and the colour clock: reenigne gives about 135 degrees for the artifact colours), clone cards, and the monitor's gamma (the drive voltage is shown with no gamma).
"""

