[provenance]
colours = "S: the six chroma waves of the CGA over one colour cycle of eight steps, black 00000000, blue 00001111, green 01111000, cyan 00111100, red 11000011, magenta 10000111, yellow 11110000 (also the colour burst), white 11111111, selected by the colour bits B, G, R and not by the intensity bit (reenigne, 'CRTC emulation for MESS', reenigne.org/blog, 24 November 2006; the same selection by an octal multiplexer, The PC Emulation Book, 'Composite Video', book.martypc.net); the page states no licence and no code is used; D: the phase of each colour is 180 degrees (the burst, minus U) minus 45 degrees per step of turn from the yellow wave (red 2 steps, magenta 3, blue 4, cyan 6, green 7), giving blue 0, magenta 45, red 90, yellow 180, green 225, cyan 270 degrees; the direction is not stated by the source (the bit order in time is not) and is chosen so that the hues come out where the NTSC hues of the pure colours are (within 13 to 16 degrees), as The PC Emulation Book's wheel (blue 0, red 90, yellow 180) also has them; K: the colours 8 to 15 have the hue of 0 to 7, the greys 0, 7, 8 and 15 no chroma, colour 6 at the burst phase; K: the standard NTSC burst at 180 degrees on the U axis"
revisions = "S: old card luma, the four voltage levels of reenigne's circuit simulation (Y=0 C=0 0.416 V, Y=1 C=0 0.709 V, Y=0 C=1 1.160 V, Y=1 C=1 1.460 V, with a 75 ohm load, CRTC emulation for MESS, 2006, corrected in 2010 by a factor of two; the source does not say which card revision it simulated; the old card's formula 0.72 chroma + 0.28 intensity of the research pass agrees within 0.008), and the mean chroma 0 for colours 0 and 8, 1 for 7 and 15, 0.5 otherwise (D: the 50 percent duty of the six waves, the mean of their two levels: 788 mV and 1084.5 mV); S: new card luma, the formula 0.29 chroma + 0.10 R + 0.22 G + 0.07 B + 0.32 I of the span with resistors 2k, 1k, 3k and 680 ohm (QUESTIONS.md, Second research pass, reenigne's writings; not re-read at the source for this file, the Vogons posts could not be fetched), the 16 levels computed by this file's author in thousandths of the span (blue 0.29 x 0.5 + 0.07 = 0.215 and so on, the unit test recomputes them); D: variants 1 and 2 amplitude, the fundamental of a square wave of swing p has the peak 2 p / pi, so 2 / pi x 0.7475 V / 1.044 V = 0.4558 for the old card (swing the mean of 0.744 V and 0.751 V, the two chroma steps of the four levels) and 2 / pi x 0.29 = 0.1846 for the new card, the burst being the same wave so that a fixed-gain decoder shows the colours at their own ratio to the luma span, the span being the luma units of the colour 0 to 15; E: variants 3 and 4 amplitude 0.2, the burst taken to the standard 40 IRE peak to peak by an automatic chroma control and the span to 100 IRE by the sync (a sync tip at 0 V, which is the unstated assumption: 0.416 V is 40 IRE and 1.044 V is 100.4 IRE for the old card; the new card's sync-to-span ratio is not published and is taken the same); E: black at the blank level with no 7.5 IRE setup, the decode matrix of the composite model"
reference = "K: the canonical CGA RGBI palette, each channel 0, 0x55, 0xAA or 0xFF, colour 6 as AA5500 (Wikipedia, Color Graphics Adapter; MAME cgapal.cpp; PCem; 86Box; DOSBox Staging; MartyPC book), and the AAAA00 of a monitor without the brown circuit (PCem, 'RGB (no brown)'), the reference of the ibm_cga_rgbi target; the composite colours themselves are not compared with any emulator's composite palette (DOSBox, PCem and 86Box compute theirs by their own decoders: the recognition takes the RGBI colours the emulator draws in the 16-colour modes, not those of its composite emulation)"
threshold = "E: the largest distance (Euclidean in drive voltage) at which a pixel is taken for a canonical colour; the canonical colours are 0.33 apart, so the threshold only decides what is left alone"
black_index = "K: colour 0 (black) is the card's lowest level, the blank level of the signal, taken as the tube's black (no 7.5 IRE setup: E)"
white_index = "K: colour 15 (white) is the card's highest level, taken as the tube's white (a television's gain and the tube's contrast decide the rest)"
