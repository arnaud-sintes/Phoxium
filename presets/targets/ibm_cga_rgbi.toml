[[remap.variants]]
id = "ibm_5153_max_contrast"
name = "IBM 5153, contrast at the maximum (Holden's measurement)"
output = [0x000000, 0x0000C4, 0x00C400, 0x00C4C4, 0xC40000, 0xC400C4, 0xC47E00, 0xC4C4C4, 0x4E4E4E, 0x4E4EDC, 0x4EDC4E, 0x4EF3F3, 0xDC4E4E, 0xF34EF3, 0xF3F34E, 0xFFFFFF]

[provenance]
references = "K: the canonical CGA RGBI palette, each channel 0, 0x55, 0xAA or 0xFF, colour 6 as AA5500 (Wikipedia, Color Graphics Adapter; MAME cgapal.cpp; PCem; 86Box; DOSBox Staging; MartyPC book), and the AAAA00 of a monitor without the brown circuit (PCem, 'RGB (no brown)')"
variants = "S: Dr. Hugo Holden, Fitting an EGA Card to an IBM 5155 (2016), pages 21 to 24, as tabulated by VileR, The IBM 5153's True CGA Palette and Color Output (int10h.org, 11 June 2022): volts above black at the gun amplifiers with the contrast control at the maximum, 0 to 1.30 V, normalised linearly to 0 to 255 (1.00 V = 0xC4, 0.40 V = 0x4E, 1.12 V = 0xDC, 1.24 V = 0xF3, 1.30 V = 0xFF, the brown's green 0.64 V = 0x7E); the instrument is not named on the page and Holden's PDF could not be read; the page states no licence (so the voltages are cited, not the text)"
threshold = "E: the largest distance (Euclidean in drive voltage) at which a pixel is taken for a canonical colour; the canonical colours are 0.33 apart (a third of the range), so the threshold only decides what is left alone"