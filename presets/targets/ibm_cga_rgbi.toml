# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Audit of the colour targets"). Format:
# crates/phoxium/src/targets.rs. Every key of [remap] has a [provenance] entry "<tag>: <source>" with the CRT.md
# confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "ibm_cga_rgbi"
name = "IBM CGA, RGBI colours on an IBM 5153 monitor"
label = "the 16 CGA colours as the IBM 5153 monitor drove its tube (measured), in place of the canonical palette"
kind = "remap"
notes = """
The CGA card makes 16 digital colours (red, green, blue and an intensity bit), and an emulator shows them as the canonical palette: each channel 0, 0x55, 0xAA or 0xFF, with the brown fixed by halving the green (AA5500). The monitor did not draw them so. Dr. Hugo Holden measured the voltages that an IBM 5153 gives to its three gun amplifiers (Fitting an EGA Card to an IBM 5155, 2016, as tabulated by VileR on int10h.org): with the contrast control at its maximum, a colour of the normal half is 1.00 V above black on each channel that is on, the intensity bit lifts the off channels to 0.40 V and the on channels to 1.12, 1.24 or 1.30 V according to how many channels are on (so the intensified colours are not a uniform step), and the brown circuit (transistor Q206) lowers the green of colour 6 to 0.64 V, 36 percent and not 50 percent, so the brown is C47E00 and not AA5500. This target shows those levels: each colour is its voltage over 1.30 V, the drive voltage of the tube, with no gamma (the page normalises the 0 to 1.30 V range linearly to 0 to 255 and says the question of the monitor's gamma, which IBM never published, is open: the nominal value is between 2.25 and 2.5).
Each pixel is recognised as the nearest of the canonical colours (the colours of Wikipedia, MAME, PCem, 86Box, DOSBox Staging and the MartyPC book), plus the dark yellow AAAA00 that PCem shows as colour 6 when it has no brown circuit; a pixel with no canonical colour close by (a scaled or smoothed picture) passes through unchanged. Use the integer upscale and the nearest-pixel prefilter, and a picture in the 16 colours (the 640 x 200 composite mode and the 4-colour palettes of the card use the same 16 colours but are not recognised when an emulator draws artifact colours).
Not modelled: the contrast control (it dims the colours of the normal half only, in proportion across the channels, and shifts the brown a little toward green: 'from here you can only go down'), the brightness control (a fixed offset), the 5154 and EGA monitors (the canonical colours, the brown through the 5154's own circuit), the PCjr 4863, the 5515 (dark yellow for colour 6), Tandy monitors, the composite colours (the card's composite output is the ibm_cga_composite target). The DOSBox Staging 'ibm5153' preset shows the intensified colours of this table to within one level and much darker normal colours (0xA6 where this page and these voltages say 0xC4); the cause is not known, so do not use both.
"""

[remap]
threshold = 0.1
