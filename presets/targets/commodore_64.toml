[provenance]
colours = "K: the standard C64 colour order 0 black, 1 white, 2 red, 3 cyan, 4 purple, 5 green, 6 blue, 7 yellow, 8 orange, 9 brown, 10 light red, 11 dark grey, 12 medium grey, 13 light green, 14 light blue, 15 light grey; E: the angles are Colodore's (colodore.com, 2017: 11.25 + k x 22.5 degrees, k = 2 purple, 4 red and light red, 5 orange, 6 brown, 7 yellow, 10 green and light green, 12 cyan, 15 blue and light blue), the result of Pepto (the author of the colorvic pages) from oscilloscope readings by Makela, his own vectorscope and frame grabbers, which the Lemon64 forum disputes (unverified); greys have no chroma"
revisions = "S: Marko Makela, Commodore 6567/6569 video chip luminance levels (zimmers.net/anonftp/pub/cbm/documents/chipdata/656x-luminances.txt), 19 December 1996, one 2nd-revision board, a 40 MHz analog scope at 2 us/div, the luma pin without load, mV: 6569R3 MOS 6569R3 3483, 6569R4 MOS 6569R4 0786, 6569R5 MOS 6569R5 0989 15, 6569R1 MOS 6569R1 0783; the black level was measured on an all-black screen and the level 'changes when the colour changes'; the 6569R1 table has four levels above black"
amplitude = "E: Colodore's default saturation 50 scaled by 1 - 1/5 = 40 of the 256 of the luma scale, 0.15625 of the white-black span; Pepto 2001 used 34.008 of 255 (0.1334), found by brute force so that brown's blue just reaches 0; neither is measured"
reference = "E: the classification reference palette, not an output: the late luma levels over 32 (Pepto 2001 and Colodore 2017 both quantise Makela's table to 0, 8, 10, 12, 15, 16, 20, 24, 32), the Colodore angles and amplitude, a contrast of 1.1 (Pepto 1.0, Colodore 1.2) and a gamma of 1.136 (Pepto 2.5 / 2.2; Colodore 2.8 / 2.2 = 1.273), chosen so that the published palettes are all recognised (an exhaustive search over the published values, QUESTIONS.md)"
threshold = "E: the largest distance between a pixel and a reference colour at which the pixel is taken for it; VICE's Colodore file is the farthest published palette, 0.23 from its references; the closest two reference colours are 0.12 apart, so the threshold is a limit on what is left alone, not on which colour is chosen"
black_index = "K: colour 0 is the black level of the screen (Makela: the level was measured on an all-black screen)"
white_index = "K: colour 1 is white"