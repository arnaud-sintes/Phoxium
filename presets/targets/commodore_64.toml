# note: signal-driven colour targets"). Format: crates/phoxium/src/targets.rs. Every key of [signal] has a [provenance]
# entry "<tag>: <source>" with the CRT.md confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "commodore_64"
name = "Commodore 64 (VIC-II, PAL, computed from the signal)"
label = "the C64's colours as a PAL television decodes the VIC-II's signal (Colour variant: the chip revision)"
kind = "signal"
notes = """
The Commodore 64's video chip does not make RGB colours: it makes a composite signal, a luma level and a chroma wave of one amplitude at one of eight phases, and the colour on the screen is what the television made of it. Emulators show a PC palette (Pepto's, Colodore's) that someone computed from that signal for a PC display. This target goes back to the signal: it recognises each pixel as the nearest of the 16 hardware colours and shows the colour a decoder drives the tube with, so the tube's own gamma, primaries and white take over (no conversion for a PC display).
The luma is measured: Marko Makela's 1996 oscilloscope table of the luma pin of six VIC-II revisions (all units mV, one computer, a 40 MHz analog scope, no load), here the four PAL ones (the NTSC 6567 chips need NTSC phases that are not sourced here). Each colour's level is normalised between that chip's black (colour 0) and white (colour 1). The chroma angles are Colodore's (2017, the author of the Pepto palette, 'remeasured with better tools', sectors of 22.5 degrees offset by 11.25: purple 56.25, red 101.25, orange 123.75, brown 146.25, yellow 168.75, green 236.25, cyan 281.25, blue 348.75 degrees on the U axis); Pepto's own 2001 angles (vectorscope and a test program) were multiples of 22.5 degrees (blue 0, purple 45, red 112.5 ...), and the forum disputes both. The chroma amplitude is one value for every colour (Colodore's default saturation, 40 of the 256 of the luma scale, a derived number, not measured); the colour differences are in the scale of the composite model, so the colours go through it and return unchanged. The PAL delay line averages the two lines of the Hanover bars; Pepto's and Colodore's palettes are that average, and the composite model's PAL decoder does it itself when the option is on.
Recognition compares each pixel with a reference palette that does not depend on the chip: the colours of the model that stands between the two published ones (Pepto 2001: contrast 1, amplitude 0.1334, gamma 2.5 / 2.2; Colodore: contrast 1.2, amplitude 0.15625, gamma 2.8 / 2.2), the quantised late luma levels in 32nds, the Colodore angles and amplitude, a contrast of 1.1 and a gamma of 1.136; with it every colour of Pepto's palette, of the Colodore defaults and of the more saturated Colodore file of VICE is recognised as its own index (the tests list the distances). This aid is never applied to the output. A pixel with no reference colour within the threshold (a scaled or filtered picture, an edited palette) passes through unchanged.
Not modelled: the chroma amplitude per colour and per chip (the 8565 is not measured), the television's contrast and brightness (Colodore's default contrast of 1.2 makes its mid colours brighter than the nominal ones here), the 1084 monitor's own decoder, the NTSC chips.
"""

