[provenance]
colours = "S: the lo-res colour numbers and names (0 black, 1 dark red, 2 dark blue, 3 purple, 4 dark green, 5 grey, 6 medium blue, 7 light blue, 8 brown, 9 orange, 10 grey, 11 pink, 12 light green, 13 yellow, 14 aqua, 15 white) and the phases of the four one-bit colours 1, 2, 4, 8 at 90, 0, 270, 180 degrees with the burst at 180 degrees (Munafo, 'Apple II colors', mrob.com/pub/xapple2/colors.html, CC BY-NC 4.0, numbers with attribution only; the order of the names is also MAME's); D: the phases of the other colours as the sum of the phasors of their lit bits (3 at 45, 6 at 315, 9 at 135, 12 at 225, 7 at 0, 11 at 90, 13 at 180, 14 at 270, the greys 5 and 10 and black and white with none), equal to Munafo's table and recomputed by the unit test; S: Gayler's phases of violet, blue and green relative to the burst, 135, 225 and 315 degrees (the burst's minus the colour's), which agree with purple, medium blue and light green at 45, 315 and 225 degrees on the axes of this file; D: the level of each colour, the black level (500 mV) plus the lit fraction of the four bits (0.25, 0.5, 0.75) of the black-to-white span (1500 mV), the mean of the rectangular wave (Munafo luma 25, 50, 75 and Ticmanis 0.25, 0.5, 0.75 agree); S: Gayler's black 0.5 V and white 2.0 V; K: the standard NTSC burst at 180 degrees on the U axis, black at the blank level with no 7.5 IRE setup"
revisions = "D: the chroma amplitude of each colour, in units of the span, the peak of the fundamental of a rectangular wave lit for a fraction d of the cycle, 2 sin(pi d) / pi: 0.6366 for two lit bits and 0.4502 for one or three (the unit test recomputes it from the bit phasors), the ratio 0.707 of Ticmanis (comp.sys.apple2, 2005 and 2007; his 1/(2 pi) and 1/(2 sqrt 2 pi) are on a scale of a quarter), or 0.60 times the mid colours' (Munafo's chroma 60 against 100, 'chroma adjusted when needed to avoid oversaturation'): 0.3820 = 0.60 x 0.6366; D: variants 1 and 2 scale by the burst, the chroma gain of a television with automatic chroma control brings the burst to 20 IRE peak (0.2 of the span) and Gayler's burst is 0.7 V peak to peak, 0.35 V peak, 0.2333 of the 1.5 V span, so the factor is 0.2 / 0.2333 = 0.8571 and the mid colours are 0.5457, the dark and light 0.3859 (ideal) or 0.3274 (0.60); D: variants 3 and 4 keep the fundamentals at their own ratio to the span; S: the burst amplitude 0.7 V peak to peak (Gayler); E: the choice of a decoder, the ratio and the omission of the real output's harmonics, the flip-flop delay (Sather, 25 ns) and the network's bandwidth, so every amplitude is an estimate of the order of the real one (Munafo's mid chroma to burst ratio 2.5 against 2.73 here)"
reference = "S: the classification reference, not an output: the 16 RGB colours of the palette `apple2_palette` of MAME's apple2video.cpp (license BSD-3-Clause, copyright-holders R. Belmont, from the spreadsheet 'Apple II Video Display Theory'; numbers only, notice in docs/THIRD-PARTY.md), in the order of the lo-res colour numbers; K: the greys 5 and 10 are both 808080, the first is taken when a pixel is equally close to both and the output is the same for the two; not compared with any other emulator's palette"
threshold = "E: the largest distance (Euclidean in drive voltage) at which a pixel is taken for a colour of MAME's palette; the distinct colours of the palette are at least 0.36 apart, so the threshold only decides what is left alone"
black_index = "K: colour 0 (black, the lit fraction 0) is the lowest level of the signal, the blank level, taken as the tube's black (the 7.5 IRE setup is not modelled, Gayler's black being the blanking level)"
white_index = "K: colour 15 (white, the four bits lit) is the highest level of the signal, taken as the tube's white (a television's gain and the tube's contrast decide the rest)"
