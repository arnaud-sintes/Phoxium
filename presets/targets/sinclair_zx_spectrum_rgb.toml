# Source colour target, data only (TODO, "To build after the fifth pass"; QUESTIONS.md, "Third research pass", "Fourth research
# pass" and "Fifth research pass"). Format: crates/phoxium/src/targets.rs. Every key of [dac] has a [provenance] entry
# "<tag>: <source>" with the CRT.md confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "sinclair_zx_spectrum_rgb"
name = "Sinclair ZX Spectrum 128K/+2/+2A/+3 (RGB)"
label = "the Spectrum's RGB output as two analogue levels per channel, normal at 0.68 (+2A, +3) or 0.63 (128K SCART cable) of bright, behind an emulator picture whose normal level is 205, 192 or 216 (Colour variant); a documented choice, not a measurement"
kind = "dac"
notes = """
Each colour channel of a Spectrum picture is one of three levels: off, normal and bright (the BRIGHT bit raises every lit channel together; bright black is black), 15 colours plus black. An emulator shows them as 0, a normal value and 255; this target moves the normal level to where the monitor shows it relative to bright, and leaves black and bright alone. The map is a dac of three points per channel with the straight line between them, the same on red, green and blue (the Amstrad CPC target has the same shape). It is the RGB output of the 128K, the +2 (grey), the +2A and the +3, **not** the 16K, 48K and Plus (`sinclair_zx_spectrum_48k_pal`) and not the composite encode.
**The ratio is a choice, not a measurement.** The sources contain no measurement of a real Spectrum. What they hold: the 128K's RGB socket gives R, G, B and BRIGHT as TTL levels (digital), so the analogue levels are made by the resistors of whatever cable or interface is used; one author's 128K SCART cable calculations give normal 0.44 V against a 0.7 V design target for bright, a ratio of about 0.63 to 0.65 (the third research pass, relayed, cable-dependent). The +2A and +3 mix BRIGHT with a 150 ohm resistor and diodes and drive the cable through 330 ohm: bright 0.68 V and normal 0.46 V, a ratio of 0.68 computed from the schematic (relayed, not measured). World of Spectrum's pinout page lists the +2A and +3 RGB socket as 'Analogue 1.67 V p-p', open circuit or loaded not stated. The ratio therefore depends on the load (the monitor's input impedance and the cable's resistors), and the target ships two readings of it and does not claim to know the one on a given desk.
**The variants.** The six combine the emulator's normal level (E, below) with one of the two ratios. Ratio 0.68 (+2A and +3, 330 ohm cable, computed) is the default: 0.68 x 255 = 173.4, 173. Ratio 0.63 (the 128K SCART cable calculations) is 160.65, 161. The first two variants are the default input 205, the next two FUSE's 192, the last two the 85 percent level 216 (0xD8). Between the points of a variant (a scaled picture, or an emulator with another normal level such as 215, 224 or 238) the map is the straight line: 215 on a 216 variant comes out one code from the exact point, 224 or 238 lands on the line between normal and bright of the nearest variant and not at its own normal level, so a picture with such a level is best read with the variant of the nearest input.
**The emulators' normal level.** The repo's research notes list the values emulators use for the normal level: 0xC0 (192, named as FUSE's), 0xCD (205, the default of this target; the notes list it without a name, and the request for this target attributes it to Spectaculator, a relay not checked here), 0xD7 or 0xD8 (215 or 216, the 85 percent of one preset site's claim, 255 x 0.85 = 216.75, nothing authoritative), 0xE0 (224) and 0xEE (238). None of these numbers was measured by anyone and none of the emulators' code was read here (some are GPL and are not to be copied); the numbers are the 'convention' of the sources, tagged E. Which program uses which is the research notes' relay, not checked.
**Not variants.** Ratio 0.85 (0.55 V normal against 0.65 V bright, Wikipedia quoting a clone-design blog (zxdesign.info), the page itself says the real colours are 'currently unknown' and the values are 'indicative only'): that is the 48K ULA's composite figure at maximum saturation, a different circuit, so it is not part of this target; it is also what the 215 or 216 emulators already show (216.75 of 255), so a target at 0.85 would be an identity for them. The Harlequin video-mod thread (a search snippet, a different board, RGB through resistors into 75 ohm): bright and normal 0.700 / 0.510 (ratio 0.729), 0.680 / 0.502 (0.738) and 0.685 / 0.459 (0.670); it brackets 0.68 and shows the spread across boards and loads (0.67 to 0.74 against 0.63 to 0.65 for the SCART cable), a note and not a variant: 0.67 is 171 of 255 and 0.74 is 189, within 2 codes of the 0.68 variant at the one end and 16 at the other. A variant that would be an identity for an emulator is not shipped: no emulator in the notes shows 161 or 173 as its normal level.
**Not in this file.** The 48K PAL composite encode is the separate target `sinclair_zx_spectrum_48k_pal` (built after the 5C102 specification's probe-test circuits and the Amstrad patent drawings, image-only documents, were read by eye on 2026-11-26: the ULA's Y, U and V levels give the relative colours; the service manual gives resistors and the chroma bias and no levels, and Chris Smith's book 'The ZX Spectrum ULA' was not read). **Not built, and why.** The 128K's own composite output through the Philips TEA2000 has no such document: its datasheet gives 2 bits per primary at 'equally spaced intensity levels', gamma applied internally and no Y, U, V table, and the composite is 1.2 V peak to peak. The issue differences, per-colour (or per-channel) levels, the monitor's own gamma and the amplifier are not modelled; no gamma is applied here and the gun law, white point and primaries of the chain's tube take over. The picture-side effects of a real Spectrum (attribute clash and so on) are in the emulator's picture already.
White scale: the bright white is 255, 255, 255 in the six variants and the normal white is 173, 173, 173 with the ratio 0.68 (variants 1, 3 and 5) or 161, 161, 161 with 0.63 (variants 2, 4 and 6), all untinted (derived: the bright level is left alone and the normal level is placed as a ratio of it, whatever level the emulator shows for the normal white).
"""

[dac]
output = [0, 173, 255]
output_max = 255.0

[[dac.inputs]]
id = "e205_r068"
name = "Emulator normal level 205 (0xCD), +2A / +3 ratio 0.68 (default)"
levels = [0, 205, 255]
output = [0, 173, 255]

[[dac.inputs]]
id = "e205_r063"
name = "Emulator normal level 205 (0xCD), 128K SCART cable ratio 0.63"
levels = [0, 205, 255]
output = [0, 161, 255]

[[dac.inputs]]
id = "e192_r068"
name = "Emulator normal level 192 (0xC0, FUSE), +2A / +3 ratio 0.68"
levels = [0, 192, 255]
output = [0, 173, 255]

[[dac.inputs]]
id = "e192_r063"
name = "Emulator normal level 192 (0xC0, FUSE), 128K SCART cable ratio 0.63"
levels = [0, 192, 255]
output = [0, 161, 255]

[[dac.inputs]]
id = "e216_r068"
name = "Emulator normal level 216 (0xD8, 85 percent), +2A / +3 ratio 0.68"
levels = [0, 216, 255]
output = [0, 173, 255]

[[dac.inputs]]
id = "e216_r063"
name = "Emulator normal level 216 (0xD8, 85 percent), 128K SCART cable ratio 0.63"
levels = [0, 216, 255]
output = [0, 161, 255]

[provenance]
output = "D: the default ratio of normal to bright is 0.68, the +2A and +3 schematic computation (BRIGHT mixed by 150 ohm and diodes, 330 ohm cable resistor: bright 0.68 V, normal 0.46 V) relayed by the third research pass of QUESTIONS.md, computed and not measured, 0.68 x 255 = 173.4, 173; it is load-dependent (the cable and the monitor's input impedance), a documented choice; off 0 and bright 255 are the two ends of the three-level channel (K: a digital TTL pair, the channel is off or on and BRIGHT raises it); no measurement of a real Spectrum exists in the sources, nor per-channel levels, so the three channels share the one level"
output_max = "K: 8-bit output code; bright 255 is the top level of the three-level channel, the reference of the ratio"
inputs = "E: the normal level an emulator shows, 205 (0xCD, the default), 192 (0xC0, FUSE) and 216 (0xD8, 255 x 0.85 = 216.75, a preset site's claim, nothing authoritative; 215 or 216 are both reported), from the third and fifth research passes of QUESTIONS.md (the notes list 0xC0, 0xCD, 0xD7 or 0xD8, 224 and 0xEE and say they disagree and none is measured; 205 is listed without a name in the notes; the request for this target names Spectaculator for it, not checked); black 0 and bright 255 are K; none of the emulators' code was read"
variant_outputs = "D: the variants with the suffix r068 take 173 = round(0.68 x 255) (the +2A and +3 computation, above); those with r063 take 161 = round(0.63 x 255 = 160.65), the 128K SCART cable calculations of one author (normal 0.44 V against a 0.7 V design target, 'about 0.63 to 0.65', cable-dependent; third research pass, relayed, E for the choice of the low end, 0.44 / 0.7 = 0.629 gives 160); the Harlequin readings (0.670, 0.729, 0.738, a search snippet of the fifth pass, a different board) and the 48K 0.85 (Wikipedia citing zxdesign.info, 'indicative only', composite) are notes, not variants; the World of Spectrum '1.67 V p-p' socket level and the TEA2000's 'equally spaced intensity levels' are not used (the first has no stated load, the second is the composite encoder)"
