# Source colour target, data only (TODO, source colour targets; QUESTIONS.md, "Audit of the colour targets"). Format:
# crates/phoxium/src/targets.rs. Every key of [matrix] has a [provenance] entry "<tag>: <source>" with the CRT.md
# confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "game_boy_advance_sp_ags_101"
name = "Nintendo Game Boy Advance SP (AGS-101, backlit), measured"
label = "the backlit AGS-101 screen from colorimeter and spectrophotometer readings of one unit; Colour variant: the session and the white"
kind = "matrix"
notes = """
The Game Boy Advance SP AGS-101 has a backlit screen. Pokefan531 measured one unit twice, through a screen protector (not removed): on 2023-07-24 with an X-Rite ColorMunki Photo spectrophotometer and HCFR, and on 2026-05-02 with a ColorMunki Display colorimeter (not calibrated); the readings (XYZ of the white, the black, the three primaries and the secondaries, and 32 grey steps) are in Brankale's Handheld-Color-Space-Project. This target is built from them by the standard colorimetric chain, written here from the numbers and not taken from that project's shader or its fitted polynomials: the 5-bit code over 31 is raised to an exponent, the three primaries (their XYZ chromaticities) and the white give the matrix to XYZ, and the standard matrix gives linear sRGB, which is raised to 1 / 2.2 as the drive voltage of the tube.
The exponent is a single number, the least-squares fit, in logarithms, of the black-subtracted grey ramp over the steps 4 to 28 (2.30 for the 2023 readings, 2.40 for the 2026 ones; the local exponent runs from 2.1 to 2.8 along the ramp and falls to 1.6 near white, which is partly a black-handling effect: a single power is a simplification). The primaries are close to sRGB's (red 0.615, 0.346, green 0.331, 0.606, blue 0.144, 0.085 in xy, 2023), green warmer and blue between sRGB's and the older Game Boy Advance's, as Pokefan531 describes; the white is x 0.306, y 0.310 (about 6800 K), pinker than D65.
The variants are the two sessions, each with the white as measured (the tinted white of the screen, scaled so that its brightest channel reaches full drive: the matrix is not normalised to a neutral white) and adapted to D65 by a Bradford transform (a neutral white). The black level is not modelled (0.3 percent of the white). The instruments differ (the Display reads darker blacks, the Photo the white temperature more accurately), the sessions differ by about 5 percent in the blue and the white, there is no brightness, warm-up or ambient light in the report, and the Brankale repository states no licence (its README credits Pokefan531 for the measurements and welcomes corrections): the readings are quoted with attribution as numbers, and permission has not been asked. This is one unit, one backlight state, one viewing angle, with a protector on. It is not the frontlit AGS-001 or the Game Boy Advance of the other target.
White scale: white is the measured screen's own tinted white in variants 1 and 3 (243, 236, 255 for the 2023 session, 248, 238, 255 for the 2026 one: the blue, the brightest channel, at full drive) and a neutral white in variants 2 and 4 (255, 255, 255 at 8 bits, blue 254.98, after the Bradford adaptation to D65) (sourced: Pokefan531's XYZ readings of the white; scaling the brightest channel to full drive is a derived choice, as the readings carry no absolute level for the code).
"""

