[provenance]
rows = "D: computed from the XYZ readings of the 2023 session (Brankale, Handheld-Color-Space-Project, handhelds/Nintendo GBA SP AGS-101, [2023-07-24][Pokefan531], hcfr_report.xls, units not stated): white 121.178963, 122.963692, 151.95961; red 53.035133, 29.786356, 3.376642; green 43.2085, 79.048882, 8.263728; blue 25.650356, 15.12584, 136.981308; the matrix from the normalised primaries (the primaries' chromaticities scaled to sum to the white) times the XYZ to linear sRGB matrix (3.2406255, -1.5372080, -0.4986286 / -0.9689307, 1.8757561, 0.0415175 / 0.0557101, -0.2040211, 1.0569959); the 2026 session ([2026-05-02][Pokefan531], colors.csv): white 121.795317, 123.381279, 149.195392; red 55.509378, 31.260651, 2.961776; green 43.927962, 80.674025, 8.561921; blue 26.129149, 15.251464, 139.940875; the D65 variants add a Bradford chromatic adaptation from the measured white to D65 (0.95047, 1, 1.08883)"
input_bits = "S: the console stores 5 bits per channel, codes 0 to 31"
input_range = "K: the exponent works on the normalised value (code / 31)"
input_gamma = "D: least-squares power fit, in logarithms, of the black-subtracted grey ramp (32 steps, (Y - black) / (white - black), x = step / 31) over the steps 4 to 28: 2.30 (2023, ColorMunki Photo) and 2.40 (2026, ColorMunki Display); a fit on the linear values gives 2.45 and 2.58 and a fit over all the steps 2.2 and 2.3: a single power for a ramp whose local exponent runs from 2.1 to 2.8"
divisor = "K: no scaling of the linear sum"
output_gamma = "E: linear sRGB raised to 1 / 2.2 as the drive voltage of the tube, the convention of the other targets"
output_scale = "D: 1 / (largest row sum of the matrix) ^ (1 / 2.2) for the white as measured (1.1571 for 2023, 1.1291 for 2026: the blue of the white), so that the brightest channel of the white reaches full drive (a saturated blue can still pass it a little and is clipped at the output); 1 for the D65 variants, whose white is neutral"
variants = "D: the sessions of 2023 and 2026 and the white as measured or adapted to D65 (Bradford), see rows; the instruments are an X-Rite ColorMunki Photo with HCFR (2023) and a ColorMunki Display, not calibrated (2026), both through a screen protector"