[provenance]
colours = "K: the Spectrum's colour order 0 black, 1 blue, 2 red, 3 magenta, 4 green, 5 cyan, 6 yellow, 7 white (the bits GRB), here followed by the same seven at the bright level (8 to 14), the bright black being black; S: the /Y levels, Ferranti 5C102 specification page 7 (the probe-test circuit, 5 V supply, 1 kohm load: reference 2.40 V, R only 2.10, G only 1.79, B only 2.25, bright white 1.00, read by eye on enlarged scans, confidence H) and the Amstrad patent EP0107687B1 figure 4; D: the level of each normal colour is the sum of the drops of its lit pins (0.30 R, 0.61 G, 0.15 B volts: 150, 300, 450, 610, 760, 910, 1060 mV of light above the black level), the bright colour that times 1.40 / 1.06 = 1.3208 (so the bright white is the measured 1400 mV; the factor on single colours is an assumption of one common bias, E); S: the U and V levels, page 9 (reference 2.96, B' only 1.98, /G' only 2.30, /R' only 2.63, all on 1.00, M) and page 11 (reference 3.27, R* only 1.87, /G* only 2.10, /B* only 3.03, M); D: the phasor of each colour (-(U - 1.975), -(V - 1.865)) volts from U = 2.96 - 0.98 B - 0.66 (1 - G) - 0.33 (1 - R) and V = 3.27 - 1.40 R - 1.17 (1 - G) - 0.24 (1 - B), its angle on the U axis rounded to 0.01 degree (the unit test recomputes it), the bright colours with the angle of the normal ones (no /HL input in the U and V circuits); E: the signs (both pins inverted, a global inversion cancels in the burst), equal gains of the two inputs downstream, the zero of the chroma at the black and white mean, the greys without chroma (their 0.01 V residual is below the reading precision), and that the probe-test levels and a Spectrum's load differ; U (unclear): only the struck-out last row of the V table, which is not used"
revisions = "D: the chroma amplitude of each colour in units of the span from black to the bright white, the phasor magnitude in volts (1.0126 for blue and yellow, 1.4421 for red and cyan, 1.3365 for magenta and green) times a gain per volt: (burst_gain) 0.2143 / 1.2945 = 0.1655, the PAL burst of 300 mV peak to peak over 700 mV of luma (K, 3/14 of the span, peak) over the burst vector (the U burst branch off, +0.89 V, 1.89 V against 1.00 V, and the V BURST* branch on, -0.94 V, 2.33 V against 3.27 V; sqrt(0.89^2 + 0.94^2) = 1.2945 V at 133.4 degrees, M); (fixed_gain) 0.3354, the mean of 0.4921 / 1.10 / 1.3208 = 0.3387 (U) and 0.8773 / 2.0 / 1.3208 = 0.3321 (V), the standard PAL colour-difference weights over the circuit's own gains (1.10 V and 2.0 V per unit of colour difference, D from the three drops of each circuit) in units of the normal white, in the span of the bright white; E: the choice of these two gains, the television's behaviour, the burst level of a machine and the load, so every amplitude is an estimate of the order of the real one; the chroma of every bright colour is that of its normal colour"
reference = "K: the classification reference, not an output: black, the seven colours at the normal levels 0xC0 (192), 0xCD (205) and 0xD8 (216) and at the bright 255 in the 3-bit RGB combinations (R, G, B each on or off), the numeric conventions of the repo's research (QUESTIONS.md, third and fifth research passes: 0xC0 named as FUSE's, 0xCD, 0xD7 or 0xD8 as an 85 percent level, 0xE0 and 0xEE also listed); E: none was measured and none was read from an emulator's code, whose GPL tables are not used; the bright black is black"
threshold = "E: the largest distance (Euclidean in drive voltage) at which a pixel is taken for a reference colour; the normal levels are 0.04 to 0.05 apart and the bright 255 is 0.15 above the 216, so 0.08 recognises 215 and 224 as the normal level, takes a one-channel 238 for the bright colour (0.067) and leaves alone what is more than 0.08 from every reference (a blend, a filtered picture, a 238 on two or three channels)"
black_index = "K: colour 0 (black) is the /Y reference level, 2.40 V, the blanking level, taken as the black of the tube (no setup level)"
white_index = "K: colour 14 (the bright white, /Y 1.00 V) is the highest level of the signal, taken as the white of the tube; the normal white (colour 7) is at 0.757 of it"
