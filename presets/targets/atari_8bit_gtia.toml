[provenance]
grid = "K: the colour register of the Atari 8-bit holds a hue in its high nibble and a luma in its low nibble, so the index of a colour is hue x 16 + luma (hue 0 has no chroma, hue 1 is the colour burst phase); S: the phase of hue h is 180 - delay x (h - 1) degrees on the U axis, the burst at 180 degrees (minus U, -57 degrees behind I) and all hues of one amplitude (Altirra Hardware Reference Manual by Avery Lee, Appendix D, 'NTSC GTIA color encoding'; the manual is redistributable, the numbers are quoted with attribution, no code of Altirra is used)"
revisions = "S: the 16 luma levels in mV, Altirra Hardware Reference Manual, Appendix D, Table 116 'Measured signal levels for sync and all luminances' (+/- 0.008 V; the 800XL 1.112 to 2.224 V, the 130XE 0.468 to 1.380 V, the 800 0.640 to 1.440 V; the 400, which has no composite output, by a probe on R203 before the RF modulator with the low pass of the scope on, 3.736 to 3.952 V); S: the chroma amplitude per machine is the saturation of Table 117 'NTSC saturation ratios' (23.9, 23.3, 35.0 and 30.6 percent of the luma range 0 to 15, the chroma vector of 20 IRE over the range after the sync reference of -40 IRE); E: the hue delay of 25.5 degrees (the middle of the manual's 'typically somewhere within 23.5 to 27.5 degrees per hue' range; no machine's trimmer setting is known) and its two ends for the extra 800XL variants"
reference = "E: the classification reference palette, not an output: a linear luma (the manual's 'simple and serviceable approximation' Y = brightness / 15), a chroma amplitude of 0.27 (between the XL and XE machines, 0.233 and 0.239, and the 400 at 0.306, below the 800 at 0.35), the hue delay 25.5 degrees, no contrast and no gamma; chosen so that palettes computed with another saturation (0.233 to 0.306) or delay (23.5 to 27.5) land on reference colours within 0.1 of the intended ones for at least 248 of the 256 colours (an experiment over the computed palettes, QUESTIONS.md); not checked against any emulator palette"
threshold = "E: the largest distance in drive voltage between a pixel and a reference colour at which the pixel is taken for it; the farthest computed colour of the machines from the reference colour found is 0.119 (the 800, saturation 0.35; 0.112 for the 800XL at 23.5 degrees), so 0.12 keeps every one of them recognised; the 256 colours are only 0.005 to 0.1 apart in places (hue 1 and hue 15, the clamped dark colours), so the threshold limits what is left alone and does not pick the colour"
black_index = "K: colour 0 (hue 0, luma 0) is the brightness 0 of the machine, taken as the black of the tube (the pedestal of NTSC is not modelled: D, the manual puts the GTIA's black at the blanking level, about -8 percent)"
white_index = "K: colour 15 (hue 0, luma 15) is the brightness 15 of the machine, taken as the white of the tube (a television's AGC would show it at 57 to 86 IRE according to the machine, Table 117, the contrast of the tube decides)"
