# Source colour target, data only (TODO, "A GBC target"; QUESTIONS.md, "Audit of the colour targets"). Format:
# crates/phoxium/src/targets.rs. Every key of [dac] has a [provenance] entry "<tag>: <source>" with the CRT.md
# confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "sega_mega_drive"
name = "Sega Mega Drive / Genesis (measured DAC levels)"
label = "the Mega Drive's measured colour DAC behind a Genesis Plus GX, Kega Fusion or Regen picture (Colour input)"
kind = "dac"
notes = """
The Mega Drive's video chip makes each colour channel from 3 bits (8 levels). Most emulators show them as evenly spaced 8-bit values, but the DAC is not linear: its levels, read with an oscilloscope at the divider output before the RGB encoder, rise 0, 52, 87, 116, 144, 172, 206, 255 (scaled to full white), the middle steps being larger. This target replaces the emulator's levels by those: the code 3 an emulator shows as 102 (Genesis Plus GX) becomes 116.
The measurement is TmEE's (SpritesMind forum): 15 levels of the divider output from 0 to 951 mV, read on the MD1, several MD2 ASIC revisions and the Genny3 ASIC with identical results on all channels; the normal mode takes every second level. BlastEm uses a table derived from the same voltages (49, 87, 119, 146, 174, 206 for the middle codes, up to 3 apart). Open questions: the white scale (an argument says the 4.7 V code corresponds to about 0.9 V at the video encoder, which would make full white 238 and not 255; here the top level is full white), the black level (about 6 IRE), and the effect of the TV (brightness, contrast, the encoder's loading: the numbers are DAC outputs on the board, not at the television). No gamma is modelled.
The input levels depend on the emulator (Colour input): Genesis Plus GX shows a linear step of 34 per code (0 to 238, 'raw internal RGB'), Kega Fusion 33, Regen 32; the other emulators are not documented here, and BlastEm already shows the measured levels (leave the target off for it). A level between two codes (a scaled picture, the shadow and highlight half steps of a Genesis Plus GX picture) is placed on the straight line between the two points; the measured shadow and highlight levels (0, 29, 52, 70, 87, 101, 116, 130 and 130, 144, 158, 172, 187, 206, 228, 255) are not applied, so a shadowed pixel comes out a few levels off (26 for 29 at the first step).
"""

[dac]
output = [0, 52, 87, 116, 144, 172, 206, 255]
output_max = 255
default_input = "genesis_plus_gx"

[[dac.inputs]]
id = "genesis_plus_gx"
name = "Genesis Plus GX"
levels = [0, 34, 68, 102, 136, 170, 204, 238]

[[dac.inputs]]
id = "kega_fusion"
name = "Kega Fusion"
levels = [0, 33, 66, 99, 132, 165, 198, 231]

[[dac.inputs]]
id = "regen"
name = "Regen"
levels = [0, 32, 64, 96, 128, 160, 192, 224]

[provenance]
output = "S: TmEE, MD VDP color levels, SpritesMind forum (gendev.spritesmind.net, topic viewtopic p=27359): oscilloscope at the divider output, 15 levels 0, 108, 192, 261, 324, 378, 432, 483, 537, 588, 642, 699, 768, 849, 951 mV; the normal mode is the even levels 0, 192, 324, 432, 537, 642, 768, 951 mV, which scaled so that 951 mV is 255 give 0, 51.5, 86.9, 115.8, 144.0, 172.1, 205.9, 255 and are written 0, 52, 87, 116, 144, 172, 206, 255 as the published table has them (the first step is 51.5, half a level either side); Eke's voltages 0, 0.9, 1.6, 2.2, 2.7, 3.2, 3.8, 4.7 V agree to within the rounding of the voltages"
output_max = "K: 8-bit output code; the white scale is open (255 here, 238 if 4.7 V is 0.9 V at the encoder)"
default_input = "E: Genesis Plus GX is the core most frontends use for the Mega Drive"
inputs = "E: Genesis Plus GX step 34 and maximum 238 (Eke, GPGX issue 345); Kega Fusion step 33, white 0xE7 and Regen step 32, white 0xE0 (forum analyses on SpritesMind, topic viewtopic p=33557); not read in the emulators' code"