[provenance]
colours = "S: Y, R-Y and B-Y of the 15 colours (the transparent code is not a colour), TMS9918A, TMS9928A, TMS9929A Video Display Processors Data Manual, Texas Instruments, November 1982, Table 2-3 'Color Assignments' (page 2-17), as the Wikipedia article 'TMS9918' reproduces it (CC BY-SA, which cites that table; a scan with no text layer, not read here) and as two researchers read it from the scan (QUESTIONS.md, 'Second research pass'); in thousandths of the white level, the colour differences around 470 (47 percent); the scope variant agrees within about 0.02 of white; the colour index is the colour code minus 1"
neutral = "S: the data manual's colour differences of black, grey and white are all 47 percent (R-Y and B-Y), so 470 thousandths is the level of a zero colour difference; the scope variant, which is relative to the black level of the chroma outputs ('0V is black level'), has a neutral level of 0"
revisions = "S: datasheet, the file's colours as they are; sc3000_scope, the levels of a TMS9929ANL in an SC-3000 measured by TmEE on an oscilloscope (SMS Power forum, 'TMS9929A video output levels', 30 January 2017, in millivolts, white 964 mV, Y 0 to 964, R-Y -452 to 452, B-Y -384 to 516; the load is not stated and the post gives no error); D: the decode of every colour: R' = Y + (R-Y), B' = Y + (B-Y), G' = (Y - 0.299 R' - 0.114 B') / 0.587 from the unclamped red and blue, clamped to 0 to 1 (the colour differences at unit scale, which keeps every channel but one inside the rails; Rec.601 Pb and Pr scales were computed and put five channels at 1.14 to 1.35, so they are ruled out); E: that the chip's differences are at that scale for a real television, and the neutral offset of the real output"
reference = "E: the classification reference palette, not an output: the datasheet colours decoded as above and raised to the exponents 1.1 and 1.5 (a PC display's gamma), compared as two sets of 15 colours; chosen with a search over a single exponent and over sets of two to five (the pair 1.1 and 1.5 recognises the Wikipedia 'TMS9918' palette, the decode raised to 1.6, in full, and the decode raised to any exponent from 1.0 to 1.6 with at most one colour of 15 taken for a neighbour); not checked against any emulator's own palette"
threshold = "E: the largest distance in drive voltage between a pixel and a reference colour at which the pixel is taken for it; the palettes tested are recognised within 0.07 of their own colour, and the closest two different colours of the reference are 0.04 to 0.12 apart, so the threshold only decides what is left alone (a colour far from all 15)"
black_index = "K: colour code 1 is black, Y = 0 (index 0), taken as the black of the tube"
white_index = "K: colour code 15 is white, Y = 100 percent (index 14), taken as the white of the tube"
