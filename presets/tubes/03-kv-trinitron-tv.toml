schema = 1
id = "kv-trinitron-tv"
name = "Sony KV-class Trinitron consumer TV"
label = "based on published data for Sony KV-class Trinitron televisions"
notes = """
The classic console-on-a-TV look. Mostly estimated: pitch 0.78 mm is the middle of the CRT.md range 0.75 to 0.8 (PHY-4 about 0.78), the 51 x 38 cm size, spot sizes and amplifier are estimates.
Parameters not listed keep their table defaults: mask stripe fill, edge softness, damper width, beam tail, gun law and gamma (power 2.4, CRT.md says 2.4 to 2.5), raster breathing (0, CRT.md consumer 1 to 5 %, no preset value chosen), ABL full-white current, ratio and time constant (table defaults), source clock.
Dampers: two wires by the CRT.md rule for larger monitors [E]. CRT.md also says Goldwasser reports three wires above 21 in [S], and this tube (51 x 38 cm, about 25 in viewable) is above that, so three may be nearer the real tube. Two is kept because the rule is stated for monitors, the three-wire report is generic and not Sony-specific, and the size here is itself an estimate; open point.
White: 9300 K + 27 MPCD (0.281, 0.311), Japanese TV practice as CRT.md gives it (the resolved conflict 6 keeps it apart from D93 = 9300 K + 8 MPCD = (0.2831, 0.2971)), shown without chromatic adaptation. Its linear sRGB at luminance 1 is (R, G, B) = (0.737, 1.055, 1.233) (X/Y = 0.9035, Z/Y = 1.3119), the blue is the largest, so the unmasked white clips unless exposure <= 1 / 1.233 = 0.811; 0.81 is used.
Spot growth: 0.9 -> 1.6 mm with n = 0.42 (Panasonic 76 cm TV datasheet exponent) keeps a non-negative floor (bound ratio 2.01).
Amplifier: 6 MHz (cheap consumer RGB 4 to 8 MHz). The amp stage blur is 0.1325 x 5.37 / 6 = 0.119 source px, so amp_samples = 16 (presets::recommended_amp_k). Fall/rise ratio 0.8: slow rise, so isolated bright pixels lose light (CRT.md adjacent-pixel nonlinearity); the opposite direction (> 1) would brighten them and is not chosen.
Host (PHY-2 option D): 2.96 px per triad on 2560 x 1440, between the option D threshold 2.8 and the tier B threshold 3, where mask_tier = auto would still average the mask away; mask_tier = integrated draws it (ripple possible).
ABL on: threshold 1.4 mA, steady state about 0.5 s (RCA patents, not Sony values).
M4 values (T-64): persistence on with the Kuhn P22 constants, tail strength 1 (the Ni-killed reduction, 4 to 13 times on the 8 ms residual, is not applied: no CRT.md statement for this tube); cylindrical faceplate, horizontal radius 1723 mm (estimate only: 1.54 x 1R from the patent design calculation, inside 1594 to 2100 mm, no Sony KV value); convergence 1.0 mm radial at the corner on red (outward) and blue (inward), no static offset (CRT.md Starting presets TV, no centre value); ABL as above (RCA values). Left at the parameter defaults because CRT.md gives only class ranges or qualitative statements: saturation (off), raster breathing (0; consumer 1 to 5 %, broadcast under 1 %), overscan, pincushion, trapezoid, rotation, eye distance (0, parallel view), phosphor frame rate (60 Hz, set it to the output refresh rate), mask_tier_blend (0.4, D-15).
Not yet parameters (T-63 values kept for later): faceplate thickness 12 mm (generic sourced value for the size, not Sony-specific), halation (13 mm / 2 %), glass transmission.
Headroom (T-84, D-16; default auto, T-84b): a full-white field is not flat on the tube. On the reference host 2560 x 1440 with a 320 x 240 source the readout (crate::headroom) is mask peak 2.956 x scanline peak 1.050 x white matrix maximum 1.233 x exposure 0.81 = 3.101: the brightest elements are 3.101 times panel white, so the exposure alone does not keep white unclipped (the earlier 'no clip' statement covered the unmasked white only). The preset sets mask_depth = 0.25 and does not set output_headroom_mode: it inherits the parameter default auto, which resolves to mask_depth here (the mask is resolved on this host, physical peak 2.956). Measured by the flat-white chain test of tests/presets.rs (ABL off; shares of the intended white mean): the T-46 hard clip loses 40.1 %; the shoulder (knee 0.6, white point = readout x 1.02, non-physical above the knee) keeps 57.9 % with no hard clip; the physical mode keeps every element unclipped at an effective exposure of 0.256 (31.6 %); the mask depth mode (non-physical, white mean kept, exposure derived from the lowered readout so nothing clips) keeps 47.3 % at the parameter default depth 0.5 and 62.8 % at this preset's depth 0.25, which is what the default gives. That is below the 85 % target of the test and is its documented exception: the readout gives a depth of about 0.05 for 85 %, a nearly flat mask (95 % of the stripe contrast removed), so 0.25 is kept as a compromise: the lit stripes are 1 + 0.25 (2.956 - 1) = 1.489 times the mean instead of 2.956. A lower depth keeps more white and flattens the stripes, a higher one the reverse; the shoulder or physical modes stay selectable. The readout changes with the host size and the source lines.
"""

[params]
tube_visible_height_mm = 380.0
tube_aspect = 1.3333334
mask_type = "aperture_grille"
mask_pitch_mm = 0.78
mask_damper_count = 2
mask_tier = "integrated"
tube_red_xy = [0.625, 0.340]
tube_green_xy = [0.280, 0.595]
tube_blue_xy = [0.155, 0.070]
tube_white_xy = [0.281, 0.311]
beam_fwhm_mid_mm = 0.9
beam_fwhm_peak_mm = 1.6
beam_growth_exponent = 0.42
amp_bandwidth_mhz = 6.0
amp_fall_rise_ratio = 0.8
amp_samples = 16
abl_enable = true
abl_threshold_ma = 1.4
abl_tau_s = 0.1667
geometry_curvature = "cylindrical"
geometry_radius_mm = 1723.0
phosphor_persistence = true
phosphor_tail_strength_rgb = [1.0, 1.0, 1.0]
geometry_conv_red_radial_mm = 1.0
geometry_conv_blue_radial_mm = -1.0
exposure = 0.81
output_match_srgb = false
output_dither = "noise"
mask_depth = 0.25

[provenance]
tube_visible_height_mm = "E: CRT.md Starting presets, Sony KV Trinitron TV 51 x 38 cm"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "S: CRT.md Starting presets, Sony KV Trinitron TV AG"
mask_pitch_mm = "E: CRT.md Starting presets 0.75 to 0.8 mm; PHY-4 about 0.78 (no Sony-specific pitch data)"
mask_damper_count = "E: CRT.md Aperture grille geometry, two wires on larger tubes (rule stated for monitors); CRT.md: three wires above 21 in (Goldwasser), not applied, see notes"
mask_tier = "D: PHY-2 option D: 2.96 px per triad on 2560 x 1440, below the tier B threshold 3, so auto would prefilter the mask; integrated draws it, ripple possible"
tube_red_xy = "K: CRT.md Starting presets, Trinitron (0.625, 0.34); same as Apple RGB row"
tube_green_xy = "K: CRT.md Starting presets, Trinitron (0.28, 0.595)"
tube_blue_xy = "K: CRT.md Starting presets, Trinitron (0.155, 0.07)"
tube_white_xy = "S: CRT.md White point table, 9300 K + 27 MPCD (0.281, 0.311), Japanese TV practice; not D93 (CRT.md resolved conflict 6)"
beam_fwhm_mid_mm = "E: CRT.md Starting presets, Sony KV 0.9 mm mid"
beam_fwhm_peak_mm = "E: CRT.md Starting presets, Sony KV 1.6 mm at peak"
beam_growth_exponent = "E: CRT.md T-63 item 7, TV presets about 0.42 (Panasonic 76 cm), floor non-negative for 0.9 -> 1.6 [T-87: was D; 0.42 is borrowed from a Panasonic 76 cm tube; no data for this tube]"
amp_bandwidth_mhz = "E: CRT.md RGB path table, cheap consumer TV RGB 4 to 8 MHz"
amp_fall_rise_ratio = "E: below 1, isolated bright pixels dimmer (CRT.md adjacent-pixel nonlinearity)"
amp_samples = "D: presets::recommended_amp_k: edge sigma 0.1325 x 5.37 MHz / 6 MHz = 0.119 source px, above 0.02 so K = 16"
abl_enable = "E: CRT.md ABL, consumer TVs limit; T-63 item 3"
abl_threshold_ma = "E: CRT.md T-63, RCA/Thomson average limiter 1.4 mA (RCA value, not Sony) [T-87: was S; the 1.4 mA is an RCA/Thomson value from another tube]"
abl_tau_s = "E: CRT.md T-63, steady state about 0.5 s (RCA US 4,330,792), tau = 0.5 / 3 s [T-87: was D; tau = 0.5/3 s rests on a first-order assumption and an RCA value from another tube]"
geometry_curvature = "E: CRT.md Faceplate curvature: Trinitron-type aperture grilles are cylindrical, curved horizontally and flat vertically [S]"
geometry_radius_mm = "E: weak, CRT.md Faceplate curvature and T-63 item 3: about 1.3 to 1.75 x 1R from the US 5,386,174 design calculation only; the midpoint 1.54 x 1R = 1.54 x 1.767 x 633.3 mm = 1723 mm (inside the 1594 to 2100 mm patent range, near the unverified Sony about 2,000 mm); no Sony KV product value"
phosphor_persistence = "D: CRT.md Decay and persistence and T-63 item 1: all presets are P22, persistence on with the Kuhn (2002) constants of crt_model::phosphor (E1/E0 5.36 % green, 4.72 % blue at 60 Hz); the exact P22 variant of this tube is unknown [T-87: was D; D covers only the first-frame energy ratios E1/E0; the tail beyond 2 ms is E (phosphor_tail_strength_rgb)]"
phosphor_tail_strength_rgb = "E: CRT.md Decay and persistence: 1 = the measured Kuhn power-law tail; Ni-killed sulfides would cut the 8 ms residual 4 to 13 times (US 5,825,124) but CRT.md has no statement for this tube, so the reduction is not applied (allowed range 0.07 to 1) [T-87: was S; the Kuhn P22 power-law tail is extrapolated beyond 2 ms from another sample, not measured on this tube]"
geometry_conv_red_radial_mm = "E: CRT.md Starting presets, convergence error corners 0.5 to 1.5 mm (TV): midpoint 1.0 mm at the corner as the radial term; CRT.md gives no centre value for TVs, so the static offset stays 0; red outward and blue inward by the mirror-image rule (CRT.md Convergence), green is the reference"
geometry_conv_blue_radial_mm = "E: CRT.md Starting presets, convergence error corners 0.5 to 1.5 mm (TV): midpoint 1.0 mm at the corner as the radial term; CRT.md gives no centre value for TVs, so the static offset stays 0; red outward and blue inward by the mirror-image rule (CRT.md Convergence), green is the reference"
exposure = "D: white (0.281, 0.311) has linear sRGB blue 1.233 at Y = 1, so exposure <= 1 / 1.233 = 0.811; 0.81 used; this bounds the unmasked white only: the mask and scanline peaks lift elements above panel white (headroom readout 3.101 on 2560 x 1440), handled by output_headroom_mode (T-84)"
output_match_srgb = "E: COL-2, tube-faithful presets"
output_dither = "E: COL-4, noise dither for presets"
mask_depth = "E: T-84b (owner decision 2026-11-19, default to C; user-tunable, no source): a compromise, measured by the flat-white chain test on 2560 x 1440 (320 x 240 source, ABL off): keeps 62.8 % of the intended white at 0.25 against 47.3 % at the parameter default 0.5; about 0.05 would keep 85 % but leaves a nearly flat mask (see notes)"
