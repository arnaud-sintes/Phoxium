schema = 1
id = "arcade-19in"
name = "19 in arcade monitor (in-line slot)"
label = "based on published data for 19 in arcade monitors (class values, no single model)"
notes = """
Arcade look, the coarsest mask of the list. Estimated: pitch 0.75 mm (CRT.md range 0.7 to 0.8; an unidentified 19 in arcade monitor measured 0.81 mm on a forum, so the class is uncertain), size 36 x 27 cm, spot and amplifier. No arcade tube data in CRT.md; RCA 20V TV tubes are 0.84 mm.
Parameters not listed keep their table defaults: slot period and bridge, mask stripe fill, edge softness, beam tail, gun law and gamma (power 2.4, CRT.md says 2.4 to 2.5), ABL (off, no value for arcade chassis), source clock.
White: about 9300 K as the tube white (D93), P22 primaries. D93 has linear sRGB blue 1.343, so exposure is 0.74 (<= 0.745) or the unmasked white clips.
Spot growth: 0.9 -> 1.6 mm with n = 0.42 keeps a non-negative floor.
Amplifier: 6 MHz, no arcade row in CRT.md, the consumer RGB class 4 to 8 MHz is used. The amp stage blur is 0.1325 x 5.37 / 6 = 0.119 source px, so amp_samples = 16. Fall/rise ratio 0.8: slow rise, isolated bright pixels lose light; the opposite direction would brighten them and is not chosen.
M4 values (T-64): persistence on with the Kuhn P22 constants, tail strength 1 (the Ni-killed reduction, 4 to 13 times on the 8 ms residual, is not applied: no CRT.md statement for this tube); spherical 1R faceplate, R = 1.767 x 450 mm = 795 mm (estimate: arcade monitors use TV-class tubes, no arcade value). ABL stays off and convergence stays 0: CRT.md has neither value for arcade chassis. Left at the parameter defaults because CRT.md gives only class ranges or qualitative statements: saturation (off), raster breathing (0; consumer 1 to 5 %, broadcast under 1 %), overscan, pincushion, trapezoid, rotation, eye distance (0, parallel view), phosphor frame rate (60 Hz, set it to the output refresh rate), mask_tier_blend (0.4, D-15).
Not yet parameters (T-63 values kept for later): faceplate thickness 11 mm (LG.Philips 9 to 11.5 mm for 400 to 500 mm diagonals), halation (12 mm / 3 %).
Headroom (T-84, D-16; default auto, T-84b): a full-white field is not flat on the tube. On the reference host 2560 x 1440 with a 320 x 240 source the readout (crate::headroom) is mask peak 3.720 x scanline peak 1.001 x white matrix maximum 1.347 x exposure 0.74 = 3.712: the brightest elements are 3.712 times panel white, so the exposure alone does not keep white unclipped (the earlier 'no clip' statement covered the unmasked white only). The preset sets mask_depth = 0.25 and does not set output_headroom_mode: it inherits the parameter default auto, which resolves to mask_depth here (the mask is resolved on this host, physical peak 3.720). Measured by the flat-white chain test of tests/presets.rs (ABL off; shares of the intended white mean): the T-46 hard clip loses 44.1 %; the shoulder (knee 0.6, white point = readout x 1.02, non-physical above the knee) keeps 54.6 % with no hard clip; the physical mode keeps every element unclipped at an effective exposure of 0.195 (26.4 %); the mask depth mode (non-physical, white mean kept, exposure derived from the lowered readout so nothing clips) keeps 41.6 % at the parameter default depth 0.5 and 58.5 % at this preset's depth 0.25, which is what the default gives. That is below the 85 % target of the test and is its documented exception: the readout gives a depth of about 0.05 for 85 %, a nearly flat mask (95 % of the stripe contrast removed), so 0.25 is kept as a compromise: the lit stripes are 1 + 0.25 (3.720 - 1) = 1.680 times the mean instead of 3.720. A lower depth keeps more white and flattens the stripes, a higher one the reverse; the shoulder or physical modes stay selectable. The readout changes with the host size and the source lines.
"""

[params]
tube_visible_height_mm = 270.0
tube_aspect = 1.3333334
mask_type = "slot_mask"
mask_pitch_mm = 0.75
tube_red_xy = [0.635, 0.340]
tube_green_xy = [0.305, 0.595]
tube_blue_xy = [0.155, 0.070]
tube_white_xy = [0.2831, 0.2971]
beam_fwhm_mid_mm = 0.9
beam_fwhm_peak_mm = 1.6
beam_growth_exponent = 0.42
amp_bandwidth_mhz = 6.0
amp_fall_rise_ratio = 0.8
amp_samples = 16
geometry_curvature = "spherical"
geometry_radius_mm = 795.0
phosphor_persistence = true
phosphor_tail_strength_rgb = [1.0, 1.0, 1.0]
exposure = 0.74
output_match_srgb = false
output_dither = "noise"
mask_depth = 0.25

[provenance]
tube_visible_height_mm = "E: CRT.md Starting presets, 19 in arcade 36 x 27 cm"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "E: CRT.md Consumer TVs and arcade table, dot or slot; Starting presets: in-line slot"
mask_pitch_mm = "E: CRT.md Starting presets 0.7 to 0.8 mm; PHY-4 about 0.75"
tube_red_xy = "E: CRT.md Chromaticity, measured P22 (Starting presets: P22) [T-87: was S; measured P22 is a class value, not this tube]"
tube_green_xy = "E: CRT.md Chromaticity, measured P22 [T-87: was S; measured P22 is a class value, not this tube]"
tube_blue_xy = "E: CRT.md Chromaticity, measured P22 [T-87: was S; measured P22 is a class value, not this tube]"
tube_white_xy = "E: CRT.md Starting presets, about 9300 K; D93 coordinates from White point"
beam_fwhm_mid_mm = "E: CRT.md Starting presets, 19 in arcade about 0.9 mm mid"
beam_fwhm_peak_mm = "E: CRT.md Starting presets, 19 in arcade about 1.6 mm at peak"
beam_growth_exponent = "E: CRT.md T-63 item 7, TV presets about 0.42, floor non-negative for 0.9 -> 1.6 [T-87: was D; 0.42 is borrowed from a Panasonic 76 cm tube; no data for this tube]"
amp_bandwidth_mhz = "E: CRT.md RGB path table, consumer RGB 4 to 8 MHz (no arcade row)"
amp_fall_rise_ratio = "E: below 1, isolated bright pixels dimmer (CRT.md adjacent-pixel nonlinearity)"
amp_samples = "D: presets::recommended_amp_k: edge sigma 0.1325 x 5.37 MHz / 6 MHz = 0.119 source px, above 0.02 so K = 16"
geometry_curvature = "E: CRT.md Faceplate curvature: spherical 1R, most pre-1990 TVs and monitors; arcade monitors use TV-class tubes (CRT.md lists the 19 in arcade with the TV pitches), no arcade curvature data"
geometry_radius_mm = "E: CRT.md Faceplate curvature: 1R = 1.767 x 450 mm diagonal = 795 mm (sagitta table: 7.2 % of the diagonal at the corner)"
phosphor_persistence = "D: CRT.md Decay and persistence and T-63 item 1: all presets are P22, persistence on with the Kuhn (2002) constants of crt_model::phosphor (E1/E0 5.36 % green, 4.72 % blue at 60 Hz); the exact P22 variant of this tube is unknown [T-87: was D; D covers only the first-frame energy ratios E1/E0; the tail beyond 2 ms is E (phosphor_tail_strength_rgb)]"
phosphor_tail_strength_rgb = "E: CRT.md Decay and persistence: 1 = the measured Kuhn power-law tail; Ni-killed sulfides would cut the 8 ms residual 4 to 13 times (US 5,825,124) but CRT.md has no statement for this tube, so the reduction is not applied (allowed range 0.07 to 1) [T-87: was S; the Kuhn P22 power-law tail is extrapolated beyond 2 ms from another sample, not measured on this tube]"
exposure = "D: D93 white has linear sRGB blue 1.343 at Y = 1, so exposure <= 0.745; this bounds the unmasked white only: the mask and scanline peaks lift elements above panel white (headroom readout 3.712 on 2560 x 1440), handled by output_headroom_mode (T-84)"
output_match_srgb = "E: COL-2, tube-faithful presets"
output_dither = "E: COL-4, noise dither for presets"
mask_depth = "E: T-84b (owner decision 2026-11-19, default to C; user-tunable, no source): a compromise, measured by the flat-white chain test on 2560 x 1440 (320 x 240 source, ABL off): keeps 58.5 % of the intended white at 0.25 against 41.6 % at the parameter default 0.5; about 0.05 would keep 85 % but leaves a nearly flat mask (see notes)"
