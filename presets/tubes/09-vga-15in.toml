schema = 1
id = "vga-15in"
name = "15 in VGA monitor (delta dot)"
label = "based on published data for 15 in delta-dot VGA monitors (class values, no single model)"
notes = """
DOS and PC games of the 1990s. Entry-level 14 to 15 in class: 0.28 mm diagonal dot pitch (about 0.242 mm horizontal), sourced class values; spot sizes are estimates.
Parameters not listed keep their table defaults: dot fill (0.45), edge softness, beam tail, gun law and gamma (power 2.4, inside the CRT.md range 2.35 to 2.5), ABL (off), source clock (a VGA source profile sets the pixel clock and the double scan).
Pitch is the diagonal dot pitch P (the horizontal triad pitch is 0.866 P).
White: 9300 K default as the tube white (D93), P22 primaries (about SMPTE-C). D93 has linear sRGB blue 1.343, so exposure is 0.74 (<= 0.745) or the unmasked white clips.
Spot growth: 0.3 -> 0.45 mm, n = 0.27 keeps a non-negative floor (ratio 1.5, bound 1.567).
Amplifier: 100 MHz (PC monitor class, lower end for a 15 in VGA tube). The amp stage blur is 0.1325 x 5.37 / 100 = 0.0071 source px, an ideal amplifier, so amp_samples = 4 (presets::recommended_amp_k). Ratio 1.0.
M4 values (T-64): persistence on with the Kuhn P22 constants, tail strength 1 (the Ni-killed reduction, 4 to 13 times on the 8 ms residual, is not applied: no CRT.md statement for this tube); spherical 1.5R faceplate, R = 1.5 x 1.767 x 355 mm = 941 mm (CRT.md: flatter spherical 1.5R to 2R for the 1990s, exact value not confirmed); convergence 0.075 mm static plus 0.275 mm radial on red (outward) and blue (inward), green the reference (CRT.md Starting presets PC/PVM midpoints); ABL stays off. Left at the parameter defaults because CRT.md gives only class ranges or qualitative statements: saturation (off), raster breathing (0; consumer 1 to 5 %, broadcast under 1 %), overscan, pincushion, trapezoid, rotation, eye distance (0, parallel view), phosphor frame rate (60 Hz, set it to the output refresh rate), mask_tier_blend (0.4, D-15).
Not yet parameters: faceplate thickness 10 mm (estimate, no value below 400 mm diagonal), halation (10 mm / 2 %).
Headroom (T-84, D-16; default auto, T-84b): a full-white field is not flat on the tube. On the reference host 2560 x 1440 with a 320 x 240 source the readout (crate::headroom) is mask peak 1.000 x scanline peak 1.808 x white matrix maximum 1.347 x exposure 0.74 = 1.801: the brightest elements are 1.801 times panel white, so the exposure alone does not keep white unclipped (the earlier 'no clip' statement covered the unmasked white only). The preset does not set output_headroom_mode: it inherits the parameter default auto, which resolves to the shoulder here (the mask is not resolved on this host, so a mask depth would do nothing: the peak comes from the scanlines). Measured by the flat-white chain test of tests/presets.rs (ABL off; shares of the intended white mean): the T-46 hard clip loses 14.1 %; the shoulder (knee 0.6, white point = readout x 1.02, non-physical above the knee) keeps 81.5 % with no hard clip; the physical mode keeps every element unclipped at an effective exposure of 0.403 (54.4 %). This is below the 85 % target of that test and is its documented exception: every mode that avoids the hard clip gives up at least 1 - 1 / readout of the white. Where a host resolves the mask, auto switches to mask_depth at the parameter default depth 0.5 (no preset depth set: not measured at such a host). The readout changes with the host size and the source lines.
"""

[params]
tube_visible_height_mm = 213.0
tube_aspect = 1.3333334
mask_type = "delta"
mask_pitch_mm = 0.28
tube_red_xy = [0.635, 0.340]
tube_green_xy = [0.305, 0.595]
tube_blue_xy = [0.155, 0.070]
tube_white_xy = [0.2831, 0.2971]
beam_fwhm_mid_mm = 0.3
beam_fwhm_peak_mm = 0.45
beam_growth_exponent = 0.27
amp_bandwidth_mhz = 100.0
amp_fall_rise_ratio = 1.0
amp_samples = 4
geometry_curvature = "spherical"
geometry_radius_mm = 941.0
phosphor_persistence = true
phosphor_tail_strength_rgb = [1.0, 1.0, 1.0]
geometry_conv_red_dx_mm = 0.075
geometry_conv_blue_dx_mm = -0.075
geometry_conv_red_radial_mm = 0.275
geometry_conv_blue_radial_mm = -0.275
exposure = 0.74
output_match_srgb = false
output_dither = "noise"

[provenance]
tube_visible_height_mm = "D: CRT.md Reference scales, 15 in VGA monitor 284 x 213 mm"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "S: CRT.md PC monitors table, entry-level 14 to 15 in dot"
mask_pitch_mm = "S: CRT.md PC monitors table, 0.28 mm diagonal (0.24 to 0.25 horizontal)"
tube_red_xy = "E: CRT.md Chromaticity, measured P22 (Starting presets: P22, about SMPTE-C) [T-87: was S; measured P22 is a class value, not this tube]"
tube_green_xy = "E: CRT.md Chromaticity, measured P22 [T-87: was S; measured P22 is a class value, not this tube]"
tube_blue_xy = "E: CRT.md Chromaticity, measured P22 [T-87: was S; measured P22 is a class value, not this tube]"
tube_white_xy = "E: CRT.md White point, 9300 K + 8 MPCD (D93), Starting presets 9300 K default [T-87: was S; D93 is the PC-monitor class default, not a datum of this model]"
beam_fwhm_mid_mm = "E: CRT.md Starting presets, 15 in VGA 0.3 mm mid"
beam_fwhm_peak_mm = "E: CRT.md Starting presets, 15 in VGA 0.45 mm at peak"
beam_growth_exponent = "E: Hitachi 51 cm apparent exponent 0.27 (CRT.md T-63 item 7, US 5,814,930); CRT.md says the model exponent is at least the apparent one, so 0.27 is the lower bound used, not a measurement of this tube [T-87: was D; the Hitachi 0.27 is the apparent exponent without floor, not the model exponent; T-88 re-derives]"
amp_bandwidth_mhz = "E: CRT.md RGB path table, PC monitor 100 to 400 MHz (lower end)"
amp_fall_rise_ratio = "E: symmetric, amplifier not the limit"
amp_samples = "D: presets::recommended_amp_k: edge sigma 0.1325 x 5.37 MHz / 100 MHz = 0.0071 source px, at most the 0.01 ideal limit so K = 4 (the default)"
geometry_curvature = "E: CRT.md Faceplate curvature: flatter spherical 1.5R to 2R for late-1980s/90s tubes (exact FST not confirmed); 1.5R (the lower end) chosen"
geometry_radius_mm = "E: CRT.md Faceplate curvature: 1.5R = 1.5 x 1.767 x 355 mm diagonal = 941 mm (sagitta table: 4.8 % of the diagonal at the corner)"
phosphor_persistence = "D: CRT.md Decay and persistence and T-63 item 1: all presets are P22, persistence on with the Kuhn (2002) constants of crt_model::phosphor (E1/E0 5.36 % green, 4.72 % blue at 60 Hz); the exact P22 variant of this tube is unknown [T-87: was D; D covers only the first-frame energy ratios E1/E0; the tail beyond 2 ms is E (phosphor_tail_strength_rgb)]"
phosphor_tail_strength_rgb = "E: CRT.md Decay and persistence: 1 = the measured Kuhn power-law tail; Ni-killed sulfides would cut the 8 ms residual 4 to 13 times (US 5,825,124) but CRT.md has no statement for this tube, so the reduction is not applied (allowed range 0.07 to 1) [T-87: was S; the Kuhn P22 power-law tail is extrapolated beyond 2 ms from another sample, not measured on this tube]"
geometry_conv_red_dx_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_blue_dx_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_red_radial_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_blue_radial_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
exposure = "D: D93 white has linear sRGB blue 1.343 at Y = 1, so exposure <= 0.745; this bounds the unmasked white only: the mask and scanline peaks lift elements above panel white (headroom readout 1.801 on 2560 x 1440), handled by output_headroom_mode (T-84)"
output_match_srgb = "E: COL-2, tube-faithful presets"
output_dither = "E: COL-4, noise dither for presets"
