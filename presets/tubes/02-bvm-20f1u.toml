schema = 1
id = "bvm-20f1u"
name = "Sony BVM-20F1U (broadcast reference monitor)"
label = "based on published data for the Sony BVM-20F1U"
notes = """
Broadcast reference. Pitch sourced (0.30 mm), D65 and the BT.1886 origin sourced; spot size and bandwidth are estimates.
Parameters not listed keep their table defaults: mask stripe fill, edge softness, damper width, beam tail, gun law and gamma (power 2.4), ABL (off), source clock.
Spot growth: n = 0.5 with the widths 0.4 -> 0.7 mm kept (T-36b review). The earlier n = 0.34 (smallest two-decimal zero-floor value, bound 0.3364) leaves a very small floor d0, a spot that is almost a pure power law; the Hitachi datasheet fits n about 0.71, and n = 0.5 gives peak/d0 about 2.5. The widths are the CRT.md estimates and are not changed.
Amplifier: 25 MHz. The amp stage blur is 0.1325 x 5.37 / 25 = 0.0285 source px, above the 0.02 px where K = 16 starts (K = 4 over-dims isolated vertical lines by about 1.1 points at 30 MHz, T-33 follow-up), so amp_samples = 16 (presets::recommended_amp_k). Fall/rise ratio 1.0.
Output: tube-faithful (EBU primaries, D65), dithered. D65 white does not clip at exposure 1, but the pure tube red does in linear sRGB (largest channel 1.044: the EBU red lies outside sRGB); the no-clip check covers white only, the clipped-primaries test of presets.rs reports the primaries as information.
Not yet in the parameter table (M4, T-64): decay constants, faceplate thickness 11 mm, halation (12 mm / 1 %).
"""

[params]
tube_visible_height_mm = 290.0
tube_aspect = 1.3333334
mask_type = "aperture_grille"
mask_pitch_mm = 0.30
mask_damper_count = 2
tube_red_xy = [0.640, 0.330]
tube_green_xy = [0.290, 0.600]
tube_blue_xy = [0.150, 0.060]
tube_white_xy = [0.3127, 0.3290]
beam_fwhm_mid_mm = 0.4
beam_fwhm_peak_mm = 0.7
beam_growth_exponent = 0.5
amp_bandwidth_mhz = 25.0
amp_fall_rise_ratio = 1.0
amp_samples = 16
exposure = 1.0
output_match_srgb = false
output_dither = "noise"

[provenance]
tube_visible_height_mm = "S: CRT.md Reference scales, BVM-20F1U visible 386 x 290 mm"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "S: CRT.md Pitch values by family, Sony professional, AG"
mask_pitch_mm = "S: CRT.md Sony professional table, BVM-20F1U 0.30 mm"
mask_damper_count = "S: CRT.md Aperture grille geometry, two wires on larger monitors (20 in)"
tube_red_xy = "S: CRT.md Chromaticity, EBU Tech 3213 (BVM-D hold SMPTE-C or EBU; Starting presets lists SMPTE-C / EBU / 709)"
tube_green_xy = "S: CRT.md Chromaticity, EBU Tech 3213"
tube_blue_xy = "S: CRT.md Chromaticity, EBU Tech 3213"
tube_white_xy = "S: CRT.md White point, D65 (Starting presets: D65)"
beam_fwhm_mid_mm = "E: CRT.md Starting presets, BVM-20F1U 0.4 mm mid"
beam_fwhm_peak_mm = "E: CRT.md Starting presets, BVM-20F1U 0.7 mm at peak"
beam_growth_exponent = "E: chosen between the zero-floor bound 0.3364 and the Hitachi datasheet fit about 0.71; n = 0.5 gives peak/d0 about 2.5 for 0.4 -> 0.7 mm (T-36b review); CRT.md: the model exponent is at least the Hitachi apparent 0.27"
amp_bandwidth_mhz = "E: CRT.md RGB path table, PVM/BVM high-res 20 to 30 MHz (middle)"
amp_fall_rise_ratio = "E: symmetric; asymmetric direction not chosen for a professional amplifier"
