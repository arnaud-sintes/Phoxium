schema = 1
id = "bvm-20f1u"
name = "Sony BVM-20F1U (broadcast reference monitor)"
label = "based on published data for the Sony BVM-20F1U"
notes = """
Broadcast reference. Pitch sourced (0.30 mm), D65 and the BT.1886 origin sourced; spot size and bandwidth are estimates.
Parameters not listed keep their table defaults: mask stripe fill, edge softness, damper width, beam tail, gun law and gamma (power 2.4), ABL (off), source clock.
Spot growth: n = 0.5 with the widths 0.4 -> 0.7 mm kept (T-36b review). The earlier n = 0.34 (smallest two-decimal zero-floor value, bound 0.3364) leaves a very small floor d0, a spot that is almost a pure power law; the Hitachi datasheet fits n about 0.71, and n = 0.5 gives peak/d0 about 2.5. The widths are the CRT.md estimates and are not changed.
Amplifier: 25 MHz. The amp stage blur is 0.1325 x 5.37 / 25 = 0.0285 source px, above the 0.02 px where K = 16 starts (K = 4 over-dims isolated vertical lines by about 1.1 points at 30 MHz, T-33 follow-up), so amp_samples = 16 (presets::recommended_amp_k). Fall/rise ratio 1.0.
Output: tube-faithful (EBU primaries, D65), dithered. The unmasked D65 white stays within panel white at exposure 1 (element peaks do not: see Headroom below), but the pure tube red exceeds it in linear sRGB (largest channel 1.044: the EBU red lies outside sRGB); the white check of presets.rs covers the unmasked white only, the clipped-primaries test of presets.rs reports the primaries as information.
M4 values (T-64): persistence on with the Kuhn P22 constants, tail strength 1 (the Ni-killed reduction, 4 to 13 times on the 8 ms residual, is not applied: no CRT.md statement for this tube); cylindrical faceplate, horizontal radius 1315 mm (estimate: 1.54 x 1R, scaled from the only patent design calculation, no BVM value); convergence 0.075 mm static plus 0.275 mm radial on red (outward) and blue (inward), green the reference (CRT.md Starting presets PC/PVM midpoints); ABL stays off (PVM/BVM have very mild ABL). Left at the parameter defaults because CRT.md gives only class ranges or qualitative statements: saturation (off), raster breathing (0; consumer 1 to 5 %, broadcast under 1 %), overscan, pincushion, trapezoid, rotation, eye distance (0, parallel view), phosphor frame rate (60 Hz, set it to the output refresh rate), mask_tier_blend (0.4, D-15).
Not yet parameters (T-63 values kept for later): faceplate thickness 11 mm, halation (12 mm / 1 %), glass transmission.
Headroom (T-84, D-16): a full-white field is not flat on the tube. On the reference host 2560 x 1440 with a 320 x 240 source the readout (crate::headroom) is mask peak 1.000 x scanline peak 1.592 x white matrix maximum 1.044 x exposure 1.00 = 1.662: the brightest elements are 1.662 times panel white, so the exposure alone does not keep white unclipped (the earlier 'no clip' statement covered the unmasked white only). Measured by the flat-white chain test of tests/presets.rs (ABL off): the T-46 hard clip loses 17.8 % of the white mean; the default headroom mode shoulder (knee 0.6, white point = readout x 1.02, non-physical above the knee) has no hard clip and keeps 78.2 % of the intended white mean; the physical mode keeps every element unclipped at an effective exposure of 0.590 (59 % of the intended white). The readout changes with the host size and the source lines.
"""

[params]
tube_visible_height_mm = 290.0
tube_aspect = 1.3333334
mask_type = "aperture_grille"
mask_pitch_mm = 0.30
mask_damper_count = 2
tube_red_xy = [0.640, 0.330]
tube_green_xy = [0.290, 0.600]
tube_blue_xy = [0.150, 0.060]
tube_white_xy = [0.3127, 0.3290]
beam_fwhm_mid_mm = 0.4
beam_fwhm_peak_mm = 0.7
beam_growth_exponent = 0.5
amp_bandwidth_mhz = 25.0
amp_fall_rise_ratio = 1.0
amp_samples = 16
geometry_curvature = "cylindrical"
geometry_radius_mm = 1315.0
phosphor_persistence = true
phosphor_tail_strength_rgb = [1.0, 1.0, 1.0]
geometry_conv_red_dx_mm = 0.075
geometry_conv_blue_dx_mm = -0.075
geometry_conv_red_radial_mm = 0.275
geometry_conv_blue_radial_mm = -0.275
exposure = 1.0
output_match_srgb = false
output_dither = "noise"
output_headroom_mode = "shoulder"

[provenance]
tube_visible_height_mm = "S: CRT.md Reference scales, BVM-20F1U visible 386 x 290 mm"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "S: CRT.md Pitch values by family, Sony professional, AG"
mask_pitch_mm = "S: CRT.md Sony professional table, BVM-20F1U 0.30 mm"
mask_damper_count = "D: CRT.md Aperture grille geometry, two wires on larger monitors (20 in) [T-87: was S; Goldwasser gives a size-class rule (wires per tube size), not a count for this model]"
tube_red_xy = "E: CRT.md Chromaticity, EBU Tech 3213 (BVM-D hold SMPTE-C or EBU; Starting presets lists SMPTE-C / EBU / 709) [T-87: was S; SMPTE-C/EBU/P22 is a standard or class value, not a published measurement of this tube]"
tube_green_xy = "E: CRT.md Chromaticity, EBU Tech 3213 [T-87: was S; SMPTE-C/EBU/P22 is a standard or class value, not a published measurement of this tube]"
tube_blue_xy = "E: CRT.md Chromaticity, EBU Tech 3213 [T-87: was S; SMPTE-C/EBU/P22 is a standard or class value, not a published measurement of this tube]"
tube_white_xy = "K: CRT.md White point, D65 (Starting presets: D65) [T-87: was S; D65 is the broadcast reference white convention; no datum for this model]"
beam_fwhm_mid_mm = "E: CRT.md Starting presets, BVM-20F1U 0.4 mm mid"
beam_fwhm_peak_mm = "E: CRT.md Starting presets, BVM-20F1U 0.7 mm at peak"
beam_growth_exponent = "E: chosen between the zero-floor bound 0.3364 and the Hitachi datasheet fit about 0.71; n = 0.5 gives peak/d0 about 2.5 for 0.4 -> 0.7 mm (T-36b review); CRT.md: the model exponent is at least the Hitachi apparent 0.27"
amp_bandwidth_mhz = "E: CRT.md RGB path table, PVM/BVM high-res 20 to 30 MHz (middle)"
amp_fall_rise_ratio = "E: symmetric; asymmetric direction not chosen for a professional amplifier"
amp_samples = "D: presets::recommended_amp_k: edge sigma 0.1325 x 5.37 MHz / 25 MHz = 0.0285 source px, above 0.02 so K = 16"
geometry_curvature = "E: CRT.md Faceplate curvature: Trinitron-type aperture grilles are cylindrical, curved horizontally and flat vertically [S]; an aperture grille makes it a Trinitron-type tube, CRT.md gives no PVM or BVM curvature"
geometry_radius_mm = "E: weak, CRT.md Faceplate curvature: no Sony product radius found; the US 5,386,174 design calculation (outer horizontal radius 1594 to 2100 mm for a 680 mm diagonal, 1.33 to 1.75 times the 1R value) scaled to this 483 mm diagonal: 1.54 x 1R = 1.54 x 1.767 x 483.3 mm = 1315 mm; not a product value"
phosphor_persistence = "D: CRT.md Decay and persistence and T-63 item 1: all presets are P22, persistence on with the Kuhn (2002) constants of crt_model::phosphor (E1/E0 5.36 % green, 4.72 % blue at 60 Hz); the exact P22 variant of this tube is unknown [T-87: was D; D covers only the first-frame energy ratios E1/E0; the tail beyond 2 ms is E (phosphor_tail_strength_rgb)]"
phosphor_tail_strength_rgb = "E: CRT.md Decay and persistence: 1 = the measured Kuhn power-law tail; Ni-killed sulfides would cut the 8 ms residual 4 to 13 times (US 5,825,124) but CRT.md has no statement for this tube, so the reduction is not applied (allowed range 0.07 to 1) [T-87: was S; the Kuhn P22 power-law tail is extrapolated beyond 2 ms from another sample, not measured on this tube]"
geometry_conv_red_dx_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_blue_dx_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_red_radial_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_blue_radial_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
exposure = "D: D65 white: the unmasked white maps to panel white at exposure 1 (largest linear sRGB channel 1). Not a no-clip statement: the mask and scanline peaks lift elements above it (headroom readout 1.662 on 2560 x 1440), handled by output_headroom_mode (T-84)"
output_match_srgb = "E: COL-2, tube-faithful presets"
output_dither = "E: COL-4, noise dither for presets"
output_headroom_mode = "E: PLAN D-16 (owner decision 2026-11-19): the shoulder default (knee 0.6, automatic white point from the headroom readout) for every preset; readout 1.662 on 2560 x 1440 (see notes); physical, mask_depth and clip stay selectable"
