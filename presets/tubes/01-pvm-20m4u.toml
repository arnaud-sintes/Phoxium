# Tube preset, data only (T-50, QUESTIONS PHY-4, ARCHITECTURE A13). Format: crates/ultimatecrt/src/presets.rs.
# Every key of [params] is a parameter id of params/*.toml and has a [provenance] entry "<tag>: <source>"
# with the CRT.md confidence tag (S sourced, D derived, K standard knowledge, E estimate).
schema = 1
id = "pvm-20m4u"
name = "Sony PVM-20M4U (professional monitor)"
label = "based on published data for the Sony PVM-20M4U"
notes = """
Reference look for clean 240p with deep scanlines. Pitch sourced (0.31 mm); spot size, spot growth and amplifier bandwidth are estimates.
Parameters not listed keep their table defaults: mask stripe fill, edge softness, damper width, beam tail (CRT.md gives only a class range of 2 to 10 %), gun law and gamma (power 2.4), ABL (off, PVM/BVM have very mild ABL), source clock (comes from the source profile).
Spot growth: n = 0.5 with the widths 0.45 -> 0.8 mm kept (T-36b review). The earlier n = 0.35 (the smallest two-decimal zero-floor value, bound 0.3459) leaves a floor d0 of 0.063 mm, peak/d0 = 12.6, a spot that is almost a pure power law; the Hitachi datasheet fits n about 0.71, and n = 0.5 gives peak/d0 about 2.5. CRT.md puts the model exponent at least at the Hitachi apparent exponent 0.27. The widths are the CRT.md estimates and are not changed.
Amplifier: 12 MHz. The amp stage blur is 0.1325 x 5.37 / 12 = 0.059 source px (above the 0.01 px ideal limit), so amp_samples = 16 (K = 4 over-dims isolated vertical lines, T-33 follow-up; presets::recommended_amp_k). Fall/rise ratio 1.0 (symmetric): at this bandwidth the asymmetry is negligible. The M4U is a higher-resolution model than the M2U class whose 8 to 15 MHz row gives this value, so 12 MHz may be low (research point).
Output: tube-faithful (SMPTE-C primaries, D65), not matched to sRGB; dithered. The unmasked D65 white stays within panel white at exposure 1 (element peaks do not: see Headroom below) (the pure SMPTE-C blue is 1.006 in linear sRGB, a marginal clip, reported as information by the presets.rs test).
M4 values (T-64): persistence on with the Kuhn P22 constants, tail strength 1 (the Ni-killed reduction, 4 to 13 times on the 8 ms residual, is not applied: no CRT.md statement for this tube); cylindrical faceplate, horizontal radius 1315 mm (estimate: 1.54 x 1R, scaled from the only patent design calculation, no PVM value); convergence 0.075 mm static plus 0.275 mm radial on red (outward) and blue (inward), green the reference (CRT.md Starting presets PC/PVM midpoints); ABL stays off (PVM/BVM have very mild ABL). Left at the parameter defaults because CRT.md gives only class ranges or qualitative statements: saturation (off), raster breathing (0; consumer 1 to 5 %, broadcast under 1 %), overscan, pincushion, trapezoid, rotation, eye distance (0, parallel view), phosphor frame rate (60 Hz, set it to the output refresh rate), mask_tier_blend (0.4, D-15).
Not yet parameters (T-63 values kept for later): faceplate thickness 11 mm, halation (12 mm / 1.5 %), glass transmission.
Headroom (T-84, D-16; default auto, T-84b): a full-white field is not flat on the tube. On the reference host 2560 x 1440 with a 320 x 240 source the readout (crate::headroom) is mask peak 1.000 x scanline peak 1.404 x white matrix maximum 1.006 x exposure 1.00 = 1.413: the brightest elements are 1.413 times panel white, so the exposure alone does not keep white unclipped (the earlier 'no clip' statement covered the unmasked white only). The preset does not set output_headroom_mode: it inherits the parameter default auto, which resolves to the shoulder here (the mask is not resolved on this host, so a mask depth would do nothing: the peak comes from the scanlines). Measured by the flat-white chain test of tests/presets.rs (ABL off; shares of the intended white mean): the T-46 hard clip loses 12.2 %; the shoulder (knee 0.6, white point = readout x 1.02, non-physical above the knee) keeps 83.5 % with no hard clip; the physical mode keeps every element unclipped at an effective exposure of 0.694 (69.4 %). This is below the 85 % target of that test and is its documented exception: every mode that avoids the hard clip gives up at least 1 - 1 / readout of the white. Where a host resolves the mask, auto switches to mask_depth at the parameter default depth 0.5 (no preset depth set: not measured at such a host). The readout changes with the host size and the source lines.
"""

[params]
tube_visible_height_mm = 290.0
tube_aspect = 1.3333334
mask_type = "aperture_grille"
mask_pitch_mm = 0.31
mask_damper_count = 2
tube_red_xy = [0.630, 0.340]
tube_green_xy = [0.310, 0.595]
tube_blue_xy = [0.155, 0.070]
tube_white_xy = [0.3127, 0.3290]
beam_fwhm_mid_mm = 0.45
beam_fwhm_peak_mm = 0.8
beam_growth_exponent = 0.5
amp_bandwidth_mhz = 12.0
amp_fall_rise_ratio = 1.0
amp_samples = 16
geometry_curvature = "cylindrical"
geometry_radius_mm = 1315.0
phosphor_persistence = true
phosphor_tail_strength_rgb = [1.0, 1.0, 1.0]
geometry_conv_red_dx_mm = 0.075
geometry_conv_blue_dx_mm = -0.075
geometry_conv_red_radial_mm = 0.275
geometry_conv_blue_radial_mm = -0.275
exposure = 1.0
output_match_srgb = false
output_dither = "noise"

[provenance]
tube_visible_height_mm = "S: CRT.md Reference scales, PVM-20M4U visible 386 x 290 mm"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "S: CRT.md Pitch values by family, Sony professional, AG"
mask_pitch_mm = "S: CRT.md Sony professional table, PVM-20M4U 0.31 mm"
mask_damper_count = "D: CRT.md Aperture grille geometry, two wires on larger monitors (20 in) [T-87: was S; Goldwasser gives a size-class rule (wires per tube size), not a count for this model]"
tube_red_xy = "E: CRT.md Chromaticity, SMPTE-C (Starting presets: SMPTE-C or EBU) [T-87: was S; SMPTE-C/EBU/P22 is a standard or class value, not a published measurement of this tube]"
tube_green_xy = "E: CRT.md Chromaticity, SMPTE-C [T-87: was S; SMPTE-C/EBU/P22 is a standard or class value, not a published measurement of this tube]"
tube_blue_xy = "E: CRT.md Chromaticity, SMPTE-C [T-87: was S; SMPTE-C/EBU/P22 is a standard or class value, not a published measurement of this tube]"
tube_white_xy = "K: CRT.md White point, D65 (Starting presets: D65 or D93) [T-87: was S; D65 is the broadcast reference white convention; no datum for this model]"
beam_fwhm_mid_mm = "E: CRT.md Starting presets, PVM-20M4U 0.45 mm mid"
beam_fwhm_peak_mm = "E: CRT.md Starting presets, PVM-20M4U 0.8 mm at peak"
beam_growth_exponent = "E: chosen between the zero-floor bound 0.3459 (0.35 gave peak/d0 = 12.6) and the Hitachi datasheet fit about 0.71; n = 0.5 gives peak/d0 about 2.5 for 0.45 -> 0.8 mm (T-36b review); CRT.md: the model exponent is at least the Hitachi apparent 0.27"
amp_bandwidth_mhz = "E: CRT.md RGB path table, middle of the PVM-xxM2U class row 8 to 15 MHz; the PVM-20M4U is a higher-resolution model than that class (the PVM/BVM high-res row is 20 to 30 MHz), so this is probably low"
amp_fall_rise_ratio = "E: symmetric; asymmetric direction not chosen for a professional amplifier"
amp_samples = "D: presets::recommended_amp_k: edge sigma 0.1325 x 5.37 MHz / 12 MHz = 0.059 source px, above 0.02 so K = 16"
geometry_curvature = "E: CRT.md Faceplate curvature: Trinitron-type aperture grilles are cylindrical, curved horizontally and flat vertically [S]; an aperture grille makes it a Trinitron-type tube, CRT.md gives no PVM or BVM curvature"
geometry_radius_mm = "E: weak, CRT.md Faceplate curvature: no Sony product radius found; the US 5,386,174 design calculation (outer horizontal radius 1594 to 2100 mm for a 680 mm diagonal, 1.33 to 1.75 times the 1R value) scaled to this 483 mm diagonal: 1.54 x 1R = 1.54 x 1.767 x 483.3 mm = 1315 mm; not a product value"
phosphor_persistence = "D: CRT.md Decay and persistence and T-63 item 1: all presets are P22, persistence on with the Kuhn (2002) constants of crt_model::phosphor (E1/E0 5.36 % green, 4.72 % blue at 60 Hz); the exact P22 variant of this tube is unknown [T-87: was D; D covers only the first-frame energy ratios E1/E0; the tail beyond 2 ms is E (phosphor_tail_strength_rgb)]"
phosphor_tail_strength_rgb = "E: CRT.md Decay and persistence: 1 = the measured Kuhn power-law tail; Ni-killed sulfides would cut the 8 ms residual 4 to 13 times (US 5,825,124) but CRT.md has no statement for this tube, so the reduction is not applied (allowed range 0.07 to 1) [T-87: was S; the Kuhn P22 power-law tail is extrapolated beyond 2 ms from another sample, not measured on this tube]"
geometry_conv_red_dx_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_blue_dx_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_red_radial_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
geometry_conv_blue_radial_mm = "E: CRT.md Starting presets, convergence error centre 0 to 0.15 mm and corners 0.2 to 0.5 mm (PC/PVM): midpoints 0.075 mm static and 0.35 mm at the corner (0.075 static + 0.275 radial); in-line red and blue are roughly mirror images about green, mostly horizontal (CRT.md Convergence), so red is moved outward and blue inward, green is the reference; the CRT.md convergence table gives 0.2 to 0.3 mm centre for PC monitors (conflict with the 0 to 0.15 row, unresolved)"
exposure = "D: D65 white: the unmasked white maps to panel white at exposure 1 (largest linear sRGB channel 1). Not a no-clip statement: the mask and scanline peaks lift elements above it (headroom readout 1.413 on 2560 x 1440), handled by output_headroom_mode (T-84)"
output_match_srgb = "E: COL-2, tube-faithful presets"
output_dither = "E: COL-4, noise dither for presets"
