schema = 1
id = "tv-13in"
name = "13 in consumer TV (GE class)"
label = "based on published data for a 13 in GE television (pitch measured by a third party)"
notes = """
Small consumer set with a coarse slot mask. Pitch 0.60 mm is measured by Goldwasser (CRT.md); about 440 triads across. Everything else is a consumer-TV class estimate.
No CRT.md data for this set, so these keep their table defaults (primaries and white are listed with that provenance): slot period and bridge, mask stripe fill, edge softness, beam tail, gun law and gamma, raster breathing, source clock (ABL: see the M4 values below). The visible size is derived from the triad count (440 x 0.60 = 264 mm wide), the same size as the 14 in BVM.
Spot: CRT.md gives no row for this set; the consumer TV class (mid 0.7 to 1.5 mm, peak 1.5 to 2 mm) is used with 0.75 -> 1.5 mm, n = 0.42 (ratio 2.0 stays under the zero-floor bound 2.01, which leaves a floor d0 close to zero). Research point (T-36b review): these widths need n = 0.5 for a ratio of 2, which gives peak/d0 about 3.7 at n = 0.5; no 13 in spot data exists, so the widths are not changed here.
Amplifier: 5 MHz (cheap consumer RGB 4 to 8 MHz). The amp stage blur is 0.1325 x 5.37 / 5 = 0.142 source px, so amp_samples = 16 (K = 4 over-dims isolated vertical lines by 2.3 points at 5 MHz, T-33 follow-up). Fall/rise ratio 0.8: slow rise, isolated bright pixels lose light; the opposite direction would brighten them and is not chosen.
Output: tube-faithful, dithered. The unmasked D65 white stays within panel white at exposure 1 (element peaks do not: see Headroom below).
M4 values (T-64): persistence on with the Kuhn P22 constants, tail strength 1 (the Ni-killed reduction, 4 to 13 times on the 8 ms residual, is not applied: no CRT.md statement for this tube); spherical 1R faceplate, R = 1.767 x 330 mm = 583 mm (the diagonal is derived from the triad count); convergence 1.0 mm radial at the corner on red (outward) and blue (inward), no static offset (CRT.md Starting presets TV, no centre value); ABL on with the RCA 1.4 mA and 0.5 s values, FLAGGED: they come from another (larger) RCA tube and CRT.md has no value for a 13 in set, and with the table full-white current of 2.8 mA the limiter engages only above half-field white. Left at the parameter defaults because CRT.md gives only class ranges or qualitative statements: saturation (off), raster breathing (0; consumer 1 to 5 %, broadcast under 1 %), overscan, pincushion, trapezoid, rotation, eye distance (0, parallel view), phosphor frame rate (60 Hz, set it to the output refresh rate), mask_tier_blend (0.4, D-15).
Spot growth flagged: the 0.75 to 1.5 mm widths are at the zero-floor bound for n = 0.42 (see above), no 13 in spot data exists.
Optics (T-45): faceplate thickness 10 mm (estimate); halation weight, transmission, glare, vignette keep the table defaults (no CRT.md value for this tube). The optics stage stays off (optics_enable not set: D-6, D-24, halation is not in the first usable version).
Headroom (T-84, D-16; default auto, T-84b): a full-white field is not flat on the tube. On the reference host 2560 x 1440 with a 320 x 240 source the readout (crate::headroom) is mask peak 3.849 x scanline peak 1.000 x white matrix maximum 1.006 x exposure 1.00 = 3.872: the brightest elements are 3.872 times panel white, so the exposure alone does not keep white unclipped (the earlier 'no clip' statement covered the unmasked white only). The preset sets mask_depth = 0.25 and does not set output_headroom_mode: it inherits the parameter default auto, which resolves to mask_depth here (the mask is resolved on this host, physical peak 3.849). Measured by the flat-white chain test of tests/presets.rs (ABL off; shares of the intended white mean): the T-46 hard clip loses 54.1 %; the shoulder (knee 0.6, white point = readout x 1.02, non-physical above the knee) keeps 44.9 % with no hard clip; the physical mode keeps every element unclipped at an effective exposure of 0.253 (25.3 %); the mask depth mode (non-physical, white mean kept, exposure derived from the lowered readout so nothing clips) keeps 40.2 % at the parameter default depth 0.5 and 56.9 % at this preset's depth 0.25, which is what the default gives. That is below the 85 % target of the test and is its documented exception: the readout gives a depth of about 0.05 for 85 %, a nearly flat mask (95 % of the stripe contrast removed), so 0.25 is kept as a compromise: the lit stripes are 1 + 0.25 (3.849 - 1) = 1.712 times the mean instead of 3.849. A lower depth keeps more white and flattens the stripes, a higher one the reverse; the shoulder or physical modes stay selectable. The readout changes with the host size and the source lines.
"""

[params]
tube_visible_height_mm = 198.0
tube_aspect = 1.3333334
mask_type = "slot_mask"
mask_pitch_mm = 0.60
tube_red_xy = [0.630, 0.340]
tube_green_xy = [0.310, 0.595]
tube_blue_xy = [0.155, 0.070]
tube_white_xy = [0.3127, 0.3290]
beam_fwhm_mid_mm = 0.75
beam_fwhm_peak_mm = 1.5
beam_growth_exponent = 0.42
amp_bandwidth_mhz = 5.0
amp_fall_rise_ratio = 0.8
amp_samples = 16
geometry_curvature = "spherical"
geometry_radius_mm = 583.0
abl_enable = true
abl_threshold_ma = 1.4
abl_tau_s = 0.1667
phosphor_persistence = true
phosphor_tail_strength_rgb = [1.0, 1.0, 1.0]
geometry_conv_red_radial_mm = 1.0
geometry_conv_blue_radial_mm = -1.0
exposure = 1.0
output_match_srgb = false
output_dither = "noise"
mask_depth = 0.25
optics_glass_thickness_mm = 10.0

[provenance]
tube_visible_height_mm = "D: CRT.md Consumer TVs table, about 440 triads x 0.60 mm = 264 mm wide, 4:3"
tube_aspect = "S: CRT.md Reference scales, 4:3"
mask_type = "S: CRT.md Consumer TVs table, 13 in GE TV slot"
mask_pitch_mm = "S: CRT.md Consumer TVs table, 13 in GE TV 0.60 mm (Goldwasser)"
tube_red_xy = "E: table default (SMPTE-C primaries) kept: CRT.md has no primaries row for this set"
tube_green_xy = "E: table default (SMPTE-C primaries) kept: CRT.md has no primaries row for this set"
tube_blue_xy = "E: table default (SMPTE-C primaries) kept: CRT.md has no primaries row for this set"
tube_white_xy = "E: table default D65 kept, not sourced: CRT.md White point says US consumer sets were typically 7000 to 9300 K and PC monitors shipped at 9300 K by default [E]"
beam_fwhm_mid_mm = "E: CRT.md Measured and estimated spot sizes, consumer TV class 0.7 to 1.5 mm"
beam_fwhm_peak_mm = "E: CRT.md Measured and estimated spot sizes, consumer TV class peak 1.5 to 2 mm"
beam_growth_exponent = "E: CRT.md T-63 item 7, TV presets about 0.42, floor non-negative for 0.75 -> 1.5 [T-87: was D; 0.42 is borrowed from a Panasonic 76 cm tube; no data for this tube]"
amp_bandwidth_mhz = "E: CRT.md RGB path table, cheap consumer TV RGB 4 to 8 MHz"
amp_fall_rise_ratio = "E: below 1, isolated bright pixels dimmer (CRT.md adjacent-pixel nonlinearity)"
amp_samples = "D: presets::recommended_amp_k: edge sigma 0.1325 x 5.37 MHz / 5 MHz = 0.142 source px, above 0.02 so K = 16"
geometry_curvature = "D: CRT.md Faceplate curvature: spherical 1R, most pre-1990 TVs and monitors; no data for this set"
geometry_radius_mm = "D: CRT.md Faceplate curvature: 1R = 1.767 x 330 mm diagonal (derived from the 440 triad count, itself derived) = 583 mm; the 14 in row of CRT.md gives about 0.63 m"
abl_enable = "E: CRT.md ABL, consumer TVs limit; the 1.4 mA value is an RCA TV value (T-63) for another tube, no value for a 13 in set (flagged)"
abl_threshold_ma = "E: CRT.md T-63, RCA/Thomson average limiter 1.4 mA (RCA value, not for this set) [T-87: was S; the 1.4 mA is an RCA/Thomson value from another tube]"
abl_tau_s = "E: CRT.md T-63, steady state about 0.5 s (RCA US 4,330,792), tau = 0.5 / 3 s [T-87: was D; tau = 0.5/3 s rests on a first-order assumption and an RCA value from another tube]"
phosphor_persistence = "D: CRT.md Decay and persistence and T-63 item 1: all presets are P22, persistence on with the Kuhn (2002) constants of crt_model::phosphor (E1/E0 5.36 % green, 4.72 % blue at 60 Hz); the exact P22 variant of this tube is unknown [T-87: was D; D covers only the first-frame energy ratios E1/E0; the tail beyond 2 ms is E (phosphor_tail_strength_rgb)]"
phosphor_tail_strength_rgb = "E: CRT.md Decay and persistence: 1 = the measured Kuhn power-law tail; Ni-killed sulfides would cut the 8 ms residual 4 to 13 times (US 5,825,124) but CRT.md has no statement for this tube, so the reduction is not applied (allowed range 0.07 to 1) [T-87: was S; the Kuhn P22 power-law tail is extrapolated beyond 2 ms from another sample, not measured on this tube]"
geometry_conv_red_radial_mm = "E: CRT.md Starting presets, convergence error corners 0.5 to 1.5 mm (TV): midpoint 1.0 mm at the corner as the radial term; CRT.md gives no centre value for TVs, so the static offset stays 0; red outward and blue inward by the mirror-image rule (CRT.md Convergence), green is the reference"
geometry_conv_blue_radial_mm = "E: CRT.md Starting presets, convergence error corners 0.5 to 1.5 mm (TV): midpoint 1.0 mm at the corner as the radial term; CRT.md gives no centre value for TVs, so the static offset stays 0; red outward and blue inward by the mirror-image rule (CRT.md Convergence), green is the reference"
exposure = "D: D65 white: the unmasked white maps to panel white at exposure 1 (largest linear sRGB channel 1). Not a no-clip statement: the mask and scanline peaks lift elements above it (headroom readout 3.872 on 2560 x 1440), handled by output_headroom_mode (T-84)"
output_match_srgb = "E: COL-2, tube-faithful presets"
output_dither = "E: COL-4, noise dither for presets"
mask_depth = "E: T-84b (owner decision 2026-11-19, default to C; user-tunable, no source): a compromise, measured by the flat-white chain test on 2560 x 1440 (320 x 240 source, ABL off): keeps 56.9 % of the intended white at 0.25 against 40.2 % at the parameter default 0.5; about 0.05 would keep 85 % but leaves a nearly flat mask (see notes)"
optics_glass_thickness_mm = "E: CRT.md Research pass T-63 item 8 (no sourced value below 400 mm diagonal; 10 mm stays an estimate)"
