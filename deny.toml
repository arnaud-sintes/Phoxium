# Licence policy, same as scripts/licence-policy.ps1 (used by package.ps1 and check.ps1) and DESIGN.md 11:
# permissive licences only; GPL, LGPL and AGPL denied. Run: cargo deny check licenses
# (scripts/check.ps1 and scripts/package.ps1 run it when cargo-deny is installed).
[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
]
# GPL, LGPL and AGPL are simply absent from the allow list (denied). A dependency under such a licence needs a
# written justification in DESIGN.md 11 and a named entry under [[licenses.exceptions]] below, never a wider
# allow list. There is no exception today.
# The dear-imgui-* crates (T-52a) declare MIT OR Apache-2.0 but ship no LICENSE file: the upstream notices of the
# C/C++ they vendor (Dear ImGui, cimgui, both MIT) are in THIRD-PARTY.md, appended to the release zip.

# The workspace crates declare license = "MIT" (Cargo.toml, [workspace.package]), which is in the allow list, so
# they are checked like any other crate.
