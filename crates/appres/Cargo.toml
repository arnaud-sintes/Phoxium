[package]
name = "appres"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Application icon and Windows resources: ICO writer and reader, .res writer (icon group, VERSIONINFO), PE resource reader (build-time and test tool)"

# No dependency: the build scripts of ultimatecrt and pixel-demo use it to turn assets/icon/*.ico into a .res
# file that the MSVC linker embeds (no rc.exe needed), and the tests use its PE reader on the built executables.
[dependencies]

[dev-dependencies]
# PNG encoder for the gen_icon example only (MIT OR Apache-2.0), already in the tree.
png = "0.18"
