[package]
name = "pixel-demo"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Demo pixel-art source window, capture target for ultimatecrt"

[dependencies]
png = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Executable icon and VERSIONINFO as a .res file for the linker (workspace crate, no dependency).
appres = { path = "../appres" }

[dev-dependencies]
# PE resource reader for tests/exe_resources.rs.
appres = { path = "../appres" }
